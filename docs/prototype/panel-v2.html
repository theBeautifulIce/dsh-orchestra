body.v3 .board{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;
  align-items:start;background:none;
}
body.v3 .bcol{background:none;border:0;padding:0;min-width:0}
body.v3 .bcol-head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:0 0 9px;border-bottom:1px solid var(--line2);margin-bottom:10px;
}
body.v3 .bcol-name{font-size:10.5px;letter-spacing:.6px;color:var(--ink2);font-weight:600}
body.v3 .bcol-count{font-family:var(--mono);font-size:9px;color:var(--ink4)}
body.v3 .bcol-drop{min-height:80px}
body.v3 .task-card{
  position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:0;padding:14px 15px 12px;margin-bottom:10px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
body.v3 .task-card:hover{border-color:var(--line2);background:#fffefa}

body.v3 .tc-head{display:flex;align-items:center;gap:8px;min-height:14px}

  border:1px solid var(--line);padding:1px 5px;line-height:1.4;
}

body.v3 .tc-type.t-manual{color:#5c5a64;border-color:#d9d5ce}
body.v3 .tc-pri{font-family:var(--mono);font-size:8.5px;color:var(--ink3);letter-spacing:.4px}
body.v3 .tc-pri.p0{color:var(--accent);font-weight:700}
body.v3 .tc-when{margin-left:auto;font-size:9px;color:var(--ink3);white-space:nowrap}
body.v3 .tc-title{

}

  display:flex;align-items:baseline;gap:5px;
}

}

body.v3 .tc-next{margin-top:5px;font-size:10.5px;line-height:1.55;color:var(--ink3)}

}

body.v3 .tc-foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:9px;color:var(--ink3)}

body.v3 .tc-history{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
body.v3 .history-row{

}

body.v3 .tasks-list-table .tt-title{font-size:12.5px;font-weight:600;color:var(--ink)}
body.v3 .tasks-list-table .tt-sub{font-size:9.5px;color:var(--ink3);margin-top:2px}

/* workflows */
body.v3 .wf-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:38px;align-items:start}

  min-width:0;background:none;border:0;border-radius:0;box-shadow:none;padding:0;
}
body.v3 .wf-side-head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:0 0 9px;border-bottom:1px solid var(--ink);
}

body.v3 .wf-side-head span:last-child{font-family:var(--mono);font-size:9px;color:var(--ink3)}
body.v3 .wf-list-item{
  display:block;width:100%;text-align:left;padding:13px 0;border:0;border-bottom:1px solid var(--line);
  background:none;position:relative;
}
body.v3 .wf-list-item:hover{background:none}
body.v3 .wf-list-item.on:after{display:none}
body.v3 .wf-li-top{display:flex;align-items:baseline;gap:8px;min-width:0}
body.v3 .wf-li-name{font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.v3 .wf-list-item.on{border-bottom-color:var(--ink3)}

body.v3 .wf-list-item.on .wf-li-ver{color:var(--accent)}
body.v3 .wf-li-ver{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--ink4);flex:none}
body.v3 .wf-li-sub{font-size:9.5px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.v3 .wf-li-bottom{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:8.5px;color:var(--ink4)}
body.v3 .wf-li-bottom .health-bar{flex:1;height:1px;background:var(--line);overflow:hidden}
body.v3 .wf-li-bottom .health-bar i{display:block;height:1px;background:var(--green)}
body.v3 .wf-detail{min-width:0}
body.v3 .wf-head{display:flex;align-items:flex-start;justify-content:space-between;gap:22px}
body.v3 .wf-kicker{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
body.v3 .wf-title{font-family:var(--font-display);font-size:32px;line-height:1.2;font-weight:600;margin:0;letter-spacing:-.5px}
body.v3 .wf-desc{margin:8px 0 0;font-size:11.5px;line-height:1.7;color:var(--ink2);max-width:640px}
body.v3 .wf-head-actions{display:flex;align-items:center;gap:8px;flex:none;padding-top:2px}
body.v3 .wf-meta{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:9.5px;color:var(--ink3);flex-wrap:wrap}
body.v3 .wf-meta b{font-weight:500;color:var(--ink2)}
body.v3 .wf-meta .sep{color:var(--ink4)}
body.v3 .wf-tabs{
  display:flex;align-items:center;gap:22px;margin-top:24px;
  border-bottom:1px solid var(--line);
}
body.v3 .wf-tab{
  padding:0 0 9px;border:0;border-bottom:1px solid transparent;background:none;
  font-size:11.5px;color:var(--ink3);
}
body.v3 .wf-tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
body.v3 .wf-tab .n{font-family:var(--mono);font-size:8.5px;color:var(--ink4);margin-left:4px}
body.v3 .wf-statline{display:flex;align-items:center;gap:0;margin:16px 0 20px;padding:12px 0;border-bottom:1px solid var(--line)}
body.v3 .wf-stat{padding:0 24px;border-left:1px solid var(--line)}
body.v3 .wf-stat:first-child{padding-left:0;border-left:0}
body.v3 .wf-stat b{display:block;font-family:var(--font-display);font-size:20px;line-height:1.1;font-weight:500;color:var(--ink)}
body.v3 .wf-stat span{display:block;font-size:9px;color:var(--ink3);margin-top:4px;letter-spacing:.4px}
body.v3 .canvas-wrap{border:0;background:none;padding:0;overflow:auto}
body.v3 .canvas{
  position:relative;width:900px;height:430px;background:var(--paper);
  border:1px solid var(--line);overflow:hidden;
}

body.v3 .wf-node{
  position:absolute;width:142px;min-height:62px;padding:9px 10px 8px;
  background:var(--paper);border:1px solid var(--line2);border-radius:0;
  box-shadow:none;text-align:left;display:block;
}
body.v3 .wf-node:hover{border-color:var(--ink);background:#fffefa}
body.v3 .wf-node.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
body.v3 .wn-top{display:flex;align-items:center;gap:0}
body.v3 .wn-ico{display:none}
body.v3 .wn-title{font-size:11px;line-height:1.3;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.v3 .wn-code{display:none}
body.v3 .wn-sub{font-size:8px;line-height:1.4;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.v3 .wn-status{font-size:8.5px;color:var(--ink3);margin-top:5px;display:flex;align-items:center;gap:4px}
body.v3 .wn-status .dot{width:4px;height:4px;border-radius:50%}
body.v3 .canvas-legend{
  position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:12px;
  font-size:8.5px;color:var(--ink3);background:none;padding:0;border:0;
}
body.v3 .canvas-legend .dot{width:4px;height:4px;border-radius:50%;display:inline-block;margin-right:3px}
body.v3 .canvas-legend span:last-child{display:none}
body.v3 .canvas-hint{
  display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--ink3);
  margin-top:9px;line-height:1.6;
}
body.v3 .canvas-hint .ic{width:12px;height:12px}
body.v3 .version-row{
  display:grid;grid-template-columns:58px minmax(0,1fr) 100px 120px;
  gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);
}
body.v3 .version-v{font-family:var(--mono);font-size:10px;color:var(--ink3)}
body.v3 .version-row.current .version-v{color:var(--ink);font-weight:700}
body.v3 .version-main{font-size:11px;color:var(--ink2);line-height:1.6}
body.v3 .version-main b{color:var(--ink);font-weight:600}
body.v3 .version-tag{font-size:9px;color:var(--accent);margin-left:8px}
body.v3 .version-meta{font-size:9px;color:var(--ink3);text-align:right}

/* inbox */

}

body.v3 .summary-cell span{font-size:9.5px;color:var(--ink3);margin-left:5px;letter-spacing:.3px}
body.v3 .summary-cell.hot b{color:var(--accent)}
body.v3 .batchbar{

}

}

body.v3 .dec-choice{padding:10px 16px 10px 0;border-left:0;border-bottom:0;cursor:pointer;transition:background .15s}

body.v3 .inbox-list{border-top:0}

/* effects */

}

body.v3 .chips{display:flex;align-items:center;gap:19px;flex-wrap:wrap;margin-bottom:4px}

/* events */

  display:flex;align-items:center;gap:10px;padding:11px 0;

}

body.v3 .tbl{width:100%;border-collapse:collapse}
body.v3 .tbl th{

}

body.v3 .event-outcome.ok{color:var(--green)}
body.v3 .event-outcome.wait{color:var(--amber)}

/* drawers */
body.v3 .overlay{background:rgba(28,26,23,.42);backdrop-filter:blur(2px)}
body.v3 .drawer{

}
body.v3 .drawer-head{padding:30px 34px 18px;border-bottom:1px solid var(--line);position:relative}

body.v3 .drawer-close:hover{color:var(--ink)}
body.v3 .drawer-kicker{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
body.v3 .drawer-title{

}

  font-size:11px;color:var(--ink3);
}
body.v3 .drawer-tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
body.v3 .drawer-tab .n{font-family:var(--mono);font-size:8px;color:var(--ink4);margin-left:4px}
body.v3 .drawer-body{padding:24px 34px 34px;background:var(--bg)}
body.v3 .section{margin-bottom:24px}
body.v3 .section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line2)}
body.v3 .section-h h3{margin:0;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2);font-weight:600}
body.v3 .section-h .right{font-size:9px;color:var(--ink3)}
body.v3 .card-box{
  padding:14px 0;border:0;border-top:1px solid var(--line);background:none;
}
body.v3 .card-box.tint{background:none}
body.v3 .policy-k{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}

  display:flex;align-items:flex-start;justify-content:space-between;gap:18px;

}

body.v3 .run-steps{border-top:1px solid var(--line)}

body.v3 .step-mark .ic{width:9px;height:9px}
body.v3 .run-step .st{font-size:11.5px;color:var(--ink);font-weight:500;line-height:1.4}
body.v3 .run-step .sd{font-size:9.5px;color:var(--ink3);line-height:1.5;margin-top:2px}

body.v3 .ot-branch{padding-left:0}
body.v3 .ot-child{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--ink2)}

body.v3 .run-history{border-top:1px solid var(--line)}
body.v3 .run-history-row{
  display:grid;grid-template-columns:44px 8px minmax(0,1fr) 50px 38px 12px;gap:9px;

}
body.v3 .run-history-row:hover{background:#faf6ee}
body.v3 .run-history-row.sel{color:var(--ink)}
body.v3 .run-history-row .id{display:none}
body.v3 .run-history-row .t{font-family:var(--mono);font-size:8.5px}
body.v3 .run-history-row .dot{width:4px;height:4px;border-radius:50%}
body.v3 .run-history-row .dur{font-family:var(--mono);font-size:8.5px;text-align:right}

/* modal */
body.v3 .modal-back{background:rgba(28,26,23,.46);backdrop-filter:blur(3px)}
body.v3 .modal{
  width:min(580px,92vw);background:var(--paper);border:1px solid var(--line2);
  border-radius:0;box-shadow:var(--shadow2);
}
body.v3 .modal-head{padding:24px 28px 16px;border-bottom:1px solid var(--line)}
body.v3 .modal-kicker{font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
body.v3 .modal-title{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.3;font-weight:600;letter-spacing:-.3px}
body.v3 .modal-close{color:var(--ink3);width:28px;height:28px}
body.v3 .modal-body{padding:20px 28px 24px}
body.v3 .modal-foot{padding:14px 28px;border-top:1px solid var(--line);background:var(--paper2);display:flex;align-items:center;gap:8px}
body.v3 .modal-summary{
  display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;
  padding:0 0 14px;margin-bottom:16px;border-bottom:1px solid var(--line);
}
body.v3 .modal-summary div{min-width:0}
body.v3 .modal-summary dt{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
body.v3 .modal-summary dd{margin:0;font-size:11px;color:var(--ink);line-height:1.5;word-break:break-word}
body.v3 .field{margin-bottom:13px}
body.v3 .field > label{display:block;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:5px}
body.v3 .field .req{color:var(--accent);font-weight:500;letter-spacing:0;text-transform:none;font-size:8.5px}
body.v3 .field input[type=text],body.v3 .field input:not([type]),body.v3 .field select,body.v3 .field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:0;
  background:var(--paper);font-size:11.5px;color:var(--ink);outline:0;
}
body.v3 .field input:focus,body.v3 .field select:focus,body.v3 .field textarea:focus{border-color:var(--ink)}
body.v3 .field textarea{min-height:76px;resize:vertical;line-height:1.6}
body.v3 .option-list{border-top:1px solid var(--line)}
body.v3 .opt-card{

}

body.v3 .opt-title{font-size:12px;font-weight:600;color:var(--ink);line-height:1.5}
body.v3 .opt-desc{font-size:9.5px;color:var(--ink3);line-height:1.6;margin-top:2px}

  display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);margin-top:2px;
}

body.v3 .check-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

body.v3 .check-row .cd{font-size:9.5px;color:var(--ink3);line-height:1.6;margin-top:2px}
body.v3 .toast{

/* responsive */
@media (max-width:1280px){
  body.v3 #screen{padding:38px 34px 60px}
  body.v3 .overview-grid{grid-template-columns:minmax(0,1.45fr) minmax(260px,.7fr);gap:26px}
  body.v3 .ops-body{grid-template-columns:minmax(0,1fr) 190px}
  body.v3 .board{gap:12px}
  body.v3 .task-tools{gap:12px}
  body.v3 .mini-search{width:120px}
}
@media (max-width:1120px){
  body.v3 .sidebar{width:200px;padding:26px 18px 18px}
  body.v3 .main{margin-left:200px}
  body.v3 .topbar{padding:0 28px}
  body.v3 .overview-grid{grid-template-columns:1fr;gap:30px}
  body.v3 .asks{border-top:1px solid var(--ink);padding-top:14px}
  body.v3 .ask{display:inline-block;width:33%;vertical-align:top;padding-right:18px;border-top:0}
  body.v3 .ask + .ask{border-left:1px solid var(--line);padding-left:18px}
  body.v3 .rail-more{margin-top:4px}
  body.v3 .stats-strip{grid-template-columns:repeat(2,1fr)}
  body.v3 .stat:nth-child(3){border-left:0;padding-left:0;border-top:1px solid var(--line)}
  body.v3 .stat:nth-child(4){border-top:1px solid var(--line)}
  body.v3 .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  body.v3 .wf-layout{grid-template-columns:210px minmax(0,1fr);gap:26px}
  body.v3 .effect-card{grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr) 60px;gap:18px}

@media (max-width:900px){
  body.v3 .sidebar{position:static;width:auto;height:auto;padding:18px 20px;border-right:0;border-bottom:1px solid var(--line);display:block}
  body.v3 .main{margin-left:0}
  body.v3 .brand{padding-bottom:14px}
  body.v3 .workspace{margin-bottom:12px;padding-bottom:12px}
  body.v3 .nav-scroll{display:flex;align-items:center;gap:18px;overflow-x:auto;padding-bottom:2px}
  body.v3 .nav-label{display:none}
  body.v3 .nav-item{width:auto;height:30px;flex:none;font-size:12px}
  body.v3 .nav-item.on:after{display:none}

/* ============================================================
   V4 · DSH PLUGIN SURFACE
   Dark, dense, quiet. Built for an operator looking at state,
   not for a marketing page. All overrides scoped to body.v4.
   ============================================================ */
body.v5{
  --bg:#f4f7fb;
  --paper:#ffffff;
  --paper2:#f8fafc;
  --paper3:#f1f5f9;
  --ink:#0f172a;
  --ink2:#475569;
  --ink3:#94a3b8;
  --ink4:#cbd5e1;
  --line:#e2e8f0;
  --line2:#cbd5e1;
  --accent:#0f766e;
  --accent2:#ccfbf1;
  --green:#15803d;
  --green2:#dcfce7;
  --amber:#b45309;
  --amber2:#fef3c7;
  --red:#dc2626;
  --red2:#fee2e2;
  --blue:#2563eb;
  --blue2:#dbeafe;
  --violet:#7c3aed;
  --violet2:#ede9fe;
  --dark:#f8fafc;
  --dark2:#eef2f7;

  --dark-muted:#94a3b8;

  --shadow:0 1px 2px rgba(15,23,42,.04);

  background-repeat:no-repeat;
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:13px;
  line-height:1.55;
  letter-spacing:.005em;
}

body.v5 ::-webkit-scrollbar{width:10px;height:10px}

body.v5 .page{animation:none}
body.v5 .card-box,body.v5 .panel,body.v5 .isum,body.v5 .inbox-summary,
body.v5 .table-wrap,body.v5 .effect-card,body.v5 .dec-card,body.v5 .task-card,
body.v5 .wf-list-item,body.v5 .wf-detail,body.v5 .orchestra,body.v5 .attention,
body.v5 .metric,body.v5 .run-hero,body.v5 .evidence-item{
  border-radius:8px;box-shadow:none;
}
body.v5 .tag,body.v5 .type,body.v5 .status,body.v5 .chip,body.v5 .etype,
body.v5 .nb,body.v5 .anno,body.v5 .kbd{border-radius:4px;box-shadow:none}
body.v5 .tag{
  height:auto!important;padding:0!important;border:0!important;background:none!important;
  font-size:9.5px!important;letter-spacing:.08em;text-transform:uppercase;
  color:#64748b!important;font-weight:600;
}
body.v5 .tag.red{color:#b91c1c!important}
body.v5 .tag.amber{color:#b45309!important}
body.v5 .tag.green{color:#15803d!important}
body.v5 .tag.violet,body.v5 .tag.blue{color:#64748b!important}
body.v5 .type{
  height:auto!important;padding:0!important;border:0!important;background:none!important;
  font-size:9.5px!important;letter-spacing:.08em;color:#64748b!important;font-weight:600;
  display:inline-flex;align-items:center;gap:0;
}
body.v5 .type .ic{display:none}
body.v5 .status{
  height:auto!important;padding:0!important;border:0!important;background:none!important;
  font-size:10.5px!important;color:#1e293b!important;display:inline-flex;align-items:center;gap:5px;
}
body.v5 .status .dot{width:5px!important;height:5px!important;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.03)}
body.v5 .chip{
  height:26px;padding:0 10px;border:1px solid transparent;border-radius:5px;
  background:none!important;color:#64748b;font-size:11.5px;white-space:nowrap;
}
body.v5 .chip:hover{color:#0f172a;background:#ffffff!important}
body.v5 .chip.on{border-color:#e2e8f0;background:#ffffff!important;color:#0f172a;font-weight:550}
body.v5 .empty{padding:26px 0;border-top:1px dashed #bfdbfe;color:#64748b;font-size:11.5px;text-align:left}
body.v5 .anno{display:none}
body.v5 .callout{
  padding:9px 11px;border:1px solid #e2e8f0;border-radius:6px;
  background:#ffffff;color:#64748b;font-size:11px;line-height:1.6;
}
body.v5 .callout .ic{display:none}
body.v5 .callout.danger{border-color:#fecaca;color:#b91c1c;background:#fef2f2}
body.v5 .callout.warn{border-color:#fde68a;color:#b45309;background:#fffbeb}
body.v5 .callout.info{border-color:#e2e8f0;color:#1e293b;background:#ffffff}
body.v5 .path-note{margin:10px 0 0;color:#64748b;font-size:10.5px;line-height:1.6}
body.v5 .muted{color:#64748b}

/* toolbar, filters, view switch */
body.v5 .task-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin:0 0 12px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#ffffff;
}
body.v5 .filters{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
body.v5 .filter{
  height:25px;padding:0 9px;border:1px solid transparent;border-radius:5px;
  background:none;color:#64748b;font-size:11.5px;
}
body.v5 .filter:hover{background:#ffffff;color:#0f172a}
body.v5 .filter.on{background:#ffffff;border-color:#e2e8f0;color:#0f172a;font-weight:550}
body.v5 .filter .n{font-family:var(--mono);font-size:9px;color:#64748b;margin-left:2px}
body.v5 .filter.on .n{color:var(--accent)}
body.v5 .task-tools{display:flex;align-items:center;gap:8px}
body.v5 .mini-search{
  width:190px;height:26px;padding:0 8px;border:1px solid #e2e8f0;border-radius:5px;
  background:#ffffff;display:flex;align-items:center;gap:6px;color:#64748b;
}
body.v5 .mini-search input{width:100%;border:0;background:none;color:#0f172a;font-size:11px;outline:none}
body.v5 .mini-search input::placeholder{color:#64748b}
body.v5 .view-switch{display:flex;gap:2px;padding:2px;border:1px solid #e2e8f0;border-radius:6px;background:#ffffff}
body.v5 .view-btn{height:21px;padding:0 9px;border:0;border-radius:4px;background:none;color:#64748b;font-size:11px}
body.v5 .view-btn.on{background:#ffffff;color:#0f172a;font-weight:550}

/* board */
body.v5 .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
body.v5 .bcol{min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:#ffffff;min-height:180px}
body.v5 .bcol-head{display:flex;align-items:center;gap:7px;padding:2px 2px 8px;border-bottom:1px solid #e2e8f0;margin-bottom:8px}
body.v5 .bcol-name{font-size:11px;font-weight:600;letter-spacing:.03em;color:#64748b}
body.v5 .bcol-count{font-family:var(--mono);font-size:9.5px;color:#64748b}
body.v5 .bcol-drop{display:flex;flex-direction:column;gap:8px}
body.v5 .task-card{
  position:relative;padding:11px 11px 9px;border:1px solid #e2e8f0;border-radius:7px;
  background:#ffffff;cursor:pointer;transition:border-color .12s,background .12s,transform .12s;
}
body.v5 .task-card:before{display:none!important}
body.v5 .task-card:hover{border-color:#e2e8f0;background:#ffffff;transform:translateY(-1px)}
body.v5 .task-card.needs{border-color:#fde68a}
body.v5 .tc-head{display:flex;align-items:center;gap:7px;font-size:9.5px;color:#64748b}
body.v5 .tc-type{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#64748b;font-weight:600}
body.v5 .tc-type.t-scheduled{color:#b45309}
body.v5 .tc-type.t-continuous{color:#2563eb}
body.v5 .tc-type.t-event{color:#6d28d9}
body.v5 .tc-type.t-manual{color:#15803d}
body.v5 .tc-pri{font-family:var(--mono);font-size:9px;color:#64748b}
body.v5 .tc-pri.p0{color:#b91c1c}
body.v5 .tc-when{margin-left:auto;font-family:var(--mono);font-size:9px;color:#64748b}
body.v5 .tc-title{margin:7px 0 6px;font-size:12.5px;line-height:1.45;font-weight:580;color:#0f172a;letter-spacing:-.005em}
body.v5 .tc-stage{display:flex;align-items:flex-start;gap:5px;font-size:11px;line-height:1.5;color:#1e293b}
body.v5 .tc-stage .dot{width:4px;height:4px;margin-top:6px;flex:none;border-radius:50%}
body.v5 .tc-result,body.v5 .tc-next{margin-top:4px;font-size:10.5px;line-height:1.55;color:#64748b}
body.v5 .tc-result b,body.v5 .tc-next b{font-weight:600;color:#64748b}
body.v5 .tc-call{
  margin-top:7px;padding:5px 7px;border:1px solid #fde68a;border-radius:5px;
  background:#fffbeb;color:#b45309;font-size:10.5px;line-height:1.5;
}
body.v5 .tc-progress{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:9.5px;color:#64748b}
body.v5 .tc-progress em{font-family:var(--mono);font-style:normal;font-size:9px;color:#1e293b}
body.v5 .pbar{height:3px;flex:1;border-radius:2px;background:#ffffff;overflow:hidden}
body.v5 .pbar span{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#0f766e,var(--accent))}
body.v5 .tc-foot{
  display:flex;align-items:center;gap:5px;margin-top:8px;padding-top:6px;
  border-top:1px solid #e2e8f0;font-size:9.5px;color:#64748b;flex-wrap:wrap;
}
body.v5 .hist-btn{margin-left:auto;height:20px;padding:0 6px;border:1px solid #e2e8f0;border-radius:4px;background:transparent;color:#64748b;font-size:9px}
body.v5 .hist-btn:hover{border-color:#e2e8f0;color:#0f172a}
body.v5 .history-pop{margin-top:6px;padding-top:6px;border-top:1px solid #e2e8f0}
body.v5 .history-row{font-size:9px;color:#64748b}

/* generic tables */
body.v5 .table-wrap{border:1px solid var(--line);border-radius:8px;background:#ffffff;overflow:auto}
body.v5 .tbl{width:100%;border-collapse:collapse;font-size:11.5px}
body.v5 .tbl th{
  padding:8px 10px;border-bottom:1px solid #e2e8f0;background:#f8fafc;
  text-align:left;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#64748b;
}
body.v5 .tbl td{padding:9px 10px;border-bottom:1px solid #e2e8f0;color:#0f172a;vertical-align:top}
body.v5 .tbl tr:last-child td{border-bottom:0}
body.v5 .tbl tbody tr{cursor:pointer}
body.v5 .tbl tbody tr:hover td{background:#ffffff;color:#0f172a}
body.v5 .tbl .mono{font-family:var(--mono);font-size:10.5px;color:#64748b}
body.v5 .estate{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:#64748b}
body.v5 .estate:before{content:'';width:4px;height:4px;border-radius:50%;background:#1d4ed8;flex:none}
body.v5 .estate.ok{color:#15803d}
body.v5 .estate.ok:before{background:#15803d}
body.v5 .estate.bad{color:#b91c1c}
body.v5 .estate.bad:before{background:#b91c1c}
body.v5 .estate.wait{color:#b45309}
body.v5 .estate.wait:before{background:#b45309}
body.v5 .estate.run{color:#2563eb}
body.v5 .estate.run:before{background:#2563eb}

/* task workflow view: a run, not a row */
body.v5 .tw-list{display:flex;flex-direction:column;gap:10px}
body.v5 .tw-run{border:1px solid var(--line);border-radius:9px;background:#ffffff;overflow:hidden}
body.v5 .tw-run.active{border-color:#99f6e4}
body.v5 .tw-head{
  display:flex;align-items:flex-start;gap:14px;padding:13px 14px 11px;border-bottom:1px solid #e2e8f0;
  background:linear-gradient(180deg,#eff6ff,#eff6ff);
}
body.v5 .tw-head-main{min-width:0;flex:1}
body.v5 .tw-eyebrow{display:flex;align-items:center;gap:7px;font-size:9.5px;color:#64748b;flex-wrap:wrap}
body.v5 .tw-eyebrow b{font-weight:600;color:#64748b}
body.v5 .tw-title{margin:5px 0 3px;font-size:14px;line-height:1.4;font-weight:600;color:#0f172a;letter-spacing:-.01em}
body.v5 .tw-sub{font-size:11px;line-height:1.55;color:#64748b}
body.v5 .tw-head-side{display:flex;align-items:center;gap:6px;flex:none;padding-top:2px}
body.v5 .tw-progress{display:flex;align-items:center;gap:8px;min-width:150px;padding-top:4px}
body.v5 .tw-progress .pbar{width:88px;flex:none}
body.v5 .tw-progress span{font-family:var(--mono);font-size:10px;color:#64748b}
body.v5 .tw-head{cursor:pointer;transition:background .12s}
body.v5 .tw-head:hover{background:#f8fafc}
body.v5 .tw-track{display:flex;flex-direction:column;gap:0;padding:0 4px}
body.v5 .tw-step{
  display:grid;grid-template-columns:58px minmax(0,1fr) minmax(280px,.88fr);gap:0 18px;
  width:100%;padding:15px 16px 16px 10px;border:0;border-bottom:1px solid #e2e8f0;
  background:transparent;text-align:left;cursor:pointer;transition:background .12s;
}
body.v5 .tw-step:last-child{border-bottom:0}
body.v5 .tw-step:hover{background:#f8fafc}
body.v5 .tw-step.on{background:#f0fdfa}
body.v5 .tw-step.is-blocked{background:#fffbeb}
body.v5 .tw-step.is-fail{background:#fef2f2}
body.v5 .tw-step-rail{display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:1px}
body.v5 .tw-num{font-family:var(--mono);font-size:13px;font-weight:600;color:#0f172a}
body.v5 .tw-step-state{font-size:9px;line-height:1.3;color:#64748b;text-align:center;white-space:nowrap}
body.v5 .tw-step.is-done .tw-step-state{color:#15803d}
body.v5 .tw-step.is-run .tw-step-state{color:#2563eb}
body.v5 .tw-step.is-blocked .tw-step-state,body.v5 .tw-step.is-fail .tw-step-state{color:#b45309}
body.v5 .tw-step-main{min-width:0}
body.v5 .tw-step-title{display:flex;align-items:center;gap:7px;margin:0 0 5px;font-size:13.5px;font-weight:600;color:#0f172a;line-height:1.4}
body.v5 .tw-step-title .dot{width:6px;height:6px;border-radius:50%;flex:none}
body.v5 .tw-step-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px;font-family:var(--mono);font-size:9.5px;color:#64748b}
body.v5 .tw-step-sub{font-size:11.5px;line-height:1.68;color:#334155}
body.v5 .tw-step-sub b,body.v5 .tw-step-result b{display:block;margin-bottom:2px;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8;font-weight:600}
body.v5 .tw-step-result{min-width:0;padding-left:16px;border-left:1px solid #e2e8f0;font-size:11.5px;line-height:1.68;color:#334155}
body.v5 .tw-step-result span{display:block}
body.v5 .tw-collapsed{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid #e2e8f0;background:#fbfdff;cursor:pointer;font-size:10.5px;color:#64748b}
body.v5 .tw-collapsed:hover{background:#f1f5f9}
body.v5 .tw-mini-track{display:flex;gap:3px;flex:none}
body.v5 .tw-mini-track i{display:block;width:18px;height:4px;border-radius:2px;background:#e2e8f0}
body.v5 .tw-mini-track i.is-done{background:#86efac}
body.v5 .tw-mini-track i.is-run{background:#60a5fa}
body.v5 .tw-mini-track i.is-blocked,body.v5 .tw-mini-track i.is-fail{background:#fbbf24}
body.v5 .tw-collapsed b{margin-left:auto;flex:none;color:#0f766e;font-weight:600}
body.v5 .tw-expand{height:26px;padding:0 9px;border:1px solid #e2e8f0;border-radius:5px;background:#ffffff;color:#475569;font-size:10px;white-space:nowrap}
body.v5 .tw-expand:hover{border-color:#99f6e4;color:#0f766e}
body.v5 .tw-detail{
  display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,.72fr);gap:0;
  border-top:1px solid #e2e8f0;background:#ffffff;
}
body.v5 .tw-detail-main{padding:14px 15px;min-width:0;border-right:1px solid #e2e8f0}
body.v5 .tw-detail-side{padding:14px 15px;min-width:0;background:#f8fafc}
body.v5 .tw-detail-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;font-weight:600}
body.v5 .tw-kv{display:grid;grid-template-columns:74px minmax(0,1fr);gap:6px 10px;font-size:11px;line-height:1.6;color:#64748b}
body.v5 .tw-kv dt{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#64748b;padding-top:1px}
body.v5 .tw-kv dd{margin:0;color:#1e293b}
body.v5 .tw-block{margin-top:11px;padding-top:10px;border-top:1px solid #e2e8f0}
body.v5 .tw-block:first-child{margin-top:0;padding-top:0;border-top:0}
body.v5 .tw-block h4{margin:0 0 4px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#64748b;font-weight:600}
body.v5 .tw-block p{margin:0;font-size:11px;line-height:1.65;color:#1e293b}
body.v5 .tw-code{
  margin-top:6px;padding:8px 9px;border:1px solid #e2e8f0;border-radius:5px;background:#f8fafc;
  font-family:var(--mono);font-size:10px;line-height:1.6;color:#0f766e;white-space:pre-wrap;word-break:break-word;
}
body.v5 .tw-evidence{display:flex;flex-direction:column;gap:5px}
body.v5 .tw-ev{display:flex;align-items:flex-start;gap:6px;font-size:10.5px;line-height:1.5;color:#64748b}
body.v5 .tw-ev .ic{width:11px;height:11px;margin-top:2px;color:#0f766e;flex:none}
body.v5 .tw-empty{padding:22px;border:1px dashed #bfdbfe;border-radius:8px;color:#64748b;font-size:11px;text-align:center}

/* workflows page */
body.v5 .wf-switch{display:flex;align-items:center;gap:3px;margin:0 0 10px;padding:3px;border:1px solid var(--line);border-radius:7px;background:#ffffff;overflow-x:auto}
body.v5 .wf-pill{
  height:29px;padding:0 11px;border:1px solid transparent;border-radius:5px;background:none;
  color:#64748b;font-size:11.5px;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
body.v5 .wf-pill:hover{background:#ffffff;color:#0f172a}
body.v5 .wf-pill.on{background:#f0fdfa;border-color:#99f6e4;color:#0f172a;font-weight:550}
body.v5 .wf-pill .ver{font-family:var(--mono);font-size:8.5px;color:#64748b}
body.v5 .wf-pill.on .ver{color:#0f766e}
body.v5 .wf-pill .live{width:4px;height:4px;border-radius:50%;background:#15803d}
body.v5 .wf-hero{border:1px solid var(--line);border-radius:9px;background:#ffffff;margin-bottom:10px}
body.v5 .wf-hero-top{display:flex;align-items:flex-start;gap:16px;padding:14px 15px 12px;border-bottom:1px solid #e2e8f0}
body.v5 .wf-hero-main{flex:1;min-width:0}
body.v5 .wf-hero-kicker{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;font-weight:600}
body.v5 .wf-hero-title{margin:4px 0 4px;font-size:17px;line-height:1.35;font-weight:620;color:#0f172a;letter-spacing:-.01em}
body.v5 .wf-hero-desc{margin:0;max-width:1000px;font-size:11.5px;line-height:1.6;color:#64748b}
body.v5 .wf-hero-actions{display:flex;gap:6px;flex:none;padding-top:1px}
body.v5 .wf-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:0}
body.v5 .wf-stat{padding:9px 15px 10px;border-right:1px solid #e2e8f0;min-width:0}
body.v5 .wf-stat:last-child{border-right:0}
body.v5 .wf-stat b{display:block;font-family:var(--mono);font-size:14px;font-weight:550;color:#0f172a;line-height:1.3}
body.v5 .wf-stat span{display:block;margin-top:1px;font-size:9.5px;color:#64748b}
body.v5 .wf-stat .good{color:#15803d}
body.v5 .wf-stat .warn{color:#b45309}
body.v5 .wf-tabs{display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);background:#f8fafc}
body.v5 .wf-tab{height:34px;padding:0 10px;border:0;border-bottom:2px solid transparent;background:none;color:#64748b;font-size:11.5px}
body.v5 .wf-tab:hover{color:#0f172a}
body.v5 .wf-tab.on{border-bottom-color:var(--accent);color:#0f172a;font-weight:550}
body.v5 .wf-tab .n{margin-left:4px;font-family:var(--mono);font-size:9px;color:#64748b}
body.v5 .wf-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;align-items:start;margin-top:10px}
body.v5 .wf-stage-panel{border:1px solid var(--line);border-radius:9px;background:#ffffff;overflow:hidden}
body.v5 .wf-stage-panel-head{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
body.v5 .wf-stage-panel-head b{font-size:11px;font-weight:600;color:#0f172a}
body.v5 .wf-stage-panel-head span{font-size:9.5px;color:#64748b}
body.v5 .wf-stage-list{display:flex;flex-direction:column}
body.v5 .wf-stage{
  display:block;padding:14px 16px 15px;border:0;border-bottom:1px solid #e2e8f0;background:none;text-align:left;cursor:pointer;
  transition:background .12s;
}
body.v5 .wf-stage:last-child{border-bottom:0}
body.v5 .wf-stage:hover{background:#ffffff}
body.v5 .wf-stage.on{background:#f0fdfa}
body.v5 .wf-stage-top{display:flex;align-items:center;gap:7px;font-size:10px;color:#64748b}
body.v5 .wf-stage-idx{font-family:var(--mono);font-size:9px;color:#64748b}
body.v5 .wf-stage-code{font-family:var(--mono);font-size:9px;color:#64748b;padding:1px 4px;border:1px solid #e2e8f0;border-radius:3px;background:#f8fafc}
body.v5 .wf-stage-state{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:10px;color:#64748b}
body.v5 .wf-stage-state .dot{width:5px;height:5px;border-radius:50%}
body.v5 .wf-stage.is-done .wf-stage-state{color:#15803d}
body.v5 .wf-stage.is-run .wf-stage-state{color:#2563eb}
body.v5 .wf-stage.is-blocked .wf-stage-state,.body.v5 .wf-stage.is-fail .wf-stage-state{color:#b45309}
body.v5 .wf-stage-title{margin:7px 0 5px;font-size:14px;font-weight:600;color:#0f172a;display:flex;align-items:center;gap:6px}
body.v5 .wf-stage-title .who{margin-left:auto;font-size:9.5px;font-weight:450;color:#64748b;font-family:var(--mono)}

body.v5 .tw-step{

  width:100%;min-height:88px;padding:11px 12px;border:0;border-bottom:1px solid #eef2f7;
  background:#fff;text-align:left;cursor:pointer;transition:background .12s;
}
body.v5 .tw-step:last-child{border-bottom:0}
body.v5 .tw-step:hover{background:#f8fafc}
body.v5 .tw-step.on{background:#f0fdfa}
body.v5 .tw-step.on .tw-num{color:#0f766e}
body.v5 .tw-step.is-blocked,body.v5 .tw-step.is-fail{background:#fffaf0}
body.v5 .tw-step.is-blocked.on,body.v5 .tw-step.is-fail.on{background:#fffbeb}
body.v5 .tw-step-rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:1px}
body.v5 .tw-num{font-family:var(--mono);font-size:10.5px;font-weight:600;color:#64748b}
body.v5 .tw-step-state{font-size:9px;line-height:1.25;color:#64748b;text-align:center;white-space:nowrap}
body.v5 .tw-step.is-done .tw-step-state{color:#15803d}
body.v5 .tw-step.is-run .tw-step-state{color:#2563eb}
body.v5 .tw-step.is-blocked .tw-step-state,body.v5 .tw-step.is-fail .tw-step-state{color:#b45309}
body.v5 .tw-step-main{min-width:0}
body.v5 .tw-step-title{font-size:13.5px;font-weight:600;color:#0f172a;line-height:1.35;margin:0 0 3px;display:flex;align-items:center;gap:6px}
body.v5 .tw-step-meta{font-size:10.5px;line-height:1.4;color:#64748b;margin-bottom:4px}
body.v5 .tw-step-sub{font-size:12px;line-height:1.52;color:#475569;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.v5 .tw-step-result{min-width:0;padding-left:10px;border-left:1px solid #eef2f7;font-size:11.5px;line-height:1.5;color:#475569}
body.v5 .tw-step-result b{display:block;margin-bottom:2px;font-size:9px;letter-spacing:.08em;color:#94a3b8;font-weight:600}
body.v5 .tw-step-result span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.v5 .tw-inspect{
  border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;
  position:sticky;top:64px;
}
body.v5 .tw-inspect-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid #eef2f7;background:#f8fafc}
body.v5 .tw-inspect-head b{font-size:11.5px;font-weight:600;color:#0f172a}
body.v5 .tw-inspect-head span{font-size:10px;color:#64748b}
body.v5 .tw-inspect-body{padding:12px}
body.v5 .tw-inspect-title{font-size:15px;line-height:1.4;font-weight:650;color:#0f172a;margin-bottom:2px}
body.v5 .tw-inspect-meta{font-size:11px;line-height:1.5;color:#64748b;margin-bottom:9px}
body.v5 .tw-inspect .tw-block{margin-top:10px;padding-top:10px}
body.v5 .tw-inspect .tw-block p{font-size:12.5px;line-height:1.62;color:#334155}
body.v5 .tw-inspect .tw-block h4{font-size:9.5px;letter-spacing:.06em;color:#94a3b8}
body.v5 .tw-inspect-empty{padding:18px 12px;font-size:12px;line-height:1.6;color:#64748b}
body.v5 .tw-empty-note{padding:18px;border:1px dashed #dbe3ee;border-radius:9px;background:#fbfdff;font-size:12px;color:#64748b;line-height:1.6}

/* 流程详情 · 去掉网站式页头和大统计条 */
body.v5 .wf-top{display:flex;align-items:flex-start;gap:16px;margin:2px 0 12px;flex-wrap:wrap}
body.v5 .wf-top-main{flex:1;min-width:0}
body.v5 .wf-top-kicker{font-size:10.5px;letter-spacing:.06em;color:#64748b}
body.v5 .wf-top h1{margin:3px 0 4px;font-size:24px;line-height:1.25;letter-spacing:-.02em;font-weight:650;color:#0f172a}
body.v5 .wf-top p{margin:0;font-size:12.5px;line-height:1.6;color:#64748b;max-width:860px}
body.v5 .wf-top-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:11px;color:#64748b}
body.v5 .wf-top-meta b{color:#0f172a;font-weight:600}
body.v5 .wf-top-actions{display:flex;align-items:center;gap:7px;flex:none;padding-top:2px}
body.v5 .wf-gate{display:flex;align-items:center;gap:6px;width:100%;margin:0 0 10px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc;font-size:11.5px;color:#64748b}
body.v5 .wf-trigger-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:12px;color:#64748b}
body.v5 .wf-gate.ok{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
body.v5 .wf-gate.wait{border-color:#fde68a;background:#fffbeb;color:#92400e}
body.v5 .wf-body{grid-template-columns:minmax(0,1fr) 400px;gap:12px}
body.v5 .wf-aside{top:64px}
body.v5 .wf-stage{display:grid;grid-template-columns:26px minmax(0,1fr) 86px;gap:10px;align-items:start;min-height:88px;padding:10px 12px}
body.v5 .wf-stage.on{background:#f0fdfa}
body.v5 .wf-stage-top{grid-column:1/4;display:flex;align-items:center;gap:6px;font-size:10px;color:#64748b;margin-bottom:-2px}
body.v5 .wf-stage-body{grid-column:2;min-width:0}
body.v5 .wf-stage-idx{font-family:var(--mono);font-size:9.5px;color:#94a3b8}
body.v5 .wf-stage-code{display:none}
body.v5 .wf-stage-state{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:10px;color:#64748b}
body.v5 .wf-stage-title{font-size:13.5px;font-weight:600;color:#0f172a;line-height:1.35;margin:0 0 2px;display:flex;align-items:center;gap:6px}
body.v5 .wf-stage-title .who{margin-left:0;font-size:10px;font-weight:450;color:#64748b;font-family:inherit}
body.v5 .wf-stage-process{font-size:12px;line-height:1.5;color:#475569;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.v5 .wf-stage-result{margin-top:4px;padding:0;border:0;background:none;font-size:11.5px;line-height:1.5;color:#475569;display:block}
body.v5 .wf-stage-result b{display:inline;margin-right:5px;font-size:9px;letter-spacing:.05em;color:#0f766e;padding-top:0}
body.v5 .wf-stage-foot{grid-column:3;grid-row:2/4;display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin:0;font-size:10px;color:#64748b;text-align:right}
body.v5 .wf-stage-foot .wf-stage-dur{font-size:10px;color:#94a3b8}
body.v5 .wf-stage-foot .wf-stage-open{font-size:10.5px;color:#0f766e;font-weight:550}
body.v5 .wf-inspector-title{font-size:15px;line-height:1.4;font-weight:650}
body.v5 .wf-inspector-meta{font-size:11px;margin-bottom:9px}
body.v5 .wf-inspector .tw-block p{font-size:12.5px;line-height:1.6}
body.v5 .wf-inspector .tw-block h4{font-size:9.5px;letter-spacing:.06em}
body.v5 .wf-stage-list{padding:0}
body.v5 .wf-stage-panel-head{padding:9px 12px}
body.v5 .wf-stage-panel-head b{font-size:11.5px}
body.v5 .wf-stage-panel-head span{font-size:10.5px}

/* 待决定 · 已处理折叠、批量条 */
body.v5 .batch-check{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#475569;cursor:pointer}
body.v5 .batch-check input{width:14px;height:14px;accent-color:#0f766e}
body.v5 .inbox-processed{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
body.v5 .inbox-processed>summary{cursor:pointer;list-style:none;padding:10px 12px;font-size:11.5px;color:#64748b;background:#f8fafc}
body.v5 .inbox-processed>summary::-webkit-details-marker{display:none}
body.v5 .inbox-processed>summary:before{content:'+';font-family:var(--mono);margin-right:6px;color:#94a3b8}
body.v5 .inbox-processed[open]>summary:before{content:'−'}
body.v5 .inbox-processed .inbox-list{padding:0 10px 10px}
body.v5 .inbox-processed .dec-card{opacity:.78}

@media (max-width:1400px){
  body.v5 .tw-shell{grid-template-columns:250px minmax(0,1fr) 360px}
  body.v5 .wf-body{grid-template-columns:minmax(0,1fr) 360px}
}
@media (max-width:1180px){
  body.v5 .tw-shell{grid-template-columns:1fr}
  body.v5 .tw-rail{position:static;max-height:none;display:flex;overflow-x:auto}
  body.v5 .tw-rail-head{display:none}
  body.v5 .tw-task{min-width:240px;border-bottom:0;border-right:1px solid #eef2f7}
  body.v5 .tw-task:last-child{border-right:0}
  body.v5 .tw-inspect{position:static}
  body.v5 .wf-body{grid-template-columns:1fr}
  body.v5 .wf-aside{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  body.v5 .wf-mind{flex-wrap:wrap}
  body.v5 .wf-mind-stats{width:100%;margin-left:55px}
}
@media (max-width:760px){
  body.v5 .tw-step{grid-template-columns:26px minmax(0,1fr)}
  body.v5 .tw-step-result{grid-column:2;border-left:0;padding-left:0}
  body.v5 .wf-stage{grid-template-columns:26px minmax(0,1fr)}
  body.v5 .wf-stage-foot{grid-column:2;grid-row:auto;flex-direction:row;justify-content:flex-start}
  body.v5 .wf-aside{grid-template-columns:1fr}
  body.v5 .wf-mind-stats{margin-left:0}
  body.v5 .wf-mind-copy p{white-space:normal}
}

/* ===== 工作流画布：可拖、可连、可读 ===== */
body.v5 .wf-canvas-toolbar{padding:9px 12px;border-bottom:1px solid #eef2f7;background:#fbfdff}
body.v5 .wf-toolbar-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
body.v5 .wf-canvas-tip{display:flex;align-items:center;gap:7px;font-size:10.5px;line-height:1.5;color:#94a3b8;min-width:0}
body.v5 .wf-canvas-tip b{font-weight:550;color:#475569}
body.v5 .wf-canvas-tip .sep{color:#cbd5e1}
body.v5 .wf-palette{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
body.v5 .wf-palette-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed #e9eff6}
body.v5 .wf-palette-label{flex:none;font-size:9.5px;letter-spacing:.04em;color:#94a3b8}
body.v5 .wf-mind{display:flex;align-items:center;gap:13px;margin:0 0 10px;padding:12px 14px;border:1px solid #d9e7e4;border-radius:12px;background:linear-gradient(105deg,#f7fdfb 0%,#f9fbff 62%,#ffffff 100%)}
body.v5 .wf-mind-orb{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,#ffffff 0%,#ccf5ed 48%,#8ee0d2 100%);box-shadow:inset 0 0 0 1px rgba(15,118,110,.12),0 6px 18px rgba(20,184,166,.13);color:#0f766e;font-family:var(--serif,Georgia,'Songti SC',serif);font-size:19px;font-weight:700}
body.v5 .wf-mind-copy{flex:1;min-width:0}
body.v5 .wf-mind-title{display:flex;align-items:center;gap:7px}
body.v5 .wf-mind-title b{font-size:13px;font-weight:650;color:#0f172a;letter-spacing:.01em}
body.v5 .wf-mind-role{font-size:9px;letter-spacing:.08em;color:#0f766e;background:#e9f9f5;border:1px solid #c9eee6;border-radius:20px;padding:1px 6px}
body.v5 .wf-mind-copy p{margin:3px 0 0;font-size:11.5px;line-height:1.55;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.v5 .wf-mind-stats{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:none}
body.v5 .wf-mind-stat{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid #e6edf4;border-radius:20px;background:#fff;color:#475569;font-size:10px;white-space:nowrap}
body.v5 .wf-mind-stat .dot{width:6px;height:6px;border-radius:50%;background:#cbd5e1;flex:none}
body.v5 .wf-mind-stat .dot.live{background:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.13)}
body.v5 .wf-mind-stat .dot.wait{background:#f59e0b}
body.v5 .wf-mind-stat .dot.done{background:#4ade80}
body.v5 .wf-chip{display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 9px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;color:#475569;font:inherit;font-size:10.5px;cursor:grab;transition:border-color .12s,box-shadow .12s,color .12s}
body.v5 .wf-chip:hover{border-color:#99f6e4;color:#0f172a;box-shadow:0 2px 6px rgba(15,23,42,.05)}
body.v5 .wf-chip:active{cursor:grabbing}
body.v5 .wf-chip .dot{width:6px;height:6px;border-radius:50%;flex:none}
body.v5 .wf-canvas-actions{display:flex;align-items:center;gap:5px;flex:none}
body.v5 .wf-canvas-actions .btn{height:27px;padding:0 9px;font-size:10.5px}
body.v5 .wf-canvas-actions .btn[disabled]{opacity:.55;cursor:default}
body.v5 .wf-canvas-shell{position:relative;height:560px;overflow:auto;overscroll-behavior:contain;background-color:#fbfdff;background-image:radial-gradient(#dfe8f1 1px,transparent 1px);background-size:18px 18px}
body.v5 .wf-canvas{position:relative;min-width:920px;min-height:480px;outline:none}
body.v5 .wf-canvas.drop-ready{background:rgba(240,253,250,.55);box-shadow:inset 0 0 0 2px #99f6e4}
body.v5 .wf-canvas svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
body.v5 .wf-edge{fill:none;stroke:#cbd5e1;stroke-width:1.8;transition:stroke .12s}
body.v5 .wf-edge.on{stroke:#0f766e;stroke-width:2.4}
body.v5 .wf-edge-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
body.v5 .wf-edge-hit:hover + .wf-edge{stroke:#5eead4}
body.v5 .wf-edge-temp{fill:none;stroke:#14b8a6;stroke-width:2;stroke-dasharray:5 5;pointer-events:none}
body.v5 .wf-canvas-footer{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #eef2f7;background:#fbfdff;font-size:10px;color:#94a3b8}
body.v5 .wf-canvas-footer .right{margin-left:auto;display:flex;align-items:center;gap:6px}
body.v5 .wf-node{position:absolute;width:156px;height:96px;padding:10px 12px;border:1px solid #dbe4ee;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04),0 5px 14px rgba(15,23,42,.035);text-align:left;font:inherit;color:inherit;cursor:grab;user-select:none;touch-action:none;transition:border-color .12s,box-shadow .12s}
body.v5 .wf-node:hover{border-color:#b6c7d9;box-shadow:0 2px 4px rgba(15,23,42,.05),0 8px 20px rgba(15,23,42,.07)}
body.v5 .wf-node.on{border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.14),0 8px 22px rgba(15,23,42,.08)}
body.v5 .wf-node.dragging{cursor:grabbing;z-index:5;border-color:#14b8a6;box-shadow:0 10px 26px rgba(15,23,42,.14)}
body.v5 .wf-node-top{display:flex;align-items:center;gap:5px;height:13px;font-size:9px;color:#94a3b8}
body.v5 .wf-node-kind{display:inline-flex;align-items:center;gap:4px;padding:1px 5px;border-radius:3px;background:#f8fafc;color:#64748b;font-size:8.5px;letter-spacing:.02em}
body.v5 .wf-node-kind .dot{width:5px;height:5px;border-radius:50%;flex:none}
body.v5 .wf-node-state{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:9px;color:#64748b;white-space:nowrap}
body.v5 .wf-node-state .dot{width:5px;height:5px;border-radius:50%}
body.v5 .wf-node.is-done .wf-node-state{color:#15803d}
body.v5 .wf-node.is-run .wf-node-state{color:#2563eb}
body.v5 .wf-node.is-blocked .wf-node-state{color:#b45309}
body.v5 .wf-node-title{margin-top:8px;font-size:12.5px;line-height:1.38;font-weight:600;color:#0f172a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:35px}
body.v5 .wf-node-sub{margin-top:5px;font-size:9.5px;line-height:1.3;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.v5 .wf-port{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#fff;border:1.5px solid #94a3b8;z-index:2;transition:transform .1s,background .1s,border-color .1s}
body.v5 .wf-port-in{left:-6px}
body.v5 .wf-port-out{right:-6px;border-color:#14b8a6;background:#f0fdfa;cursor:crosshair}
body.v5 .wf-port-out:hover,body.v5 .wf-port-out.active{background:#14b8a6;border-color:#14b8a6;transform:scale(1.25);box-shadow:0 0 0 4px rgba(20,184,166,.14)}
body.v5 .wf-empty-canvas{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:40px;text-align:center}
body.v5 .wf-empty-canvas b{font-size:15px;color:#0f172a}
body.v5 .wf-empty-canvas p{max-width:430px;margin:0;font-size:12px;line-height:1.7;color:#64748b}
body.v5 .wf-empty-actions{display:flex;gap:7px;margin-top:8px}
body.v5 .wf-edit-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
body.v5 .wf-edit-actions .btn{height:27px;padding:0 9px;font-size:10.5px}
body.v5 .wf-edit-note{margin-top:10px;padding-top:9px;border-top:1px solid #eef2f7;font-size:10px;line-height:1.6;color:#94a3b8}
body.v5 .wf-api-code{max-height:300px;overflow:auto;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc;padding:10px 11px}
body.v5 .wf-api-code pre{margin:0;font-family:var(--mono);font-size:10px;line-height:1.65;color:#334155;white-space:pre}
body.v5 .wf-api-hint{margin-top:8px;font-size:10.5px;line-height:1.6;color:#64748b}
@media (max-width:1180px){
  body.v5 .wf-canvas-toolbar{align-items:flex-start}
  body.v5 .wf-palette{margin-left:0;order:3;width:100%}
  body.v5 .wf-canvas-actions{margin-left:auto}
}
/* ============================================================
   v10 · 可读性排版层
   目标：嵌入 DSH 后不靠缩小字号压信息。
   只调字号、行高、间距、宽度；颜色保持浅色。
   ============================================================ */
body.v5{
  font-size:13.5px;
  line-height:1.6;
  color:#1e293b;
  --fs-meta:11.5px;
  --fs-small:12px;
  --fs-body:13px;
  --fs-card-title:14px;
  --fs-page-title:24px;
}
body.v5 p,body.v5 li,body.v5 .mast-lede,body.v5 .task-top p,body.v5 .wf-top p,
body.v5 .tc-stage,body.v5 .tc-result,body.v5 .tc-next,body.v5 .tw-step-sub,
body.v5 .tw-step-result,body.v5 .dec-why,body.v5 .eff-why{text-wrap:pretty}

/* 侧栏 */
body.v5 .sidebar{width:236px;background:#f8fafc}
body.v5 .main{margin-left:236px}
body.v5 .brand{padding:20px 18px 16px}
body.v5 .brand-name{font-size:15.5px;letter-spacing:.01em}
body.v5 .brand-sub{margin-top:3px;font-size:11px;letter-spacing:.1em}
body.v5 .workspace{margin:12px 12px 10px;width:calc(100% - 24px);padding:10px 12px;border-radius:7px}
body.v5 .ws-name{font-size:13px}
body.v5 .ws-url{margin-top:2px;font-size:11px}
body.v5 .nav-scroll{padding:4px 10px 12px}
body.v5 .nav-label{padding:16px 10px 7px;font-size:11.5px;letter-spacing:.08em}
body.v5 .nav-item{
  height:36px;padding:0 11px;margin:2px 0;border-radius:7px;
  font-size:13.5px;gap:10px;
}
body.v5 .nav-item .nb{
  min-width:22px;height:20px;padding:0 6px;border:1px solid #e2e8f0;
  font-size:11.5px;line-height:18px;
}
body.v5 .sidebar-foot{padding:12px 12px 14px}
body.v5 .note-entry{padding:9px 10px;font-size:12.5px;line-height:1.5}
body.v5 .user-row{margin-top:8px;padding:10px 8px 4px;gap:9px}
body.v5 .user-avatar{width:28px;height:28px;font-size:12px}
body.v5 .user-name{font-size:13px}
body.v5 .user-role{font-size:11px;letter-spacing:.06em}

/* 顶栏与搜索 */
body.v5 .topbar{height:52px;padding:0 24px}
body.v5 .crumb{font-size:12.5px;gap:7px}

const icon = (name, cls = '') => '<svg class="ic ' + cls + '" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';

  failed: { label: '失败', tone: 'red', icon: 'close', dot: '#c0393f' }

const statusTag = (status, extra = '') => {
  const s = STATUS[status] || STATUS.queued;
  return '<span class="status ' + s.tone + ' ' + extra + '"><span class="dot" style="background:' + s.dot + '"></span>' + s.label + '</span>';

const typeTag = (type) => {

const spark = (values, color = '#4b73ef') => {
  const max = Math.max(...values), min = Math.min(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => [(i / Math.max(1, values.length - 1)) * 72 + 1, 21 - ((v - min) / span) * 17]);
  return '<svg class="spark" viewBox="0 0 74 24" preserveAspectRatio="none"><path d="' +
    pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') +
    '" stroke="' + color + '"/></svg>';

  paused: '已暂停', done: '已完成', done_unverified: '做完，等系统确认',
  succeeded: '成功', failed: '失败'

function pageHead(kicker, title, lede, actions) {
  const flatTitle = String(title == null ? '' : title).replace(/<br\s*\/?>/gi, ' ');
  return '<header class="masthead">' +
    '<div class="mast-kicker">' + esc(kicker) + '</div>' +
    '<div class="mast-top"><h1>' + flatTitle + '</h1><div class="mast-actions">' + (actions || '') + '</div></div>' +
    '<p class="mast-lede">' + lede + '</p>' +
  '</header>';
}

function iconBtn(name, act, label, extra) {
  return '<button class="icon-btn" data-act="' + act + '" title="' + esc(label) + '" aria-label="' + esc(label) + '" ' + (extra || '') + '>' + icon(name) + '</button>';
}

function miniBar(value, tone) {
  return '<div class="pbar ' + (tone || '') + '"><span style="width:' + Math.max(0, Math.min(100, value)) + '%"></span></div>';
}

function stageOf(t) {
  const chain = t.chain || [];
  const cur = chain.find(n => n.state === 'run');
  const bad = chain.find(n => n.state === 'blocked' || n.state === 'fail');
  const done = chain.filter(n => n.state === 'done').length;
  if (t.status === 'blocked') return bad ? '停在「' + bad.label + '」，等你决定' : '有一处需要你决定';
  if (t.status === 'running') return cur ? '正在「' + cur.label + '」 · ' + done + '/' + chain.length + ' 步' : '正在做 · ' + t.progress + '%';
  if (t.status === 'paused') return '已暂停，等你恢复';
  if (t.status === 'done_unverified') return '走完了，但还差一个系统确认';
  if (t.status === 'done') return '全部步骤完成';
  if (t.status === 'failed') return '上次没走通，等重试';
  if (t.status === 'scheduled') return '已排期，到点自动开始';
  if (t.type === 'manual') return '等你或负责人开始';
  return '还没开始';
}

function resultOf(t) {
  const r = runOfTask(t);
  if (!r) return t.status === 'queued' || t.status === 'scheduled' ? '还没有运行记录' : '还没有结果';
  return tidy(r.summary);
}

function nextOf(t) {
  if (t.status === 'blocked') return '你来选：继续、改方案，还是回退';
  if (t.attention) return person(t.owner) === '你' ? '处理完这件事，后面的步骤才会继续' : '等 ' + person(t.owner) + ' 处理';
  if (t.status === 'running') return '做完会自动进入下一步';
  if (t.status === 'scheduled') return '到点自动开始';
  if (t.status === 'done') return '无需动作';
  if (t.status === 'done_unverified') return '等系统确认，或人工核实';
  if (t.status === 'paused') return '等你恢复';
  if (t.status === 'failed') return '等下一次重试';
  return t.type === 'manual' ? person(t.owner) + ' 开始做' : '等下一次触发';
}

function whenOf(t) {
  if (t.status === 'scheduled') return t.next ? '下次 ' + t.next : t.schedule || '已排期';
  if (t.status === 'running') { const r = runOfTask(t); return r ? '开始于 ' + r.time : '正在做'; }
  if (t.status === 'done' || t.status === 'done_unverified') { const r = runOfTask(t); return r ? r.time + ' 完成' : '已完成'; }
  if (t.due) return '截止 ' + t.due;
  return t.schedule || '';
}

function filteredTasks() {
  const q = (state.taskQuery || '').trim().toLowerCase();
  return TASKS.filter(t => {
    if (state.taskFilter !== 'all' && t.type !== state.taskFilter) return false;
    if (!q) return true;
    const wf = wfOfTask(t);
    const hay = [t.title, t.desc, t.tags.join(' '), wf ? wf.name : ''].join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  });
}

}

  return '<div class="tc-history">' + rs.map(r => '<div class="history-row"><span>' + esc(r.time) + '</span><span>' + esc(tidy(r.summary)) + '</span><span class="h-dur">' + esc(r.duration) + '</span></div>').join('') + '</div>';
}

function taskCard(t) {
  const histOpen = state.historyOpen[t.id];
  const needs = t.status === 'blocked' || !!t.attention;
  const progress = (t.progress != null && t.status === 'running') ? '<div class="tc-progress">' + miniBar(t.progress) + '<em>' + t.progress + '%</em></div>' : '';

  return '<article class="task-card' + (needs ? ' needs' : '') + '" data-task="' + t.id + '" tabindex="0" role="button" aria-label="打开任务 ' + esc(tidy(t.title)) + '">' +

    '<h3 class="tc-title">' + esc(tidy(t.title)) + '</h3>' +
    '<div class="tc-stage"><span class="dot" style="background:' + (t.status === 'blocked' ? '#a63f2b' : t.status === 'running' ? '#b8862f' : '#8b8579') + '"></span><span>' + esc(stageOf(t)) + '</span></div>' +
    '<div class="tc-result"><b>' + (t.latestRun ? '上次' : '状态') + '</b> · ' + esc(resultOf(t)) + '</div>' +
    '<div class="tc-next"><b>下一步</b> · ' + esc(nextOf(t)) + '</div>' +

function renderTasksBoard(list) {
  const cols = [

    { key: 'running', title: '进行中' },
    { key: 'attention', title: '需要你' },
    { key: 'done', title: '最近完成' }

  return '<div class="board">' + cols.map(c => {
    const items = list.filter(t => t.column === c.key);
    return '<div class="bcol"><div class="bcol-head"><span class="bcol-name">' + c.title + '</span><span class="bcol-count">' + items.length + '</span></div><div class="bcol-drop">' +
      (items.map(taskCard).join('') || '<div class="empty" style="padding:18px 0">这里暂时是空的</div>') + '</div></div>';

}

function chainLine(t) {
  if (!t.chain || !t.chain.length) return '<span class="muted">还没有开始</span>';
  return t.chain.map((n, i) => {
    const color = n.state === 'done' ? '#7d9a7f' : n.state === 'run' ? '#b8862f' : n.state === 'blocked' || n.state === 'fail' ? '#a63f2b' : '#b9b2a4';
    return (i ? '<span class="chain-sep">→</span>' : '') + '<span class="chain-node"><span class="chain-dot" style="background:' + color + '"></span>' + esc(n.label) + '</span>';
  }).join('');
}

const STEP_STATE_WORD = { done: '已完成', run: '执行中', wait: '等上游', blocked: '等你决定', fail: '失败', unverified: '等系统确认', scheduled: '已排期' };

function stepStateWord(st){ return STEP_STATE_WORD[st] || '等上游'; }

function stepInstruction(st){
  if(st === 'done') return '这一步已经收尾，不需要你介入。';
  if(st === 'run') return '先不用动它；如果超过 10 分钟没有新事件，再打开这次运行看卡在哪。';
  if(st === 'wait') return '先看上游那一步有没有交出可用的结果；上游没过，这一步不会开始。';
  if(st === 'blocked') return '去「待你决定」处理对应的一项；处理完，它会从这里继续。';
  if(st === 'fail') return '打开上次运行，看完失败原因再决定是否重试；不要直接再跑一遍。';
  if(st === 'unverified') return '去「待核实」补系统确认，或签字接手；补不到就不能记成功。';
  return '等上游交出结果。';
}

function adjustStory(base, st){
  const out = Object.assign({}, base);
  if(st === 'wait'){
    out.process = '还没轮到这一步：上游的结果还没交过来。';
    out.result = '暂无结果。';
    out.evidence = '—';
  } else if(st === 'run'){
    out.result = (base.result || '') + '（还在执行，当前只是中间结果）';
  } else if(st === 'blocked'){
    out.result = '停在这里，等你决定后才能继续。' + (base.result ? ' ' + base.result : '');
  } else if(st === 'fail'){
    out.result = '失败了，已停在安全态；重试前要先处理失败原因。';
  } else if(st === 'unverified'){
    out.result = '做完了，但还差系统确认，只能记为「待核实」。';
  }
  return out;
}

function storyForLabel(task, label, st){
  const wf = wfOfTask(task);
  if(wf && STEP_STORY[wf.id]){
    const node = wf.nodes.find(x => x.title === label);
    if(node && STEP_STORY[wf.id][node.id]) return adjustStory(STEP_STORY[wf.id][node.id], st);
  }
  if(CHAIN_STORY[label]) return adjustStory(CHAIN_STORY[label], st);
  return adjustStory({ actor: '子代理', process: '按任务要求完成「' + label + '」，并把产出写进本次运行。', result: '这一步已经留下记录。', evidence: 'run_' + (task.id || 'task') + ' · ' + label, dur: '—', input: '上游产出', output: label, attempt: '第 1 次尝试' }, st);
}

function storyForNode(wf, node){
  const base = (STEP_STORY[wf.id] && STEP_STORY[wf.id][node.id]) || { actor: '子代理', process: node.sub || '按流程约定执行这一步。', result: '已留下执行记录。', evidence: '—', dur: '—', input: '上游产出', output: '下一步输入', attempt: '第 1 次尝试' };
  const st = node.status === 'run' ? 'run' : node.status === 'blocked' ? 'blocked' : node.status === 'wait' ? 'wait' : 'done';
  const adjusted = adjustStory(base, st);
  adjusted.actor = base.actor;
  adjusted.dur = base.dur;
  adjusted.input = base.input;
  adjusted.output = base.output;
  adjusted.attempt = base.attempt;
  return adjusted;
}

    '<div class="task-top"><div class="task-top-main"><div class="task-kicker">工作 · 共 ' + TASKS.length + ' 件</div><h1>任务</h1><p>点一条任务看它做到哪一步；点任意一步，过程和结果就在右边。</p></div><div class="task-top-actions"><button class="btn ghost" data-act="toast" data-msg="当前视图已保存。">保存视图</button><button class="btn primary" data-act="new-task">新建任务</button></div></div>' +
    '<div class="task-toolbar"><div class="filters">' + filters + '</div><div class="task-tools"><label class="mini-search">' + icon('search') + '<input id="taskSearch" data-task-search placeholder="找任务…" value="' + esc(state.taskQuery) + '" autocomplete="off"></label><div class="view-switch">' + views + '</div></div></div>' +
    empty + body +
  '</section>';
}

/* ============================================================
   Part B · 工作流管理
   ============================================================ */
const wfByIdSafe = id => WORKFLOWS[id] || WORKFLOWS.wf_design;

const wfHealthTone = wf => wf.status === 'draft' ? 'amber' : (wf.success >= 95 ? 'green' : wf.success >= 90 ? 'blue' : 'amber');

function wfSideItem(wf){
  return '<button class="wf-list-item ' + (state.selectedWorkflow === wf.id ? 'on' : '') + '" data-act="open-wf" data-wf="' + wf.id + '">' +
    '<div class="wf-li-top"><span class="wf-li-name">' + esc(tidy(wf.name)) + '</span><span class="wf-li-ver">' + esc(wf.version) + '</span></div>' +
    '<div class="wf-li-sub"><span>' + (wf.status === 'draft' ? '草稿' : '已发布') + '</span><span>·</span><span>' + esc(wf.triggerLabel) + '</span></div>' +
    '<div class="wf-li-bottom"><span class="health-bar"><i style="width:' + Math.min(100, wf.success) + '%"></i></span><span>' + wf.success + '%</span><span>·</span><span>' + wf.tasks + ' 个任务</span><span style="margin-left:auto">' + esc(wf.updated) + '</span></div>' +
  '</button>';
}

function nodeWord(n){
  return n.status === 'done' ? '已完成' : n.status === 'run' ? '进行中' : n.status === 'blocked' ? '等你决定' : '等上游';
}

function wfSelectedNode(wf){
  return wf.nodes.find(n => n.id === state.wfNode) || wf.nodes.find(n => n.status === 'run') || wf.nodes.find(n => n.status === 'blocked') || wf.nodes[0];
}

function wfNodeState(n){
  return n.status === 'run' ? 'run' : n.status === 'blocked' ? 'blocked' : n.status === 'wait' ? 'wait' : 'done';
}

const WF_KIND = {
  trigger: { label: '开始', color: '#0891b2' },
  agent: { label: '子代理', color: '#2563eb' },
  tool: { label: '工具', color: '#0d9488' },
  subworkflow: { label: '子流程', color: '#6d5ce7' },
  approval: { label: '等你决定', color: '#d97706' },
  parallel: { label: '并行分派', color: '#7c3aed' },
  policy: { label: '规则检查', color: '#0f766e' },
  branch: { label: '按条件分流', color: '#c2410c' },
  wait: { label: '等待', color: '#64748b' }
};
const WF_PALETTE = ['trigger', 'agent', 'tool', 'subworkflow', 'approval', 'parallel', 'policy', 'branch', 'wait'];
const WF_NODE_W = 176, WF_NODE_H = 112;
const WF_STATE_COLOR = { done: '#4ade80', run: '#5aa9ff', blocked: '#fbbf24', wait: '#cbd5e1' };

function wfKind(n){ return WF_KIND[n.type] ? n.type : 'agent'; }
function wfNodeById(wf, id){ return wf.nodes.find(n => n.id === id); }
function wfEdgeKey(e){ return e[0] + '|' + e[1]; }

function wfAutoPos(wf){
  const last = wf.nodes[wf.nodes.length - 1];
  if(!last) return { x: 24, y: 40 };
  if(last.x < 760) return { x: last.x + 190, y: last.y };
  return { x: 24, y: Math.max.apply(null, wf.nodes.map(n => n.y)) + 132 };
}

function wfTouch(wf, note){
  wf.updated = '刚刚';
  if(wf.status === 'draft'){
    if(wf.versions && wf.versions[0]) wf.versions[0].note = note;
    state.wfDirty = true;
  }
}

function wfEdgePath(a, b){
  const x1 = a.x + WF_NODE_W, y1 = a.y + WF_NODE_H / 2;
  const x2 = b.x, y2 = b.y + WF_NODE_H / 2;
  if(Math.abs(b.x - a.x) < 46 && Math.abs(y2 - y1) > 42){
    const sx = a.x + WF_NODE_W / 2, sy = a.y + WF_NODE_H;
    const tx = b.x + WF_NODE_W / 2, ty = b.y;
    const c = Math.max(38, Math.abs(ty - sy) * 0.42);
    return 'M' + sx + ',' + sy + ' C' + sx + ',' + (sy + c) + ' ' + tx + ',' + (ty - c) + ' ' + tx + ',' + ty;
  }
  if(x2 < x1){
    const c = 78;
    return 'M' + x1 + ',' + y1 + ' C' + (x1 + c) + ',' + y1 + ' ' + (x2 - c) + ',' + y2 + ' ' + x2 + ',' + y2;
  }
  const c = Math.max(34, (x2 - x1) * 0.44);
  return 'M' + x1 + ',' + y1 + ' C' + (x1 + c) + ',' + y1 + ' ' + (x2 - c) + ',' + y2 + ' ' + x2 + ',' + y2;
}

function wfCanvasSize(wf){
  const maxX = wf.nodes.reduce((m, n) => Math.max(m, n.x + WF_NODE_W), 0);
  const maxY = wf.nodes.reduce((m, n) => Math.max(m, n.y + WF_NODE_H), 0);
  return { w: Math.max(920, maxX + 110), h: Math.max(480, maxY + 100) };
}

function wfSyncEdgeDom(wf){
  const canvas = document.querySelector('#wfCanvas'); if(!canvas) return;
  const byId = {}; wf.nodes.forEach(n => { byId[n.id] = n; });
  canvas.querySelectorAll('[data-edge-from]').forEach(p => {
    const a = byId[p.getAttribute('data-edge-from')], b = byId[p.getAttribute('data-edge-to')];
    if(a && b) p.setAttribute('d', wfEdgePath(a, b));
  });
}

function wfTempEdgeTo(wf, fromId, clientX, clientY){
  const canvas = document.querySelector('#wfCanvas'); const p = document.querySelector('#wfTempEdge');
  if(!canvas || !p) return;
  const a = wfNodeById(wf, fromId); if(!a) return;
  const r = canvas.getBoundingClientRect();
  const px = clientX - r.left, py = clientY - r.top;
  const x1 = a.x + WF_NODE_W, y1 = a.y + WF_NODE_H / 2;
  const c = Math.max(34, Math.abs(px - x1) * 0.44);
  p.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + (x1 + c) + ',' + y1 + ' ' + (px - c) + ',' + py + ' ' + px + ',' + py);
  p.style.display = '';
}

function wfMind(wf){
  const agents = wf.nodes.filter(n => wfKind(n) === 'agent');
  const busy = agents.filter(n => n.status === 'run').length;
  const need = new Set(wf.nodes.filter(n => n.status === 'blocked' || wfKind(n) === 'approval').map(n => n.id)).size;
  const done = wf.nodes.filter(n => n.status === 'done').length;
  const stats = [];
  stats.push('<span class="wf-mind-stat"><i class="dot' + (busy ? ' live' : '') + '"></i>' + (busy ? busy + ' 个子代理在干' : agents.length ? agents.length + ' 个子代理待命' : '还没有子代理') + '</span>');
  stats.push('<span class="wf-mind-stat"><i class="dot' + (need ? ' wait' : '') + '"></i>' + (need ? need + ' 个等你决定' : '没有卡住的') + '</span>');
  stats.push('<span class="wf-mind-stat"><i class="dot done"></i>' + (wf.nodes.length ? done + ' / ' + wf.nodes.length + ' 步有结果' : '画布还是空的') + '</span>');
  const line = wf.nodes.length ? (wf.mind || '我负责拆目标、派活、收结果；子代理只按各自边界做事。') : '这张画布还空着。先加第一步，或从模板开始；我会按你定的步骤派活。';
  return '<div class="wf-mind"><div class="wf-mind-orb" aria-hidden="true">七</div><div class="wf-mind-copy"><div class="wf-mind-title"><b>七七在指挥</b><span class="wf-mind-role">主控</span></div><p>' + esc(line) + '</p></div><div class="wf-mind-stats">' + stats.join('') + '</div></div>';
}

function wfCanvasToolbar(wf){
  if(wf.status !== 'draft'){
    return '<div class="wf-canvas-toolbar"><div class="wf-toolbar-line"><div class="wf-canvas-tip"><b>已发布版本只读</b><span class="sep">·</span>要改流程，先开一份新版本草稿</div><div class="wf-canvas-actions"><button class="btn ghost sm" data-act="wf-api" data-wf="' + wf.id + '">智能体接口</button><button class="btn sm" data-act="new-version" data-wf="' + wf.id + '">开新版本</button></div></div></div>';
  }
  const chips = WF_PALETTE.map(k => {
    const m = WF_KIND[k];
    return '<button class="wf-chip" draggable="true" data-act="wf-add-kind" data-wf="' + wf.id + '" data-wf-kind="' + k + '"><span class="dot" style="background:' + m.color + '"></span>' + m.label + '</button>';
  }).join('');
  return '<div class="wf-canvas-toolbar"><div class="wf-toolbar-line"><div class="wf-canvas-tip"><b>拖动节点</b>改位置<span class="sep">·</span><b>从右侧圆点拉线</b>接下一步<span class="sep">·</span><b>双击空白</b>加一步</div><div class="wf-canvas-actions"><button class="btn ghost sm" data-act="wf-tidy" data-wf="' + wf.id + '">整理</button><button class="btn ghost sm" data-act="wf-api" data-wf="' + wf.id + '">智能体接口</button><button class="btn sm" data-act="wf-save" data-wf="' + wf.id + '"' + (state.wfDirty ? '' : ' disabled') + '>' + (state.wfDirty ? '保存改动' : '已保存') + '</button></div></div><div class="wf-palette-row"><span class="wf-palette-label">拖一个进来</span><div class="wf-palette">' + chips + '</div></div></div>';
}

function wfNodeHtml(wf, n, selected){
  const st = wfNodeState(n), kind = WF_KIND[wfKind(n)], story = storyForNode(wf, n);
  const on = selected && selected.id === n.id;
  return '<button class="wf-node is-' + st + (on ? ' on' : '') + '" draggable="false" data-act="wf-step" data-wf="' + wf.id + '" data-node="' + n.id + '" style="left:' + n.x + 'px;top:' + n.y + 'px">' +
    '<span class="wf-node-top"><span class="wf-node-kind"><span class="dot" style="background:' + kind.color + '"></span>' + kind.label + '</span><span class="wf-node-state"><span class="dot" style="background:' + WF_STATE_COLOR[st] + '"></span>' + esc(nodeWord(n)) + '</span></span>' +
    '<span class="wf-node-title">' + esc(tidy(n.title)) + '</span>' +
    '<span class="wf-node-sub">' + esc(tidy(story.actor)) + ' · ' + esc(story.dur) + '</span>' +
    (wf.status === 'draft' ? '<span class="wf-port wf-port-in"></span><span class="wf-port wf-port-out" data-stop="1"></span>' : '') +
  '</button>';
}

function wfCanvas(wf){
  const selected = wfSelectedNode(wf);
  const size = wfCanvasSize(wf);
  const edgeMarkup = wf.edges.map(e => {
    const a = wfNodeById(wf, e[0]), b = wfNodeById(wf, e[1]);
    if(!a || !b) return '';
    const d = wfEdgePath(a, b), key = wfEdgeKey(e), on = state.wfEdge === key;
    return '<path class="wf-edge-hit" data-act="wf-edge" data-edge="' + esc(key) + '" data-edge-from="' + e[0] + '" data-edge-to="' + e[1] + '" d="' + d + '"></path>' +
      '<path class="wf-edge' + (on ? ' on' : '') + '" data-edge-from="' + e[0] + '" data-edge-to="' + e[1] + '" d="' + d + '" marker-end="url(#' + (on ? 'wfArrowOn' : 'wfArrow') + ')"></path>';
  }).join('');
  const nodes = wf.nodes.map(n => wfNodeHtml(wf, n, selected)).join('');
  const empty = wf.nodes.length ? '' : '<div class="wf-empty-canvas"><b>这张画布还是空的。</b><p>从下面的类型拖一个进来，或双击空白处加第一步；也可以从现成的「设计评审」模板开始，再按需要改。</p><div class="wf-empty-actions"><button class="btn primary sm" data-act="wf-add-step" data-wf="' + wf.id + '">加第一步</button><button class="btn ghost sm" data-act="wf-use-template" data-wf="' + wf.id + '">从「设计评审」模板开始</button></div></div>';
  return wfMind(wf) + wfCanvasToolbar(wf) +
    '<div class="wf-canvas-shell"><div class="wf-canvas" id="wfCanvas" data-wf="' + wf.id + '" data-act="wf-blank" style="width:' + size.w + 'px;height:' + size.h + 'px">' +
      '<svg width="' + size.w + '" height="' + size.h + '" aria-hidden="true"><defs>' +
        '<marker id="wfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"></path></marker>' +
        '<marker id="wfArrowOn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"></path></marker>' +
      '</defs>' + edgeMarkup + '<path id="wfTempEdge" class="wf-edge-temp" style="display:none" d=""></path></svg>' +
      nodes + empty +
    '</div></div>' +
    '<div class="wf-canvas-footer"><span>箭头从前一步指向下一步；点连线可以选中并删掉。</span><span class="right">' + (wf.status === 'draft' ? '保存后，智能体通过同一个 workflow.update 看到这份定义。' : '已发布版本固定；改流程会开一份新草稿。') + '</span></div>';
}

function wfInspector(wf){
  if(state.wfEdge){
    const parts = state.wfEdge.split('|');
    const a = wfNodeById(wf, parts[0]), b = wfNodeById(wf, parts[1]);
    if(a && b){
      return '<div class="wf-inspector"><div class="wf-inspector-head"><b>这条连线</b><span>先后顺序</span></div><div class="wf-inspector-body">' +
        '<div class="wf-inspector-title">' + esc(tidy(a.title)) + ' → ' + esc(tidy(b.title)) + '</div>' +
        '<div class="wf-inspector-meta">' + WF_KIND[wfKind(a)].label + ' → ' + WF_KIND[wfKind(b)].label + '</div>' +
        '<div class="tw-block"><h4>它表示什么</h4><p>前一步交出结果后，这一步才会开始。删掉连线，两步就各自独立。</p></div>' +
        (wf.status === 'draft' ? '<button class="btn ghost sm" data-act="wf-del-edge" data-wf="' + wf.id + '" data-edge="' + esc(state.wfEdge) + '" style="margin-top:10px;color:#b91c1c">删掉这条连线</button>' : '<p class="muted" style="font-size:10.5px;line-height:1.6;margin-top:10px">已发布版本只读。要改先开新版本。</p>') +
      '</div></div>' +
      '<div class="wf-side-card"><h4>怎么操作</h4><div class="muted" style="font-size:10.5px;line-height:1.65">点空白处取消选中。拖动节点只改位置，不会改连线；要改先后顺序，删掉旧的，再从圆点拉一条新的。</div></div>';
    }
  }
  const n = wfSelectedNode(wf);
  if(!n) return '<div class="wf-side-card" style="margin-top:10px"><h4>这一步的现场</h4><div class="muted" style="font-size:12px;line-height:1.6">点左边任意一步，这里会显示谁在做、做到哪了、产出了什么。</div></div>';
  const idx = wf.nodes.findIndex(x => x.id === n.id);
  const st = wfNodeState(n);
  const story = storyForNode(wf, n);
  const runs = wf.runRows || [];
  return '<div class="wf-inspector"><div class="wf-inspector-head"><b>这一步的现场</b><span>' + String(idx + 1).padStart(2, '0') + ' / ' + wf.nodes.length + '</span></div><div class="wf-inspector-body">' +
    '<div class="wf-inspector-title">' + esc(tidy(n.title)) + '</div>' +
    '<div class="wf-inspector-meta">' + esc(tidy(story.actor)) + ' · ' + nodeWord(n) + ' · ' + esc(story.dur) + '</div>' +
    '<div class="tw-block"><h4>在做什么</h4><p>' + esc(tidy(story.process)) + '</p></div>' +
    '<div class="tw-block"><h4>产出了什么</h4><p>' + esc(tidy(story.result)) + '</p></div>' +
    '<div class="tw-block"><h4>输入 → 产出</h4><p>' + esc(tidy(story.input)) + ' → ' + esc(tidy(story.output)) + '</p></div>' +
    '<details class="tech-details"><summary>技术细节</summary><div class="tw-code">' + esc(story.evidence) + '</div></details>' +
    '<div class="tw-block"><h4>现在要做什么</h4><p>' + esc(stepInstruction(st)) + '</p></div>' +
    (runs.length ? '<button class="btn ghost sm" data-act="open-run" data-run="' + runs[0].id + '" style="margin-top:10px">打开最近一次运行</button>' : '') +
    (wf.status === 'draft' ? '<div class="wf-edit-actions"><button class="btn ghost sm" data-act="wf-edit-step" data-wf="' + wf.id + '" data-node="' + n.id + '">改这一步</button><button class="btn ghost sm" data-act="wf-del-step" data-wf="' + wf.id + '" data-node="' + n.id + '" style="color:#b91c1c">删掉这一步</button></div>' : '') +
    '<div class="wf-edit-note">' + (wf.status === 'draft' ? '也可以直接拖动节点改位置，或从右侧圆点拉线连到下一步。' : '已发布版本只读；要改先开新版本。') + '</div>' +
  '</div></div>' +
  '<div class="wf-side-card"><h4>最近运行</h4>' + (runs.length ? runs.slice(0, 4).map(r => {
    const task = taskById(r.task);
    return '<button class="wf-mini-run" data-act="open-run" data-run="' + r.id + '"><span class="t">' + esc(r.time) + '</span><span>' + (task ? esc(tidy(task.title)) : esc(tidy(r.task))) + '</span><span class="dur">' + esc(r.dur) + '</span></button>';
  }).join('') : '<div class="muted" style="font-size:11px">还没有运行记录。</div>') + '</div>' +
  '<div class="wf-side-card"><h4>这条流程的边界</h4>' +
    '<div class="wf-side-row"><span>谁负责</span><b>' + esc(wf.owner) + '</b></div>' +
    '<div class="wf-side-row"><span>触发方式</span><b>' + esc(wf.triggerLabel) + '</b></div>' +
    '<div class="wf-side-row"><span>算完成</span><b>核验通过</b></div>' +
    '<div class="wf-side-row"><span>失败时</span><b>停下问你</b></div>' +
  '</div>';
}

function wfStats(wf){

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-orchestra · 控制面原型 v9</title>
<style>
:root{
  --bg:#f3f4f7;
  --paper:#ffffff;
  --paper2:#fafbfc;
  --paper3:#f6f7f9;
  --ink:#141a25;
  --ink2:#4d5666;
  --ink3:#8992a2;
  --ink4:#b3bac7;
  --line:#e5e8ee;
  --line2:#d6dbe4;
  --navy:#0b1220;
  --navy2:#121c2d;
  --blue:#2f62f0;
  --blue2:#edf2ff;
  --violet:#7357e8;
  --violet2:#f1eeff;
  --amber:#a96a12;
  --amber2:#fff6e7;
  --green:#13795b;
  --green2:#eaf8f2;
  --red:#c0393f;
  --red2:#fff0f0;
  --teal:#0e7c86;
  --teal2:#e9f8f9;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 12px 30px rgba(16,24,40,.045);
  --shadow2:0 24px 70px rgba(8,16,32,.20);
  --radius:14px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-display:"Iowan Old Style","Palatino Linotype","Songti SC","Noto Serif SC",Georgia,serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:inherit;text-decoration:none}
::selection{background:#cfdcff}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ================= shell ================= */
.sidebar{position:fixed;z-index:30;inset:0 auto 0 0;width:236px;padding:18px 13px 14px;display:flex;flex-direction:column;color:#dbe3f0;background:
  radial-gradient(80% 36% at 20% 0%,rgba(68,104,255,.22),transparent 72%),
  radial-gradient(60% 28% at 100% 30%,rgba(126,82,255,.12),transparent 70%),
  linear-gradient(180deg,#0c1423 0%,#0a111e 60%,#080e19 100%);
  border-right:1px solid rgba(255,255,255,.055)}
.sidebar:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(rgba(255,255,255,.18) .5px,transparent .5px);background-size:14px 14px;mask-image:linear-gradient(#000,transparent 75%)}
.brand{display:flex;align-items:center;gap:11px;padding:3px 7px 17px;position:relative;z-index:1}
.brand-mark{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#4d7cff,#7f5cff);box-shadow:0 8px 22px rgba(67,103,255,.32),inset 0 1px 0 rgba(255,255,255,.35);color:#fff}
.brand-mark svg{width:22px;height:22px}
.brand-name{font-size:15px;font-weight:650;letter-spacing:.1px;color:#fff;line-height:1.2}
.brand-sub{font-size:9px;letter-spacing:1.8px;color:#7f8ca6;text-transform:uppercase;margin-top:3px}
.workspace{position:relative;z-index:1;margin:0 1px 16px;padding:10px 10px;border:1px solid rgba(255,255,255,.09);border-radius:11px;background:rgba(255,255,255,.045);display:flex;align-items:center;gap:9px;text-align:left;width:100%;transition:.16s}
.workspace:hover{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.15)}
.ws-avatar{width:28px;height:28px;border-radius:8px;background:#17233a;border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;color:#8fa6d8}
.ws-meta{min-width:0;flex:1}
.ws-name{font-size:12.2px;font-weight:600;color:#f2f6ff}
.ws-url{font-size:9.7px;color:#79869e;margin-top:2px}
.ws-badge{font-size:8.4px;letter-spacing:.7px;padding:2px 5px;border-radius:4px;background:rgba(76,124,255,.14);color:#8fb0ff;border:1px solid rgba(89,133,255,.18)}
.nav-scroll{position:relative;z-index:1;flex:1;overflow:auto;scrollbar-width:none}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-label{font-size:8.7px;letter-spacing:1.6px;color:#63708a;padding:12px 10px 6px;text-transform:uppercase}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;margin:2px 0;border-radius:8px;color:#aab5c8;font-size:12.4px;text-align:left;border:1px solid transparent;transition:.15s;position:relative}
.nav-item .ic{width:16px;height:16px;opacity:.84}
.nav-item:hover{background:rgba(255,255,255,.055);color:#eef3ff}
.nav-item.active{color:#fff;background:linear-gradient(90deg,rgba(74,116,255,.21),rgba(74,116,255,.07));border-color:rgba(116,151,255,.14)}
.nav-item.active .ic{opacity:1;color:#a9c0ff}
.nav-item .nb{margin-left:auto;min-width:18px;height:17px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.08);color:#aeb9ca;font-size:9.6px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.nav-item.active .nb{background:rgba(107,145,255,.2);color:#dce6ff}
.nav-item .nb.hot{background:rgba(224,88,88,.16);color:#ffb7b7}
.sidebar-foot{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.07);padding-top:11px;margin-top:7px}
.note-entry{width:100%;display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;color:#9ba8be;font-size:11px;border:1px dashed rgba(255,255,255,.11);margin-bottom:10px}
.note-entry:hover{color:#fff;background:rgba(255,255,255,.04)}
.user-row{display:flex;align-items:center;gap:9px;padding:5px 7px}
.user-avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#2b3c5f,#1b2740);border:1px solid rgba(255,255,255,.12);font-size:11px;color:#dce6f7}
.user-name{font-size:11.4px;color:#dbe3f0;font-weight:600}
.user-role{font-size:9.4px;color:#6f7d94;letter-spacing:.6px}

.main{min-height:100vh;margin-left:236px}
.topbar{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:16px;padding:0 26px;background:rgba(243,244,247,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(213,219,229,.72)}
.crumb{display:flex;align-items:center;gap:8px;font-size:11.4px;color:var(--ink3);min-width:180px}
.crumb b{color:var(--ink);font-weight:600}
.crumb .ic{width:13px;height:13px}
.searchbox{flex:1;max-width:520px;height:34px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.78);display:flex;align-items:center;gap:8px;padding:0 11px;color:var(--ink3);transition:.15s}
.searchbox:focus-within{border-color:#b9c8ef;box-shadow:0 0 0 3px rgba(47,98,240,.07);background:#fff}
.searchbox input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:12px;color:var(--ink)}
.searchbox input::placeholder{color:#9da6b5}
.kbd{font-family:var(--mono);font-size:9.4px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:var(--ink3);background:#fff}
.top-status{display:flex;align-items:center;gap:7px;font-size:10.8px;color:var(--ink2);padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.68)}
.live-dot{width:6px;height:6px;border-radius:50%;background:#1f9d70;box-shadow:0 0 0 3px rgba(31,157,112,.12);animation:live 2.4s ease infinite}
@keyframes live{0%,100%{box-shadow:0 0 0 3px rgba(31,157,112,.12)}50%{box-shadow:0 0 0 5px rgba(31,157,112,.04)}}
.top-actions{display:flex;align-items:center;gap:7px;margin-left:auto}
.icon-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.72);display:grid;place-items:center;color:var(--ink2);transition:.15s}
.icon-btn:hover{background:#fff;border-color:var(--line2);color:var(--ink)}
.icon-btn .ic{width:15px;height:15px}
.avatar-btn{width:31px;height:31px;border-radius:50%;background:linear-gradient(145deg,#253a60,#15233a);color:#e7edf8;display:grid;place-items:center;font-size:10.6px;border:1px solid rgba(20,30,50,.1)}

#screen{max-width:1560px;margin:0 auto;padding:24px 28px 44px}
.page{animation:pageIn .28s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:6px 0 20px}
.eyebrow{font-size:9.2px;letter-spacing:2.1px;color:var(--ink3);text-transform:uppercase;font-weight:600;margin:0 0 7px;display:flex;align-items:center;gap:8px}
.eyebrow:before{content:"";width:16px;height:1px;background:#aeb7c6}
.page-head h1{font-family:var(--font-display);font-size:37px;line-height:1.05;letter-spacing:-.7px;font-weight:600;margin:0;color:#101621}
.page-head .lede{font-size:12.4px;color:var(--ink2);margin:8px 0 0;max-width:680px;line-height:1.7}
.head-actions{display:flex;align-items:center;gap:8px;flex:none;padding-bottom:2px}

.btn{height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink);font-size:11.8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:.15s;box-shadow:0 1px 1px rgba(16,24,40,.02)}
.btn .ic{width:14px;height:14px}
.btn:hover{border-color:#bcc5d4;background:#fcfcfd}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(47,98,240,.2)}
.btn.primary:hover{background:#2555df;border-color:#2555df}
.btn.dark{background:#172033;border-color:#172033;color:#fff}
.btn.dark:hover{background:#0e1728}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink2)}
.btn.ghost:hover{background:#fff;border-color:var(--line)}
.btn.danger{color:var(--red);border-color:#efc9cb;background:#fffafb}
.btn.danger:hover{background:var(--red2)}
.btn.sm{height:27px;padding:0 9px;font-size:10.8px;border-radius:6px}
.btn.sm .ic{width:12px;height:12px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.link-btn{color:var(--blue);font-size:11.4px;display:inline-flex;align-items:center;gap:4px;font-weight:550}
.link-btn:hover{text-decoration:underline}

/* ================= shared blocks ================= */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;gap:10px;padding:15px 17px 12px}
.panel-title{font-size:12.8px;font-weight:650;letter-spacing:.1px;display:flex;align-items:center;gap:7px;margin:0}
.panel-title .ic{width:15px;height:15px;color:var(--ink3)}
.panel-sub{font-size:10.8px;color:var(--ink3);margin:2px 0 0}
.panel-head .right{margin-left:auto;display:flex;align-items:center;gap:7px}
.panel-body{padding:0 17px 16px}
.divider{height:1px;background:var(--line);margin:0}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;font-size:9.6px;font-weight:600;letter-spacing:.15px;white-space:nowrap;border:1px solid transparent}
.tag .ic{width:11px;height:11px}
.tag.blue{background:var(--blue2);color:#2755d5;border-color:#dbe5ff}
.tag.violet{background:var(--violet2);color:#5b43c4;border-color:#e1d9ff}
.tag.amber{background:var(--amber2);color:#8a5a0f;border-color:#f3e2c3}
.tag.green{background:var(--green2);color:#106a50;border-color:#d3ecdf}
.tag.red{background:var(--red2);color:#a62e34;border-color:#f2d3d4}
.tag.gray{background:#f2f4f7;color:#667085;border-color:#e5e8ee}
.tag.teal{background:var(--teal2);color:#0b6b73;border-color:#d0ebed}
.tag.plain{background:transparent;border-color:var(--line2);color:var(--ink2)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.dot.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}
.status{display:inline-flex;align-items:center;gap:5px;font-size:10.2px;color:var(--ink2);white-space:nowrap}
.status.green{color:var(--green)}.status.red{color:var(--red)}.status.amber{color:var(--amber)}.status.blue{color:var(--blue)}.status.violet{color:var(--violet)}.status.gray{color:var(--ink3)}
.kv{display:grid;grid-template-columns:104px 1fr;gap:7px 12px;font-size:11.4px}
.kv dt{color:var(--ink3);font-size:10.4px}
.kv dd{margin:0;color:var(--ink);min-width:0}
.empty{padding:26px 18px;text-align:center;color:var(--ink3);font-size:11.4px;border:1px dashed var(--line2);border-radius:10px;background:var(--paper2)}
.anno{display:none;width:19px;height:19px;border-radius:50%;background:#111a2b;color:#fff;font-family:var(--mono);font-size:9px;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(47,98,240,.16);position:relative;z-index:5;cursor:help;flex:none}
body.anno-on .anno{display:inline-flex}
.anno:after{content:attr(data-note);position:absolute;right:-4px;top:25px;width:210px;background:#111a2b;color:#fff;font-family:var(--font-ui);font-size:10.5px;line-height:1.5;padding:8px 10px;border-radius:7px;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;pointer-events:none;transform:translateY(-3px);transition:.15s;font-weight:400;text-align:left;z-index:30}
.anno:hover:after{opacity:1;transform:none}
.spark{width:74px;height:24px;overflow:visible}
.spark path{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

/* ================= command ================= */
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:stretch}
.orchestra{position:relative;overflow:hidden;border-radius:18px;background:
  radial-gradient(70% 90% at 14% 0%,rgba(66,105,255,.23),transparent 60%),
  radial-gradient(75% 90% at 92% 100%,rgba(126,79,255,.13),transparent 60%),
  linear-gradient(145deg,#0d1627 0%,#0a1220 50%,#080e19 100%);
  color:#edf2ff;box-shadow:var(--shadow2);border:1px solid rgba(255,255,255,.06);min-height:526px}
.orchestra:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.11) .5px,transparent .5px);background-size:16px 16px;opacity:.32;mask-image:linear-gradient(130deg,#000,transparent 70%);pointer-events:none}
.orchestra:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-150px;top:-170px;border:1px solid rgba(126,151,255,.13);box-shadow:0 0 0 40px rgba(126,151,255,.025),0 0 0 90px rgba(126,151,255,.018);pointer-events:none}
.orchestra:fullscreen{position:fixed;inset:0;margin:0;width:100vw;height:100vh;min-height:0;overflow:auto;display:flex;flex-direction:column;border-radius:0;border:0}
.orchestra:fullscreen .orch-body{flex:1;min-height:0}
.orchestra:fullscreen .stage{height:100%}
.orchestra:fullscreen::backdrop{background:#05090f}
.orchestra.paused .stage-links path.flow{animation-play-state:paused}
.orchestra.paused .agent-node{opacity:.62}
.orchestra.paused .core .halo{animation-play-state:paused}
.orch-head{position:relative;z-index:2;display:flex;align-items:flex-start;gap:12px;padding:19px 21px 6px}
.orch-kicker{display:flex;align-items:center;gap:7px;font-size:8.8px;letter-spacing:2.1px;color:#7f90ad;text-transform:uppercase;font-weight:600}
.orch-kicker .dot{background:#6f9cff;box-shadow:0 0 10px #5c89ff}
.orch-title{font-family:var(--font-display);font-size:24px;letter-spacing:-.3px;margin:5px 0 2px;font-weight:600;color:#f7f9ff}
.orch-sub{font-size:10.9px;color:#8694ac;max-width:510px}
.orch-head .right{margin-left:auto;display:flex;gap:7px;align-items:center}
.dark-btn{height:28px;padding:0 9px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);color:#c9d5e9;font-size:10.2px;display:inline-flex;align-items:center;gap:5px;transition:.15s}
.dark-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.dark-btn .ic{width:12px;height:12px}
.orch-body{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;padding:6px 18px 0}
.stage{position:relative;height:316px;min-width:0}
.stage-links{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stage-links path{fill:none;stroke:url(#linkGrad);stroke-width:1.1;stroke-dasharray:4 6;opacity:.72}
.stage-links path.flow{animation:dash 9s linear infinite}
@keyframes dash{to{stroke-dashoffset:-100}}
.stage-links .halo{fill:none;stroke:rgba(112,144,255,.08);stroke-width:8}
.core{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:158px;height:158px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;isolation:isolate}
.core .halo{position:absolute;inset:-19px;border-radius:50%;border:1px solid rgba(126,154,255,.16);box-shadow:0 0 0 12px rgba(88,120,255,.035),0 0 36px rgba(78,112,255,.20);animation:halo 4.5s ease-in-out infinite}
.core .halo2{position:absolute;inset:-38px;border-radius:50%;border:1px dashed rgba(126,154,255,.12);animation:spin 44s linear infinite}
@keyframes halo{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
@keyframes spin{to{transform:rotate(360deg)}}
.core-face{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#3d5fbe 0%,#233b7e 38%,#141f3e 100%);border:1px solid rgba(151,177,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.core-icon{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.09);display:grid;place-items:center;color:#b9cbff;border:1px solid rgba(255,255,255,.1);margin-bottom:4px}
.core-icon .ic{width:17px;height:17px}
.core-name{font-size:14px;font-weight:650;color:#fff;letter-spacing:.2px}
.core-role{font-size:8.3px;letter-spacing:1.5px;color:#91a6d2;text-transform:uppercase;margin-top:1px}
.core-state{font-size:8.8px;color:#a9bce3;margin-top:5px;display:flex;align-items:center;gap:4px}
.core-state .dot{background:#5ee0a6;box-shadow:0 0 6px #4bd596}
.agent-node{position:absolute;width:171px;padding:9px 10px 8px;border-radius:10px;background:rgba(19,30,51,.82);border:1px solid rgba(142,165,214,.16);box-shadow:0 8px 22px rgba(0,0,0,.16);backdrop-filter:blur(6px);transition:.18s;text-align:left;color:#e8effc}
.agent-node:hover{background:rgba(27,42,71,.94);border-color:rgba(143,170,240,.34);transform:translateY(-1px)}
.agent-node.an-scout{left:1%;top:4%}.agent-node.an-drafter{right:0;top:5%}.agent-node.an-auditor{left:1%;bottom:2%}.agent-node.an-verifier{right:0;bottom:1%}
.an-top{display:flex;align-items:center;gap:6px}
.an-ico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:rgba(116,145,255,.13);color:#a9c0ff;border:1px solid rgba(127,155,255,.12)}
.an-ico .ic{width:11px;height:11px}
.an-name{font-size:10.8px;font-weight:600;color:#eef3ff}
.an-state{margin-left:auto;font-size:8.3px;letter-spacing:.4px;color:#8d9ab1;display:flex;align-items:center;gap:3px}
.an-state .dot{width:4px;height:4px}
.an-task{font-size:9.2px;color:#95a4bd;line-height:1.35;margin:5px 0 6px;height:24px;overflow:hidden}
.an-bar{height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.an-bar span{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#5680ff,#8f7bff)}
.an-meta{display:flex;align-items:center;justify-content:space-between;margin-top:4px;font-size:8.2px;color:#6f7f99;font-family:var(--mono)}
.feed{border-left:1px solid rgba(255,255,255,.07);padding-left:14px;min-width:0;display:flex;flex-direction:column;height:316px}
.feed-head{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:1.2px;color:#75839b;text-transform:uppercase;margin-bottom:8px;flex:none}
.feed-head .ic{width:12px;height:12px}
.feed-list{overflow:auto;padding-right:4px;flex:1;scrollbar-width:thin}
.feed-list::-webkit-scrollbar{width:4px}.feed-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.feed-item{position:relative;padding:0 0 11px 13px;border-left:1px solid rgba(255,255,255,.08)}
.feed-item:before{content:"";position:absolute;left:-3px;top:3px;width:5px;height:5px;border-radius:50%;background:#4e6b9d;box-shadow:0 0 0 3px rgba(78,107,157,.1)}
.feed-item.hot:before{background:#e0a449;box-shadow:0 0 0 3px rgba(224,164,73,.11)}
.feed-time{font-size:8.8px;font-family:var(--mono);color:#66758e;margin-bottom:2px}
.feed-text{font-size:9.8px;line-height:1.55;color:#aebbd0}
.feed-text b{color:#e0e8f7;font-weight:600}
.shared-board{position:relative;z-index:2;margin:4px 18px 16px;padding:10px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03)}
.sb-head{display:flex;align-items:center;gap:7px;font-size:8.8px;letter-spacing:1.2px;color:#73829b;text-transform:uppercase;margin-bottom:7px}
.sb-head .right{margin-left:auto;letter-spacing:0;text-transform:none;color:#68768d;font-size:8.6px}
.sb-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sb-item{padding:6px 7px;border-radius:6px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);min-width:0}
.sb-item .sbn{font-size:8.2px;color:#65738b;display:flex;align-items:center;gap:4px;margin-bottom:2px}
.sb-item .sbn .dot{width:3px;height:3px}
.sb-item .sbt{font-size:8.9px;color:#c6d2e5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attention{display:flex;flex-direction:column;overflow:hidden}
.attention .panel-head{padding-bottom:10px}
.attention .panel-title .badge-count{font-size:9.4px;background:var(--red2);color:var(--red);border:1px solid #f3d2d3;border-radius:5px;padding:1px 5px;margin-left:2px}
.att-list{padding:0 12px;flex:1}
.att-item{display:block;width:100%;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);transition:.14s;border-radius:7px}
.att-item:last-child{border-bottom:none}
.att-item:hover{background:#fbfcfe}
.att-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.att-title{font-size:11.4px;font-weight:600;line-height:1.4;color:var(--ink);margin-bottom:3px}
.att-why{font-size:9.8px;color:var(--ink3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.att-foot{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:9.2px;color:var(--ink3)}
.att-foot .link-btn{margin-left:auto;font-size:9.8px}
.att-footer{padding:11px 15px;border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;background:var(--paper2);font-size:9.5px;color:var(--ink3)}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.metric{padding:13px 15px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.025);position:relative;overflow:hidden}
.metric:after{content:"";position:absolute;right:-16px;bottom:-22px;width:75px;height:75px;border-radius:50%;background:radial-gradient(circle,rgba(47,98,240,.06),transparent 70%)}
.metric-top{display:flex;align-items:center;gap:6px;font-size:9.8px;color:var(--ink3);margin-bottom:5px}
.metric-top .ic{width:13px;height:13px}
.metric-val{font-family:var(--font-display);font-size:27px;line-height:1;letter-spacing:-.5px;font-weight:600;display:flex;align-items:baseline;gap:5px}
.metric-val small{font-family:var(--font-ui);font-size:9.6px;color:var(--ink3);font-weight:400;letter-spacing:0}
.metric-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:7px;font-size:9.5px;color:var(--ink3)}
.metric-bottom .delta{font-size:9px;color:var(--green)}
.metric-bottom .delta.warn{color:var(--amber)}
.lower-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px}
.run-list{display:flex;flex-direction:column}
.run-row{display:grid;grid-template-columns:22px minmax(0,1fr) 76px 64px 58px;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:10.4px}
.run-row:first-child{border-top:none}
.run-ic{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--paper3);color:var(--ink3)}
.run-ic .ic{width:11px;height:11px}
.run-main{min-width:0}
.run-title{font-size:10.8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-meta{font-size:8.9px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-time{font-family:var(--mono);font-size:9.2px;color:var(--ink3);text-align:right}
.run-dur{font-family:var(--mono);font-size:9.2px;color:var(--ink3);text-align:right}
.health-list{display:flex;flex-direction:column;gap:2px}
.health-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.health-row:first-child{border-top:none}
.health-name{font-size:10.6px;font-weight:550;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.health-name small{display:block;font-size:8.6px;color:var(--ink3);font-weight:400;margin-top:1px}
.health-bar{width:72px;height:4px;border-radius:3px;background:#edf0f4;overflow:hidden;flex:none}
.health-bar span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#2f62f0,#6f89f7)}
.health-val{font-family:var(--mono);font-size:9px;color:var(--ink3);width:31px;text-align:right;flex:none}

/* ================= tasks ================= */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.chip-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.chip{height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.72);display:inline-flex;align-items:center;gap:5px;font-size:10.6px;color:var(--ink2);transition:.14s}
.chip:hover{background:#fff;border-color:var(--line2)}
.chip.on{background:#111a2b;border-color:#111a2b;color:#fff}
.chip .n{font-family:var(--mono);font-size:8.7px;border-radius:4px;padding:0 4px;background:rgba(120,130,150,.1);color:inherit;opacity:.72}
.chip.on .n{background:rgba(255,255,255,.16)}
.seg{display:inline-flex;background:#e9ecf1;border-radius:8px;padding:3px;gap:2px;border:1px solid #e0e4eb}
.seg button{height:24px;padding:0 9px;border-radius:5px;font-size:10.4px;color:#737d8e;display:flex;align-items:center;gap:4px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1);font-weight:600}
.seg .ic{width:12px;height:12px}
.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:7px}
.mini-search{height:29px;width:180px;border:1px solid var(--line);border-radius:7px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--ink3)}
.mini-search input{border:none;outline:none;background:transparent;font-size:10.4px;flex:1;min-width:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.bcol{background:#eceff4;border:1px solid #e2e6ed;border-radius:13px;padding:8px;min-height:440px}
.bcol-head{display:flex;align-items:center;gap:6px;padding:4px 5px 9px}
.bcol-title{font-size:10.7px;font-weight:650;color:var(--ink2);letter-spacing:.2px;display:flex;align-items:center;gap:5px}
.bcol-title .dot{width:5px;height:5px}
.bcol-count{font-family:var(--mono);font-size:8.9px;color:var(--ink3);background:rgba(255,255,255,.66);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:1px}
.bcol-head .icon-btn{width:21px;height:21px;border:none;background:transparent;margin-left:auto;color:var(--ink3)}
.bcol-head .icon-btn:hover{background:#fff}
.bcol-body{display:flex;flex-direction:column;gap:7px}
.task-card{position:relative;background:#fff;border:1px solid #e4e7ed;border-radius:10px;padding:10px 10px 9px;box-shadow:0 1px 2px rgba(16,24,40,.035);cursor:pointer;transition:.16s;overflow:hidden}
.task-card:hover{border-color:#cfd6e2;box-shadow:0 8px 20px rgba(16,24,40,.07);transform:translateY(-1px)}
.task-card:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--line2)}
.task-card.t-scheduled:before{background:#d29a38}.task-card.t-continuous:before{background:#4b73ef}.task-card.t-event:before{background:#8066e5}.task-card.t-manual:before{background:#2c8e95}
.tc-top{display:flex;align-items:center;gap:5px;margin-bottom:5px;min-height:18px}
.tc-top .type{font-size:8.5px;letter-spacing:.15px;padding:2px 5px;border-radius:4px;display:inline-flex;align-items:center;gap:3px;font-weight:600}
.tc-top .type .ic{width:9px;height:9px}
.type.scheduled{background:#fff5e4;color:#8e5c0e;border:1px solid #f2e0bf}.type.continuous{background:#edf2ff;color:#2855cd;border:1px solid #dbe5ff}.type.event{background:#f1eeff;color:#5c44c6;border:1px solid #e2daff}.type.manual{background:#eaf8f8;color:#0d7078;border:1px solid #d2ecee}
.tc-id{margin-left:auto;font-family:var(--mono);font-size:7.9px;color:#a2aab8;letter-spacing:-.2px}
.hist-btn{height:18px;padding:0 5px;border-radius:4px;border:1px solid var(--line);background:#fafbfc;font-size:8.2px;color:var(--ink3);display:inline-flex;align-items:center;gap:2px;font-family:var(--mono)}
.hist-btn:hover{background:#fff;color:var(--ink2);border-color:var(--line2)}
.hist-btn .ic{width:9px;height:9px;transition:.15s}
.hist-btn.open .ic{transform:rotate(180deg)}
.tc-title{font-size:11.5px;line-height:1.45;font-weight:600;color:var(--ink);margin:0 0 3px;letter-spacing:.05px}
.tc-sub{font-size:9.1px;color:var(--ink3);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-sub .mono{font-size:8.5px;color:#747f90}
.tc-latest{margin-top:7px;padding:6px 7px;border-radius:6px;background:var(--paper3);border:1px solid #edf0f4;display:flex;align-items:center;gap:5px;font-size:8.8px;color:var(--ink3);min-width:0}
.tc-latest .ic{width:10px;height:10px}
.tc-latest b{font-weight:600;color:var(--ink2)}
.tc-latest .when{margin-left:auto;font-family:var(--mono);font-size:8px;color:#9aa3b1;flex:none}
.tc-progress{margin-top:7px}
.tc-progress .lab{display:flex;justify-content:space-between;font-size:8.3px;color:var(--ink3);margin-bottom:3px}
.tc-progress .lab span:last-child{font-family:var(--mono);font-size:8px}
.pbar{height:3px;border-radius:3px;background:#eef1f5;overflow:hidden}
.pbar span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#4b73ef,#7f90f8)}
.pbar.amber span{background:linear-gradient(90deg,#d29a38,#e5b45c)}
.pbar.red span{background:linear-gradient(90deg,#c45353,#e28b8b)}
.tc-foot{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:8.6px;color:var(--ink3);flex-wrap:wrap}
.tc-foot .sep{width:1px;height:9px;background:var(--line2);margin:0 1px}
.tc-foot .att{margin-left:auto;color:var(--amber);display:flex;align-items:center;gap:3px;font-weight:600}
.tc-foot .att.red{color:var(--red)}
.tc-foot .att .ic{width:9px;height:9px}
.history-pop{margin-top:8px;padding-top:7px;border-top:1px dashed #dfe3ea;animation:pop .16s ease both}
@keyframes pop{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
.history-head{display:flex;align-items:center;gap:5px;font-size:8.2px;color:var(--ink3);margin-bottom:3px;font-family:var(--mono)}
.history-head .right{margin-left:auto;color:var(--blue);font-family:var(--font-ui);font-weight:600;font-size:8.2px}
.hrun{display:grid;grid-template-columns:12px minmax(0,1fr) 48px 26px;gap:4px;align-items:center;padding:3px 2px;border-radius:4px;font-size:8.2px;color:var(--ink2);cursor:pointer}
.hrun:hover{background:#f7f9fc}
.hrun .dot{width:4px;height:4px}
.hrun .t{font-family:var(--mono);font-size:7.7px;color:var(--ink3)}
.hrun .d{font-family:var(--mono);font-size:7.5px;color:#a0a8b5;text-align:right}
.hrun .ic{width:8px;height:8px;color:#b4bcc9;margin-left:auto}
.hrun.fail .dot{background:var(--red)}
.hrun.ok .dot{background:var(--green)}
.hrun.run .dot{background:var(--blue)}
.history-more{font-size:8.2px;color:var(--blue);padding:3px 2px 0;display:inline-flex;align-items:center;gap:3px}
.history-more .ic{width:8px;height:8px}
.more-card{width:100%;padding:7px;border:1px dashed #d8dee8;border-radius:8px;font-size:9px;color:var(--ink3);text-align:center;background:rgba(255,255,255,.35)}
.more-card:hover{background:#fff;color:var(--ink2)}

/* list view */
.data-table{width:100%;border-collapse:collapse;font-size:10.6px}
.data-table th{font-size:8.7px;letter-spacing:.6px;color:var(--ink3);text-transform:uppercase;font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.data-table td{padding:10px;border-bottom:1px solid #eef0f4;vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tbody tr{cursor:pointer;transition:.12s}
.data-table tbody tr:hover{background:#fafbfd}
.data-table .tname{font-weight:600;color:var(--ink);display:block;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-table .tsub{font-size:8.7px;color:var(--ink3);margin-top:2px;display:block}
.data-table .num{font-family:var(--mono);font-size:8.8px;color:var(--ink3)}

/* workflow view */
.wf-task-list{display:flex;flex-direction:column;gap:8px}
.wf-task-row{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 1px 2px rgba(16,24,40,.025);overflow:hidden;transition:.15s}
.wf-task-row:hover{border-color:#d8dee8}
.wf-task-main{display:grid;grid-template-columns:minmax(240px,1fr) minmax(300px,1.5fr) 68px 26px;gap:14px;align-items:center;padding:11px 13px}
.wf-task-id{font-family:var(--mono);font-size:8.1px;color:var(--ink3);letter-spacing:-.2px;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.wf-task-title{font-size:11.6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.wf-task-sub{font-size:8.9px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.wf-task-sub .sep{height:8px;width:1px;background:var(--line2)}
.wf-latest-run{font-size:8.7px;color:var(--ink3);display:flex;align-items:center;gap:5px;margin-top:2px}
.wf-latest-run .ic{width:9px;height:9px}
.chain{display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden}
.chain-node{min-width:0;flex:0 1 auto;display:flex;align-items:center;gap:3px;padding:3px 5px;border-radius:4px;border:1px solid var(--line);background:#fbfcfd;font-size:7.9px;color:var(--ink2);white-space:nowrap}
.chain-node .dot{width:4px;height:4px}
.chain-node.done{background:#f4faf7;border-color:#dbeee5;color:#1b6d55}.chain-node.done .dot{background:#249b72}
.chain-node.run{background:#f3f6ff;border-color:#dce4ff;color:#2d55c4}.chain-node.run .dot{background:#3f6cf0}
.chain-node.wait{background:#f8f9fb;color:#8b94a3}.chain-node.wait .dot{background:#b6bdca}
.chain-node.fail{background:#fff5f5;border-color:#f1dada;color:#a43438}.chain-node.fail .dot{background:#c94d52}
.chain-arrow{color:#c4cbd6;flex:none;font-size:8px}
.wf-task-expand{padding:0 13px 12px;border-top:1px dashed var(--line);background:#fcfdfe;animation:pop .16s ease both}
.expand-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;padding-top:11px}
.mini-title{font-size:8.5px;letter-spacing:.8px;color:var(--ink3);text-transform:uppercase;font-weight:600;margin-bottom:6px}
.expand-runs{display:flex;flex-direction:column;gap:3px}
.expand-run{display:grid;grid-template-columns:52px 12px minmax(0,1fr) 44px;gap:5px;align-items:center;font-size:8.7px;padding:3px 0;color:var(--ink2)}
.expand-run .t{font-family:var(--mono);font-size:7.9px;color:var(--ink3)}
.expand-run .s{font-size:8px;color:var(--ink3);text-align:right;font-family:var(--mono)}

/* ================= workflow manager ================= */
.wf-layout{display:grid;grid-template-columns:278px minmax(0,1fr);gap:14px;align-items:start}
.wf-sidebar{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.wf-side-head{padding:13px 13px 9px;display:flex;align-items:center;gap:7px}
.wf-side-head .panel-title{font-size:12.2px}
.wf-side-head .right{margin-left:auto}
.wf-list{padding:3px 7px 8px}
.wf-list-item{width:100%;text-align:left;padding:10px 9px;border-radius:8px;border:1px solid transparent;transition:.14s;margin-bottom:2px}
.wf-list-item:hover{background:#fafbfd}
.wf-list-item.on{background:linear-gradient(90deg,#f1f5ff,#fafbff);border-color:#dce5fa}
.wf-li-top{display:flex;align-items:center;gap:5px}
.wf-li-name{font-size:10.9px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-li-ver{font-family:var(--mono);font-size:7.7px;color:var(--ink3);margin-left:auto;flex:none}
.wf-li-sub{font-size:8.6px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-li-sub .dot{width:3px;height:3px}
.wf-li-bottom{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:8.2px;color:var(--ink3)}
.wf-li-bottom .health-bar{width:45px;height:3px}
.wf-empty{padding:20px 13px;font-size:10px;color:var(--ink3)}
.wf-detail{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.wf-detail-head{padding:16px 18px 13px;display:flex;align-items:flex-start;gap:12px}
.wf-detail-title{font-family:var(--font-display);font-size:22px;line-height:1.15;letter-spacing:-.3px;font-weight:600;margin:0 0 4px}
.wf-detail-desc{font-size:10.2px;color:var(--ink3);max-width:600px;line-height:1.5}
.wf-detail-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.wf-detail-head .right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;padding-top:3px}
.wf-tabs{display:flex;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:#fcfdfe}
.wf-tab{height:35px;font-size:10.5px;color:var(--ink3);border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px;transition:.14s}
.wf-tab:hover{color:var(--ink2)}
.wf-tab.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.wf-tab .n{font-family:var(--mono);font-size:8px;color:var(--ink3);background:var(--paper3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.wf-tab-body{padding:14px 16px 16px}
.canvas-wrap{position:relative;border:1px solid #e2e7ef;border-radius:11px;background:#fbfcfe;overflow:auto;scrollbar-width:thin}
.canvas{position:relative;width:900px;height:430px;background-image:radial-gradient(#dfe4ec .7px,transparent .7px);background-size:17px 17px}
.canvas-edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.canvas-edges path{fill:none;stroke:#c5cfdf;stroke-width:1.3;stroke-linecap:round}
.canvas-edges path.active{stroke:#6688e8;stroke-width:1.7;stroke-dasharray:4 5;animation:dash 8s linear infinite}
.canvas-edges .arrowhead{fill:#c2ccdc}
.wf-node{position:absolute;width:142px;min-height:62px;padding:8px 9px;border-radius:8px;border:1px solid #dfe4ec;background:#fff;box-shadow:0 2px 7px rgba(16,24,40,.05);text-align:left;transition:.15s;z-index:2}
.wf-node:hover{border-color:#bfcbe0;box-shadow:0 7px 18px rgba(16,24,40,.09);transform:translateY(-1px)}
.wf-node.selected{border-color:#5f82ec;box-shadow:0 0 0 3px rgba(47,98,240,.09),0 7px 18px rgba(16,24,40,.08)}
.wf-node .wn-top{display:flex;align-items:center;gap:5px}
.wn-ico{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;background:#f2f4f8;color:#5f6b7e;flex:none}
.wn-ico .ic{width:10px;height:10px}
.wf-node .wn-title{font-size:9.4px;font-weight:600;line-height:1.3;color:var(--ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn-code{font-family:var(--mono);font-size:7.1px;color:#a2aab7;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn-status{display:flex;align-items:center;gap:3px;font-size:7.5px;color:var(--ink3);margin-top:4px;white-space:nowrap}
.wn-status .dot{width:3px;height:3px}
.wf-node.trigger .wn-ico{background:#eaf8f2;color:#13795b}.wf-node.supervisor .wn-ico{background:#f1eeff;color:#6a4dd8}.wf-node.agent .wn-ico{background:#edf2ff;color:#2f62f0}.wf-node.gate .wn-ico{background:#fff6e7;color:#a96a12}.wf-node.tool .wn-ico{background:#e9f8f9;color:#0e7c86}.wf-node.close .wn-ico{background:#f2f4f7;color:#586273}
.canvas-legend{position:absolute;left:13px;bottom:11px;display:flex;align-items:center;gap:11px;font-size:7.6px;color:#9aa3b1;background:rgba(255,255,255,.78);border:1px solid #e8ecf2;border-radius:6px;padding:4px 7px;backdrop-filter:blur(4px);z-index:3}
.canvas-legend span{display:flex;align-items:center;gap:3px}
.canvas-legend .dot{width:4px;height:4px}
.canvas-hint{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:8.8px;color:var(--ink3)}
.canvas-hint .ic{width:11px;height:11px}
.wf-run-table td,.wf-run-table th{font-size:9.4px}
.version-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.version-row:first-child{border-top:none}
.version-mark{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--paper3);color:var(--ink3);flex:none;font-family:var(--mono);font-size:8px}
.version-main{flex:1;min-width:0}
.version-title{font-size:10.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.version-desc{font-size:8.8px;color:var(--ink3);margin-top:2px}
.trigger-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.trigger-card{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fbfcfe}
.trigger-card.on{border-color:#cfddfa;background:linear-gradient(180deg,#f7f9ff,#fff)}
.trigger-top{display:flex;align-items:center;gap:5px;font-size:9.2px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.trigger-top .ic{width:11px;height:11px;color:var(--blue)}
.trigger-val{font-size:9.4px;color:var(--ink);font-family:var(--mono);line-height:1.55;word-break:break-word}
.trigger-note{font-size:8.4px;color:var(--ink3);line-height:1.5;margin-top:5px}
.policy-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:10px}
.policy-cell{border-top:1px solid var(--line);padding-top:8px}
.policy-k{font-size:8.2px;color:var(--ink3);margin-bottom:3px}
.policy-v{font-size:10px;font-weight:600;color:var(--ink)}

/* ================= inbox ================= */
.inbox-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:13px}
.isum{padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:10px}
.isum-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--paper3);color:var(--ink3)}
.isum-ico .ic{width:14px;height:14px}
.isum-val{font-family:var(--font-display);font-size:20px;line-height:1;font-weight:600}
.isum-lab{font-size:8.6px;color:var(--ink3);margin-top:2px}
.batchbar{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:10px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:10px;color:var(--ink3)}
.batchbar .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.batchbar b{color:var(--ink2)}
.inbox-list{display:flex;flex-direction:column;gap:9px}
.dec-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 15px 13px 18px;box-shadow:0 1px 2px rgba(16,24,40,.03);overflow:hidden}
.dec-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#d6dbe4}
.dec-card.p0:before{background:var(--red)}.dec-card.p1:before{background:#d29a38}.dec-card.p2:before{background:#6884d8}
.dec-card.resolved{opacity:.72;background:#fbfcfd}
.dec-card.resolved:before{background:var(--green)}
.dec-head{display:flex;align-items:flex-start;gap:7px}
.dec-badges{display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex:none;padding-top:1px}
.dec-title{font-size:12px;font-weight:600;line-height:1.45;margin:0 0 3px;letter-spacing:.05px}
.dec-title .id{font-family:var(--mono);font-size:8.2px;color:var(--ink3);font-weight:400;margin-left:4px}
.dec-target{font-size:9.1px;color:var(--ink3)}
.dec-target .mono{font-size:8.4px;color:#7c8797}
.dec-why{margin-top:8px;padding:7px 9px;border-radius:6px;background:var(--paper3);border:1px solid #edf0f4;font-size:9.4px;color:var(--ink2);line-height:1.6}
.dec-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:8px}
.dec-label{font-size:8.4px;color:var(--ink3);margin-bottom:3px}
.dec-options{display:flex;gap:4px;flex-wrap:wrap}
.dec-opt{font-size:8.8px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:#fbfcfd;color:var(--ink2);font-family:var(--mono)}
.dec-evidence{font-size:9px;color:var(--ink2)}
.dec-evidence .mono{font-size:8.3px;background:var(--paper3);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.dec-foot{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:8.7px;color:var(--ink3);flex-wrap:wrap}
.dec-foot .right{margin-left:auto;display:flex;align-items:center;gap:5px}
.dec-foot .rev{font-family:var(--mono);font-size:8.2px}
.dec-note{font-size:8.2px;color:var(--ink3);margin-left:3px}

/* ================= effects ================= */
.effect-banner{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid #f0dfbc;background:#fffbf2;border-radius:9px;font-size:9.6px;color:#73541e;line-height:1.55;margin-bottom:13px}
.effect-banner .ic{width:15px;height:15px;color:#a96a12;margin-top:1px}
.effect-banner b{color:#5c4110}
.effect-list{display:flex;flex-direction:column;gap:8px}
.effect-card{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr) 100px;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.14s}
.effect-card:hover{border-color:#d5dce7;box-shadow:0 6px 16px rgba(16,24,40,.05)}
.eff-top{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.eff-id{font-family:var(--mono);font-size:7.9px;color:var(--ink3)}
.eff-title{font-size:11px;font-weight:600;margin-bottom:2px}
.eff-sub{font-size:8.8px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eff-declared{font-family:var(--mono);font-size:8.4px;color:#687487;background:var(--paper3);border:1px solid #edf0f4;border-radius:5px;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eff-verified{font-size:8.8px;color:var(--ink3);line-height:1.5}
.eff-verified b{color:var(--red);font-weight:600}
.eff-age{text-align:right;font-family:var(--mono);font-size:8.6px;color:var(--ink3)}
.eff-age .ic{width:11px;height:11px;margin-left:auto;margin-top:5px;color:#c1c8d3}

/* ================= events ================= */
.hash-banner{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid #d5ece0;background:#f4fbf8;border-radius:9px;font-size:9.5px;color:#1f6b53;margin-bottom:12px}
.hash-banner .ic{width:15px;height:15px}
.hash-banner .right{margin-left:auto;font-family:var(--mono);font-size:8.4px;color:#4e8b77}
.event-table td{font-size:9.6px}
.event-table .etype{font-family:var(--mono);font-size:8.7px;padding:2px 5px;border-radius:4px;background:#f2f4f7;color:#5f6b7c;border:1px solid #e6eaf0;white-space:nowrap}
.event-table .etype.amber{background:#fff6e7;color:#8a5c13;border-color:#f1e1c2}
.event-table .etype.green{background:#eef9f4;color:#116b50;border-color:#d8eee4}
.event-table .etype.red{background:#fff2f2;color:#a83a3f;border-color:#f2d8d9}
.event-table .eseq{font-family:var(--mono);font-size:8.5px;color:var(--ink3)}
.event-table .esum{color:var(--ink2);max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ================= drawer ================= */
.overlay{position:fixed;inset:0;background:rgba(10,16,28,.34);backdrop-filter:blur(2px);z-index:60;animation:fade .16s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(790px,calc(100vw - 34px));background:#fff;z-index:70;display:flex;flex-direction:column;box-shadow:-18px 0 70px rgba(5,12,24,.2);animation:slideIn .22s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{transform:translateX(24px);opacity:.7}to{transform:none;opacity:1}}
.drawer-head{position:relative;padding:18px 22px 13px;border-bottom:1px solid var(--line);flex:none;background:linear-gradient(180deg,#fff,#fcfdfe)}
.drawer-close{position:absolute;right:15px;top:14px;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink3)}
.drawer-close:hover{color:var(--ink);border-color:var(--line2)}
.drawer-close .ic{width:14px;height:14px}
.drawer-kicker{font-size:8.4px;letter-spacing:1.5px;color:var(--ink3);text-transform:uppercase;display:flex;align-items:center;gap:5px;margin-bottom:4px}
.drawer-title{font-family:var(--font-display);font-size:24px;line-height:1.15;letter-spacing:-.3px;font-weight:600;margin:0;padding-right:36px}
.drawer-sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:9.2px;color:var(--ink3)}
.drawer-tabs{display:flex;gap:15px;padding:9px 22px 0;border-bottom:1px solid var(--line);flex:none;background:#fff}
.drawer-tab{height:31px;font-size:10.2px;color:var(--ink3);border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px}
.drawer-tab.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.drawer-tab .n{font-family:var(--mono);font-size:7.8px;color:var(--ink3);background:var(--paper3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.drawer-body{flex:1;min-height:0;overflow:auto;padding:17px 22px 28px;background:#fcfdfe;scrollbar-width:thin}
.drawer-body::-webkit-scrollbar{width:7px}.drawer-body::-webkit-scrollbar-thumb{background:#d7dee8;border-radius:7px}
.section{margin-bottom:17px}
.section:last-child{margin-bottom:0}
.section-h{display:flex;align-items:center;gap:7px;margin:0 0 7px}
.section-h h3{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);font-weight:650;margin:0}
.section-h .right{margin-left:auto;display:flex;align-items:center;gap:5px}
.card-box{border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px 13px;box-shadow:0 1px 1px rgba(16,24,40,.02)}
.card-box.tint{background:var(--paper3)}
.callout{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border-radius:7px;font-size:9.6px;line-height:1.55;border:1px solid}
.callout .ic{width:14px;height:14px;margin-top:1px;flex:none}
.callout.warn{background:#fffbf2;border-color:#f0dfbc;color:#73541e}.callout.warn .ic{color:#a96a12}
.callout.info{background:#f3f7ff;border-color:#dbe6ff;color:#2d4d8f}.callout.info .ic{color:#4a72d8}
.callout.danger{background:#fff6f6;border-color:#f2d6d7;color:#873237}.callout.danger .ic{color:#c0393f}
.callout b{color:inherit}
.run-hero{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:9px;background:linear-gradient(180deg,#fff,#fbfcfe)}
.run-hero .big{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1}
.run-hero .meta{font-size:8.8px;color:var(--ink3);margin-top:3px}
.run-hero .right{margin-left:auto;text-align:right;font-size:8.8px;color:var(--ink3)}
.run-steps{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.run-step{display:grid;grid-template-columns:22px minmax(0,1fr) 62px;gap:8px;align-items:center;padding:9px 10px;border-top:1px solid var(--line);font-size:9.4px}
.run-step:first-child{border-top:none}
.step-mark{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:7px;font-family:var(--mono);background:#f2f4f7;color:#7f8999}
.step-mark.ok{background:#eaf8f2;color:#13795b}.step-mark.run{background:#edf2ff;color:#2f62f0}.step-mark.fail{background:#fff0f0;color:#c0393f}.step-mark.wait{background:#f6f7f9;color:#a0a8b5}
.run-step .st{font-weight:550;color:var(--ink2)}
.run-step .sd{font-size:8.4px;color:var(--ink3);margin-top:1px}
.run-step .sdur{font-family:var(--mono);font-size:8px;color:var(--ink3);text-align:right}
.run-history{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.run-history-row{display:grid;grid-template-columns:72px 12px minmax(0,1fr) 55px 50px 18px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:8.9px;cursor:pointer;transition:.12s}
.run-history-row:first-child{border-top:none}
.run-history-row:hover{background:#fafbfd}
.run-history-row.sel{background:#f4f7ff}
.run-history-row .t{font-family:var(--mono);font-size:8.1px;color:var(--ink3)}
.run-history-row .id{font-family:var(--mono);font-size:7.9px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-history-row .dur{font-family:var(--mono);font-size:8px;color:var(--ink3);text-align:right}
.run-history-row .ic{width:10px;height:10px;color:#b3bcc9;margin-left:auto}
.orchestration-tree{border:1px solid var(--line);border-radius:9px;background:#fbfcfe;padding:12px}
.ot-root{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:7px;background:#fff;border:1px solid #dfe5ef;box-shadow:0 1px 3px rgba(16,24,40,.04)}
.ot-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--violet2);color:#6448d4}
.ot-ico .ic{width:14px;height:14px}
.ot-name{font-size:10px;font-weight:600}.ot-role{font-size:8.2px;color:var(--ink3)}
.ot-branch{margin-left:18px;border-left:1px dashed #cbd4e2;padding-left:14px;margin-top:7px;display:flex;flex-direction:column;gap:5px}
.ot-child{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:9px}
.ot-child .dot{width:4px;height:4px}
.ot-child .right{margin-left:auto;font-size:8px;color:var(--ink3);font-family:var(--mono)}
.evidence-item{display:flex;align-items:flex-start;gap:7px;padding:8px;border:1px solid var(--line);border-radius:7px;background:#fff;margin-top:5px}
.evidence-item .ic{width:13px;height:13px;color:var(--ink3);margin-top:1px}
.evidence-item .en{font-size:9.2px;font-weight:550}.evidence-item .ed{font-size:8.4px;color:var(--ink3);margin-top:1px;line-height:1.45}

/* ================= modal ================= */
.modal-back{position:fixed;inset:0;background:rgba(10,16,28,.4);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:7vh 18px 30px;overflow:auto;animation:fade .16s ease both}
.modal{width:min(640px,100%);background:#fff;border-radius:14px;box-shadow:0 30px 90px rgba(5,12,24,.25);animation:modalIn .2s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:flex-start;gap:8px;padding:17px 19px 12px;border-bottom:1px solid var(--line)}
.modal-kicker{font-size:8.2px;letter-spacing:1.4px;color:var(--ink3);text-transform:uppercase;margin-bottom:3px}
.modal-title{font-family:var(--font-display);font-size:21px;line-height:1.15;letter-spacing:-.2px;font-weight:600;margin:0}
.modal-close{width:27px;height:27px;border-radius:6px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink3);margin-left:auto;flex:none}
.modal-close:hover{color:var(--ink)}
.modal-close .ic{width:13px;height:13px}
.modal-body{padding:15px 19px 18px;max-height:65vh;overflow:auto}
.modal-foot{padding:11px 19px;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;background:#fcfdfe}
.modal-foot .right{margin-left:auto;display:flex;gap:6px}
.field{margin-bottom:11px}
.field label{display:flex;align-items:center;gap:5px;font-size:9.4px;color:var(--ink2);font-weight:550;margin-bottom:4px}
.field label .req{color:var(--red);font-size:8px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line2);border-radius:7px;background:#fff;padding:7px 9px;outline:none;font-size:10.4px;color:var(--ink)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#9fb5e8;box-shadow:0 0 0 3px rgba(47,98,240,.07)}
.field textarea{resize:vertical;min-height:60px;line-height:1.55}
.option-list{display:flex;flex-direction:column;gap:5px}
.opt-card{display:flex;align-items:flex-start;gap:7px;padding:8px 9px;border:1px solid var(--line);border-radius:7px;cursor:pointer;transition:.12s;background:#fff}
.opt-card:hover{border-color:#cbd5e6;background:#fcfdff}
.opt-card.sel{border-color:#9ab3eb;background:#f4f7ff;box-shadow:0 0 0 2px rgba(47,98,240,.05)}
.opt-card input[type=radio]{width:13px;height:13px;flex:0 0 13px;margin:3px 0 0;padding:0;border:0;background:transparent;box-shadow:none;accent-color:var(--blue)}
.opt-main{min-width:0;flex:1}
.opt-title{font-size:9.6px;font-weight:600}.opt-desc{font-size:8.3px;color:var(--ink3);line-height:1.45;margin-top:1px}
.opt-code{font-family:var(--mono);font-size:7.6px;color:var(--ink3);flex:none;padding-top:1px}
.check-row{display:flex;align-items:flex-start;gap:7px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:4px;background:#fff;font-size:9.2px}
.check-row input{margin-top:2px;accent-color:var(--blue)}
.check-row .cm{flex:1}.check-row .cn{font-weight:550}.check-row .cd{font-size:8.2px;color:var(--ink3);margin-top:1px}
.modal-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 10px;background:var(--paper3);border:1px solid var(--line);border-radius:7px;font-size:9.2px;margin-bottom:10px}
.modal-summary dt{font-size:8.2px;color:var(--ink3);margin-bottom:1px}
.modal-summary dd{margin:0;font-weight:550}
.challenge-box{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #f0dfbc;background:#fffbf2;border-radius:7px;margin-top:8px}
.challenge-box .challenge{font-family:var(--mono);font-size:17px;letter-spacing:4px;font-weight:600;color:#7c5410}
.challenge-box .hint{font-size:8.4px;color:#95703a;line-height:1.45}
.challenge-box input{width:96px;border:1px solid #e4cfa8;border-radius:5px;padding:5px 7px;font-family:var(--mono);font-size:12px;letter-spacing:3px;outline:none;text-align:center}
.challenge-box input:focus{border-color:#c99e51;box-shadow:0 0 0 3px rgba(201,158,81,.1)}

/* ================= toast ================= */
.toast-root{position:fixed;right:20px;bottom:20px;z-index:120;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:7px;min-width:260px;max-width:400px;padding:9px 11px;border-radius:8px;background:#111a2b;color:#e9eff9;box-shadow:0 14px 35px rgba(5,12,24,.25);font-size:9.8px;line-height:1.5;animation:toastIn .2s ease both;pointer-events:auto}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast .ic{width:14px;height:14px;color:#77d6ae;margin-top:1px}
.toast.warn .ic{color:#e1b25d}
.toast b{font-weight:600;color:#fff}

/* ================= prototype v2 patches ================= */
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:0 1px 2px rgba(16,24,40,.03)}
.tbl{width:100%;border-collapse:collapse;font-size:10px}
.tbl th{font-size:8.4px;letter-spacing:.55px;color:var(--ink3);text-transform:uppercase;font-weight:600;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fcfdfe}
.tbl td{padding:9px 11px;border-bottom:1px solid #eef0f4;vertical-align:middle;color:var(--ink2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#fafbfd}
.chips{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.chips .chip{height:26px;font-size:10px}
.icon-btn.on{background:#eef3ff;border-color:#c9d7f8;color:var(--blue)}
.dec-card input[type=checkbox],.batchbar input[type=checkbox]{accent-color:var(--blue);margin-top:1px}
.history-pop{z-index:24}
.wf-node{font-family:inherit}
.wf-canvas-facts .card-box{padding:10px 11px}
button:focus-visible,.wf-node:focus-visible,.task-card:focus-visible{outline:2px solid #7d9bf0;outline-offset:2px}
.anno{background:#111a2b}
body.anno-on .anno:hover{background:#2f62f0}

/* ================= responsive ================= */
@media(max-width:1280px){
  .hero-grid{grid-template-columns:minmax(0,1fr) 300px}
  .orch-body{grid-template-columns:minmax(0,1fr) 220px}
  .agent-node{width:155px}
  .metric-val{font-size:24px}
}
@media(max-width:1120px){
  .hero-grid{grid-template-columns:1fr}
  .attention{min-height:0}
  .att-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  .att-item{border-bottom:none;border-right:1px solid var(--line)}
  .att-item:last-child{border-right:none}
  .metric-grid{grid-template-columns:repeat(2,1fr)}
  .lower-grid{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,1fr)}
  .wf-layout{grid-template-columns:1fr}
  .wf-list{display:grid;grid-template-columns:repeat(2,1fr)}
  .wf-side-head{border-bottom:1px solid var(--line)}
}
@media(max-width:900px){
  .sidebar{width:70px;padding:15px 9px}
  .brand-name,.brand-sub,.workspace .ws-meta,.workspace .ws-badge,.nav-label,.nav-item span,.nav-item .nb,.note-entry span,.user-name,.user-role{display:none}
  .brand{justify-content:center;padding-bottom:14px}
  .workspace{justify-content:center;padding:7px}
  .nav-item{justify-content:center;padding:9px}
  .nav-item.active{box-shadow:none}
  .sidebar-foot .note-entry{justify-content:center}
  .main{margin-left:70px}
  .topbar{padding:0 16px}
  .crumb{min-width:0}
  .top-status{display:none}
  #screen{padding:18px 16px 30px}
  .page-head h1{font-size:31px}
  .orch-body{grid-template-columns:1fr}
  .feed{border-left:none;border-top:1px solid rgba(255,255,255,.07);padding-left:0;padding-top:12px;height:180px}
  .shared-board{overflow:auto}
  .sb-list{grid-template-columns:repeat(3,minmax(110px,1fr))}
  .board{grid-template-columns:1fr}
  .wf-task-main{grid-template-columns:1fr 26px;gap:8px}
  .wf-task-main .chain{grid-column:1/-1;order:3}
  .wf-task-main .btn{grid-column:2;grid-row:1}
  .trigger-grid{grid-template-columns:1fr}
  .policy-grid{grid-template-columns:repeat(2,1fr)}
  .dec-grid{grid-template-columns:1fr}
  .effect-card{grid-template-columns:1fr;gap:7px}
  .eff-age{text-align:left}
  .inbox-summary{grid-template-columns:repeat(2,1fr)}
  .wf-list{grid-template-columns:1fr}
}
@media(max-width:620px){
  .topbar{gap:8px}
  .searchbox{max-width:none}
  .top-actions .icon-btn:nth-of-type(1){display:none}
  .page-head{flex-direction:column;align-items:flex-start;gap:10px}
  .head-actions{width:100%}
  .hero-grid{gap:10px}
  .orch-head{padding:15px 14px 4px}
  .orch-body{padding:4px 12px 0}
  .stage{height:400px}
  .agent-node{width:146px}
  .agent-node.an-scout{left:0;top:0}.agent-node.an-drafter{right:0;top:0}.agent-node.an-auditor{left:0;bottom:0}.agent-node.an-verifier{right:0;bottom:0}
  .core{top:50%;width:132px;height:132px}
  .shared-board{margin:2px 12px 12px}
  .sb-list{grid-template-columns:repeat(2,minmax(110px,1fr))}
  .metric-grid{grid-template-columns:1fr 1fr;gap:7px}
  .metric{padding:10px}
  .metric-val{font-size:21px}
  .att-list{grid-template-columns:1fr}
  .att-item{border-right:none;border-bottom:1px solid var(--line)}
  .wf-detail-head{flex-direction:column}
  .wf-detail-head .right{padding-top:0}
  .wf-tabs{gap:12px;overflow:auto;padding:0 13px}
  .wf-tab{white-space:nowrap}
  .wf-detail-body{padding:12px 10px}
  .canvas{width:820px}
  .drawer{width:100vw}
  .drawer-title{font-size:21px}
  .drawer-body{padding:14px 14px 22px}
  .drawer-head{padding:15px 14px 11px}
  .drawer-tabs{padding-left:14px;gap:12px;overflow:auto}
  .modal-back{padding:4vh 10px 20px}
  .toast-root{left:12px;right:12px;bottom:12px;align-items:stretch}
  .toast{max-width:none;min-width:0}
  .effect-card{padding:10px}
  .dec-card{padding:12px 12px 11px 15px}
  .dec-foot .right{width:100%;margin-left:0;justify-content:flex-end;margin-top:4px}
}

/* ============================================================
   v3 · editorial control room
   纸色、墨色、一道砖红；直角、细线、不堆容器。
   ============================================================ */
body.v3{
  --bg:#f5f1e8;
  --paper:#fffdf8;
  --paper2:#efe9de;
  --paper3:#e9e2d5;
  --ink:#1c1a17;
  --ink2:#514c44;
  --ink3:#8b8377;
  --ink4:#b8afa0;
  --line:#ded6c8;
  --line2:#cfc5b5;
  --accent:#a63f2b;
  --accent2:#f1e1da;
  --green:#3f6b53;
  --green2:#e7efe8;
  --amber:#8d6730;
  --amber2:#f4ebda;
  --red:#a63f2b;
  --red2:#f3e2dd;
  --blue:#3d5a73;
  --blue2:#e7edf1;
  --violet:#6b5b7b;
  --violet2:#eee9ef;
  --dark:#1b1a17;
  --dark2:#23211d;
  --dark-ink:#f2eadc;
  --dark-muted:#a39a8b;
  --radius:2px;
  --shadow:none;
  --shadow2:0 30px 80px rgba(25,20,12,.28);
  --font-ui:"Avenir Next","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-display:"Iowan Old Style","Palatino Linotype","Songti SC","Noto Serif SC",Georgia,serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:13.5px;
  line-height:1.6;
}
body.v3 ::selection{background:#e7c9be;color:#1c1a17}
body.v3 .ic{width:15px;height:15px;stroke-width:1.6}
body.v3 a,body.v3 button{color:inherit}

/* shell */
body.v3 .sidebar{
  width:224px;padding:30px 22px 20px;color:var(--ink);
  background:var(--paper2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
body.v3 .sidebar:after{display:none}
body.v3 .brand{padding:0 0 26px;display:block}
body.v3 .brand-mark{display:none}
body.v3 .brand-name{
  font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.05;
  letter-spacing:-.2px;color:var(--ink);
}
body.v3 .brand-name:first-letter{color:var(--accent)}
body.v3 .brand-sub{
  margin-top:7px;font-size:9px;line-height:1;letter-spacing:2.4px;
  color:var(--ink3);text-transform:uppercase;
}
body.v3 .workspace{
  margin:0 0 30px;padding:0 0 18px;border:0;border-bottom:1px solid var(--line);
  border-radius:0;background:none;display:block;text-align:left;width:100%;
}
body.v3 .workspace:hover{background:none;border-color:var(--line2)}
body.v3 .ws-avatar,body.v3 .ws-badge{display:none}
body.v3 .ws-name{font-size:12.5px;font-weight:600;color:var(--ink)}
body.v3 .ws-url{font-size:10.5px;color:var(--ink3);margin-top:3px;letter-spacing:.2px}
body.v3 .nav-scroll{flex:1;padding:0}
body.v3 .nav-label{
  margin:0 0 8px;padding:0;font-size:9px;letter-spacing:2.2px;
  text-transform:uppercase;color:var(--ink4);font-weight:600;
}
body.v3 .nav-label + .nav-item{margin-top:0}
body.v3 .nav-item{
  position:relative;width:100%;height:38px;margin:0;padding:0 2px;
  border:0;border-radius:0;background:none;display:flex;align-items:center;
  gap:0;color:var(--ink2);font-size:13px;text-align:left;
}
body.v3 .nav-item:hover{background:none;color:var(--ink)}
body.v3 .nav-item .ic{display:none}
body.v3 .nav-item span:first-of-type{transition:.15s}
body.v3 .nav-item.on{background:none;color:var(--ink);box-shadow:none;font-weight:600}
body.v3 .nav-item.on span:first-of-type{padding-left:0}
body.v3 .nav-item.on:after{display:none}
body.v3 .nav-item .nb{
  margin-left:auto;padding:0;min-width:0;height:auto;border:0;border-radius:0;
  background:none!important;color:var(--ink3)!important;font-size:10.5px!important;
  font-weight:500;letter-spacing:.2px;
}
body.v3 .nav-item.on .nb{color:var(--accent)!important}
body.v3 .nav-label:nth-of-type(2){margin-top:30px}
body.v3 .sidebar-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}
body.v3 .note-entry{
  display:flex;align-items:center;gap:0;width:100%;padding:0 0 16px;
  color:var(--ink3);font-size:11.5px;text-align:left;
}
body.v3 .note-entry .ic{display:none}
body.v3 .note-entry:hover{color:var(--accent)}
body.v3 .user-row{display:flex;align-items:center;gap:10px;padding:0}
body.v3 .user-avatar{
  width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;font-family:var(--font-display);font-size:13px;
}
body.v3 .user-name{font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.2}
body.v3 .user-role{font-size:8.5px;letter-spacing:1.6px;color:var(--ink4);margin-top:3px}
body.v3 .main{margin-left:224px}

body.v3 .topbar{
  height:64px;padding:0 40px;background:rgba(245,241,232,.94);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:22px;
}
body.v3 .crumb{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink3);flex:none}
body.v3 .crumb .ic{display:none}
body.v3 .crumb span{color:var(--ink3)}
body.v3 .crumb b{font-weight:500;color:var(--ink2)}
body.v3 .crumb-sep{color:var(--ink4)}
body.v3 .searchbox{
  margin-left:10px;flex:0 1 380px;height:30px;padding:0;
  border:0;border-bottom:1px solid var(--line2);border-radius:0;background:none;
  display:flex;align-items:center;gap:8px;
}
body.v3 .searchbox:focus-within{border-bottom-color:var(--ink)}
body.v3 .searchbox .ic{color:var(--ink3);width:13px;height:13px}
body.v3 .searchbox input{
  width:100%;height:28px;padding:0;border:0;background:none;outline:0;
  font-size:11.5px;color:var(--ink);
}
body.v3 .searchbox input::placeholder{color:var(--ink3)}
body.v3 .kbd{
  display:none;padding:0;border:0;border-radius:0;background:none;
  color:var(--ink4);font-family:var(--mono);font-size:9px;
}
body.v3 .top-status{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  font-size:9.5px;letter-spacing:.8px;color:var(--ink3);text-transform:uppercase;
}
body.v3 .live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:none}
body.v3 .top-actions{display:flex;align-items:center;gap:2px;margin-left:10px}
body.v3 .icon-btn{
  width:28px;height:28px;border:0;border-radius:0;background:none;color:var(--ink3);
  display:grid;place-items:center;
}
body.v3 .icon-btn:hover{background:none;color:var(--ink)}
body.v3 .avatar-btn{
  width:28px;height:28px;margin-left:10px;border:0;border-radius:50%;
  background:var(--ink);color:var(--paper);font-family:var(--font-display);font-size:12px;
}

/* page frame */
body.v3 #screen{max-width:1460px;padding:46px 48px 76px}
body.v3 .masthead{margin:0 0 36px;max-width:1120px}
body.v3 .mast-kicker{
  margin:0 0 14px;font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;
  color:var(--ink3);font-weight:600;
}
body.v3 .mast-top{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:32px;
}
body.v3 .masthead h1{
  margin:0;max-width:860px;font-family:var(--font-display);
  font-size:46px;line-height:1.16;letter-spacing:-1.2px;font-weight:600;color:var(--ink);
}
body.v3 .mast-actions{display:flex;align-items:center;gap:8px;flex:none;padding-top:6px}
body.v3 .mast-lede{
  margin:14px 0 0;max-width:660px;color:var(--ink2);font-size:13.5px;
  line-height:1.8;letter-spacing:.1px;
}
body.v3 .btn{
  height:32px;padding:0 15px;border:1px solid var(--line2);border-radius:0;
  background:transparent;color:var(--ink2);font-size:11.5px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:none;transition:color .15s,border-color .15s,background .15s;
}
body.v3 .btn:hover{border-color:var(--ink);color:var(--ink);background:transparent}
body.v3 .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
body.v3 .btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
body.v3 .btn.ghost{border-color:transparent;color:var(--ink3)}
body.v3 .btn.ghost:hover{color:var(--ink);border-color:transparent}
body.v3 .btn.sm{height:26px;padding:0 10px;font-size:10.5px}
body.v3 .btn .ic{width:13px;height:13px}
body.v3 .link-btn{
  padding:0;border:0;border-bottom:1px solid var(--accent);border-radius:0;
  background:none;color:var(--accent);font-size:inherit;
}

/* generic surfaces / old classes */
body.v3 .page{animation:none}
body.v3 .card-box,
body.v3 .panel,
body.v3 .isum,
body.v3 .inbox-summary,
body.v3 .table-wrap,
body.v3 .effect-card,
body.v3 .dec-card,
body.v3 .task-card,
body.v3 .wf-list-item,
body.v3 .wf-detail,
body.v3 .orchestra,
body.v3 .attention,
body.v3 .metric,
body.v3 .run-hero,
body.v3 .evidence-item{
  border-radius:0;box-shadow:none;
}
body.v3 .tag,body.v3 .type,body.v3 .status,body.v3 .chip,
body.v3 .etype,body.v3 .nb,body.v3 .anno,body.v3 .kbd{
  border-radius:0;box-shadow:none;
}
body.v3 .tag{
  height:auto!important;padding:0!important;border:0!important;background:none!important;
  font-size:9.5px!important;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink3)!important;font-weight:600;
}
body.v3 .tag.red{color:var(--accent)!important}
body.v3 .tag.amber{color:var(--amber)!important}
body.v3 .tag.green{color:var(--green)!important}
body.v3 .tag.violet,body.v3 .tag.blue{color:var(--blue)!important}
body.v3 .type{
  height:auto!important;padding:0!important;border:0!important;background:none!important;
  font-size:9.5px!important;letter-spacing:1px;color:var(--ink3)!important;font-weight:600;
  display:inline-flex;align-items:center;gap:0;
}
body.v3 .type .ic{display:none}
body.v3 .status{
  height:auto!important;padding:0!important;border:0!important;background:none!important;
  font-size:10.5px!important;color:var(--ink2)!important;display:inline-flex;align-items:center;gap:5px;
}
body.v3 .status .dot{width:4px!important;height:4px!important;border-radius:50%}
body.v3 .chip{
  height:auto;padding:0 0 7px;border:0;border-bottom:1px solid transparent;background:none!important;
  color:var(--ink3);font-size:11.5px;white-space:nowrap;
}
body.v3 .chip.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:600}
body.v3 .chip:hover{color:var(--ink)}
body.v3 .empty{
  padding:34px 0;border-top:1px solid var(--line);color:var(--ink3);
  font-size:12px;text-align:left;
}
body.v3 .anno{display:none}
body.v3 .callout{
  padding:12px 14px;border:1px solid var(--line);border-left:0;border-right:0;
  background:none;border-radius:0;color:var(--ink2);font-size:11.5px;line-height:1.7;
}
body.v3 .callout .ic{display:none}
body.v3 .callout.danger{border-color:#dcc5bd;color:#6f3024;background:#f7ece7}
body.v3 .callout.warn{border-color:#ddd0b8;color:#6f5529;background:#f7f1e4}
body.v3 .callout.info{border-color:var(--line);color:var(--ink2);background:transparent}

/* overview */
body.v3 .overview-grid{
  display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.72fr);
  gap:34px;align-items:start;margin-bottom:34px;
}
body.v3 .ops{
  background:var(--dark);color:var(--dark-ink);padding:26px 28px 20px;
  min-width:0;
}
body.v3 .ops-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
body.v3 .ops-kicker{
  margin:0 0 8px;font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--dark-muted);
}
body.v3 .ops-title{
  margin:0;font-family:var(--font-display);font-size:27px;line-height:1.15;
  font-weight:500;color:var(--dark-ink);letter-spacing:-.3px;
}
body.v3 .ops-title .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8fbf9d;margin-right:8px;vertical-align:3px}
body.v3 .ops-goal{
  margin:10px 0 0;color:var(--dark-muted);font-size:11.5px;line-height:1.7;max-width:600px;
}
body.v3 .ops-ctrl{display:flex;align-items:center;gap:14px;flex:none;padding-top:2px}
body.v3 .ops-ctrl button{
  color:var(--dark-muted);font-size:10.5px;border-bottom:1px solid transparent;padding:0 0 2px;
}
body.v3 .ops-ctrl button:hover{color:var(--dark-ink);border-bottom-color:var(--dark-muted)}
body.v3 .ops-body{
  display:grid;grid-template-columns:minmax(0,1fr) 214px;gap:26px;
  margin-top:26px;padding-top:22px;border-top:1px solid rgba(242,234,220,.15);
}
body.v3 .ops-map{
  display:grid;grid-template-columns:minmax(0,1fr) 136px minmax(0,1fr);
  gap:18px;align-items:center;min-height:206px;
}
body.v3 .lane{display:flex;flex-direction:column;gap:20px;min-width:0}
body.v3 .lane-l{align-items:stretch;text-align:right}
body.v3 .lane-r{align-items:stretch}
body.v3 .agent{min-width:0;position:relative;padding:9px 0;border-top:1px solid rgba(242,234,220,.13)}
body.v3 .lane-l .agent{padding-right:20px}
body.v3 .lane-r .agent{padding-left:20px}
body.v3 .lane-l .agent:after,
body.v3 .lane-r .agent:before{
  content:"";position:absolute;top:19px;width:12px;height:1px;background:rgba(242,234,220,.25);
}
body.v3 .lane-l .agent:after{right:0}
body.v3 .lane-r .agent:before{left:0}
body.v3 .agent-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
body.v3 .lane-l .agent-top{justify-content:flex-end}
body.v3 .agent-name{font-size:11.5px;font-weight:600;color:var(--dark-ink)}
body.v3 .agent-state{font-size:9px;letter-spacing:.6px;color:var(--dark-muted)}
body.v3 .agent-state.run{color:#d8b274}
body.v3 .agent-state.done{color:#8fbf9d}

body.v3 .ops-log{border-left:1px solid rgba(242,234,220,.15);padding-left:18px;min-width:0}

body.v3 .log-item{padding:9px 0;border-top:1px solid rgba(242,234,220,.1)}

body.v3 .log-time{font-family:var(--mono);font-size:8px;color:#777064;letter-spacing:.3px}
body.v3 .log-text{font-size:10.5px;line-height:1.55;color:#c9c0b1;margin-top:2px}
body.v3 .log-text b{color:var(--dark-ink);font-weight:600}
body.v3 .ops-board{
  margin-top:20px;padding-top:16px;border-top:1px solid rgba(242,234,220,.15);
}
body.v3 .board-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
body.v3 .board-head span:first-child{font-size:8.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--dark-muted)}
body.v3 .board-head span:last-child{font-size:9px;color:#777064}
body.v3 .board-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
body.v3 .board-item{padding:0 12px;border-left:1px solid rgba(242,234,220,.13);min-width:0}

body.v3 .board-agent{font-size:8.5px;color:#777064;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.v3 .board-dot{display:inline-block;width:4px;height:4px;border-radius:50%;margin-right:4px;vertical-align:1px}
body.v3 .asks{padding-top:2px;min-width:0}
body.v3 .rail-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 4px}

}
body.v3 .rail-head span{font-family:var(--font-display);font-size:17px;color:var(--accent)}
body.v3 .rail-lede{margin:0 0 8px;font-size:10.5px;color:var(--ink3);line-height:1.6}
body.v3 .ask{
  display:block;width:100%;text-align:left;padding:15px 0 14px;border:0;border-top:1px solid var(--line);

}

body.v3 .ask-title{font-size:13.5px;line-height:1.5;font-weight:600;color:var(--ink);transition:color .15s}
body.v3 .ask-why{margin-top:5px;font-size:11px;line-height:1.6;color:var(--ink3)}
body.v3 .ask-go{margin-top:8px;font-size:10.5px;color:var(--accent)}
body.v3 .rail-more{display:inline-block;margin-top:14px;font-size:10.5px;color:var(--ink3);border-bottom:1px solid var(--line2);padding-bottom:2px}

body.v3 .stats-strip{
  display:grid;grid-template-columns:repeat(4,1fr);

}

body.v3 .stat-num em{font-family:var(--font-ui);font-style:normal;font-size:11px;color:var(--ink3);margin-left:4px;letter-spacing:0}
body.v3 .stat-label{margin-top:7px;font-size:10px;letter-spacing:.6px;color:var(--ink3)}
body.v3 .lower{display:grid;grid-template-columns:1.35fr 1fr;gap:44px}
body.v3 .block-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--ink)}

body.v3 .event-text{font-size:11.5px;line-height:1.5;color:var(--ink2);min-width:0}

body.v3 .event-out.ok{color:var(--green)}
body.v3 .event-out.wait{color:var(--amber)}
body.v3 .event-out.bad{color:var(--accent)}
body.v3 .flow-line{display:grid;grid-template-columns:minmax(0,1fr) 88px 32px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

body.v3 .flow-bar{height:1px;background:var(--line);position:relative}
body.v3 .flow-bar i{display:block;height:1px;background:var(--green)}
body.v3 .flow-pct{font-family:var(--mono);font-size:9px;color:var(--ink3);text-align:right}

/* tasks */

  display:flex;align-items:center;justify-content:space-between;gap:24px;

}

}

  border-bottom:1px solid var(--line2);
}
body.v3 .mini-search .ic{width:12px;height:12px;color:var(--ink3)}

body.v3 .view-switch{display:flex;align-items:center;gap:12px}

}

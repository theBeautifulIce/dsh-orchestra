function wfTriggers(wf){
  const cards = [
    { title: '按时间', val: wf.trigger === 'schedule' ? (wf.triggerLabel || '还没设时间') : '没有启用', note: '错过只补最近一次，不补历史。', on: wf.trigger === 'schedule' },
    { title: '按事件', val: wf.trigger === 'event' ? wf.triggerLabel : '没有启用', note: '同一件事只触发一次，不重复跑。', on: wf.trigger === 'event' },
    { title: '一直做到完成', val: wf.trigger === 'continuous' ? '目标没完成就一直推进' : '需要时手动开始', note: '每次推进都要有可验证的结果，否则停下来问你。', on: wf.trigger !== 'schedule' && wf.trigger !== 'event' }
  ];
  return '<div class="wf-tab-body"><div class="wf-trigger-head"><span>什么时候开始跑</span><button class="btn ghost sm" data-act="edit-wf" data-wf="' + wf.id + '">去设置</button></div><div class="trigger-grid">' +
    cards.map(c => '<div class="trigger-card ' + (c.on ? 'on' : '') + '"><div class="trigger-top">' + c.title + '</div><div class="trigger-val">' + esc(c.val) + '</div><div class="trigger-note">' + c.note + '</div></div>').join('') +
  '</div><div class="policy-grid">' +
    '<div class="policy-cell"><div class="policy-k">同时跑几条</div><div class="policy-v">同一个任务一次只跑一条</div></div>' +
    '<div class="policy-cell"><div class="policy-k">重复触发</div><div class="policy-v">同一件事只跑一次</div></div>' +
    '<div class="policy-cell"><div class="policy-k">失败重试</div><div class="policy-v">最多 2 次，间隔逐渐拉长</div></div>' +
    '<div class="policy-cell"><div class="policy-k">算完成的条件</div><div class="policy-v">核验通过</div></div>' +
  '</div><div class="callout warn">发布前：草稿要先试跑一次，而且不能有没处理的 P0。发布动作会记到「发生过的」。</div></div>';
}

function wfGateInfo(wf){
  const runs = wf.runRows || [];
  const passed = runs.filter(r => r.status === 'succeeded' || r.status === 'done').length;
  const taskIds = new Set(runs.map(r => r.task).filter(Boolean));
  const openP0 = DECISIONS.filter(d => d.priority === 'P0' && d.status !== 'resolved' && !state.reviewChoices[d.id] && (d.wfId === wf.id || taskIds.has(d.taskId))).length;
  return { runs: runs.length, passed: passed, last: runs[0] || null, openP0: openP0, ready: passed > 0 && openP0 === 0 };
}

function wfGateBanner(wf){
  const g = wfGateInfo(wf);
  if(wf.status !== 'draft') return '<div class="wf-gate ok">已发布 · ' + esc(wf.version) + ' · 当前版本有 ' + g.passed + ' 次试运行通过</div>';
  if(!g.runs) return '<div class="wf-gate wait">还没有试跑过。先跑一次，看到完整结果后才能发布。</div>';
  if(!g.passed) return '<div class="wf-gate wait">还没有一次跑通的试运行。最近一次停在「' + esc(statusWord(g.last ? g.last.status : 'blocked')) + '」，处理后再跑。</div>';
  if(g.openP0) return '<div class="wf-gate wait">试运行已通过，但还有 ' + g.openP0 + ' 件高优先级事项等你处理；处理完才能发布。</div>';
  return '<div class="wf-gate ok">试运行已通过 · ' + esc((g.last && g.last.time) || '刚刚') + ' · ' + g.passed + ' 次通过 · 可以发布</div>';
}

function renderWorkflows(){
  const wf = wfByIdSafe(state.selectedWorkflow);
  const tab = state.wfTab || 'canvas';
  const g = wfGateInfo(wf);
  const canPublish = wf.status === 'draft' && g.ready;
  const tabs = [['canvas', '步骤'], ['versions', '版本'], ['runs', '运行', wf.runRows.length], ['triggers', '触发与策略']];
  const panelHead = tab === 'canvas'
    ? ['步骤与现场', '共 ' + wf.nodes.length + ' 步 · 点任意一步看它的过程']
    : tab === 'versions' ? ['版本记录', '每次改做法都留一条，跑过的记录不跟着变']
    : tab === 'runs' ? ['运行记录', '最近 ' + wf.runRows.length + ' 次']
    : ['触发与策略', '什么时候开始、什么时候停下'];
  const content = tab === 'canvas' ? wfCanvas(wf) : tab === 'versions' ? wfVersions(wf) : tab === 'runs' ? wfRuns(wf) : wfTriggers(wf);
  return '<section class="page">' +
    '<div class="wf-top"><div class="wf-top-main"><div class="wf-top-kicker">流程 · ' + (wf.status === 'draft' ? '草稿' : '已发布') + '</div><h1>' + esc(tidy(wf.name)) + '</h1><p>' + esc(tidy(wf.desc)) + '</p><div class="wf-top-meta"><span>' + esc(wf.version) + '</span><span>·</span><span>' + esc(wf.triggerLabel) + '</span><span>·</span><span>负责人 ' + esc(wf.owner) + '</span><span>·</span><span>' + wf.nodes.length + ' 步</span><span>·</span><span>' + wf.runRows.length + ' 次运行</span></div></div><div class="wf-top-actions">' +
      '<button class="btn ghost" data-act="new-workflow">新建流程</button>' +
      '<button class="btn ghost" data-act="edit-wf" data-wf="' + wf.id + '">设置</button>' +
      (wf.status === 'draft' ? '<button class="btn ghost" data-act="wf-add-step" data-wf="' + wf.id + '">加一步</button>' : '') +
      (wf.status === 'draft' ? (canPublish ? '<button class="btn" data-act="publish-wf" data-wf="' + wf.id + '">发布 ' + esc(wf.version) + '</button>' : '<button class="btn ghost" data-act="publish-wf" data-wf="' + wf.id + '">检查发布条件</button>') : '<button class="btn" data-act="new-version" data-wf="' + wf.id + '">新版本</button>') +
      '<button class="btn primary" data-act="wf-test" data-wf="' + wf.id + '">试跑一次</button>' +
    '</div></div>' +
    '<div class="wf-switch">' + Object.keys(WORKFLOWS).map(k => {
      const w = WORKFLOWS[k];
      return '<button class="wf-pill ' + (wf.id === w.id ? 'on' : '') + '" data-act="open-wf" data-wf="' + w.id + '"><span class="dot" style="background:' + (w.status === 'draft' ? '#fbbf24' : '#4ade80') + '"></span>' + esc(tidy(w.name)) + '<em>' + esc(w.version) + '</em></button>';
    }).join('') + '</div>' + wfGateBanner(wf) +
    '<div class="wf-tabs">' + tabs.map(t => '<button class="wf-tab ' + (tab === t[0] ? 'on' : '') + '" data-act="wf-tab" data-tab="' + t[0] + '">' + t[1] + (t[2] ? '<span class="n">' + t[2] + '</span>' : '') + '</button>').join('') + '</div>' +
    '<div class="wf-body"><div class="wf-stage-panel"><div class="wf-panel-head"><b>' + panelHead[0] + '</b><span>' + panelHead[1] + '</span></div>' + content + '</div><aside class="wf-aside">' + wfInspector(wf) + '</aside></div>' +
  '</section>';
}

/* ============================================================
   Part C · 待你决定 / 待核实 / 发生过的
   ============================================================ */
function decisionCard(d){
  const resolved = d.status === 'resolved' || !!state.reviewChoices[d.id];
  const checked = state.selectedDecisions.has(d.id);
  return '<article class="dec-card' + (resolved ? ' resolved' : '') + '" data-decfocus="' + d.id + '">' +
    '<div class="dec-head">' + (resolved ? '' : '<input class="dec-check" type="checkbox" data-act="toggle-dec" data-dec="' + d.id + '" ' + (checked ? 'checked' : '') + ' aria-label="选择 ' + esc(tidy(d.title)) + '">') + '<div class="dec-body">' +
      '<div class="dec-meta"><span class="ask-pri ' + (d.priority === 'P0' ? 'p0' : '') + '">' + esc(d.priority) + '</span><span>' + esc(d.created) + '</span><span>' + (resolved ? '已处理' : '等你决定') + '</span></div>' +
      '<h3 class="dec-title">' + esc(tidy(d.title)) + '</h3>' +
      '<p class="dec-why">' + esc(tidy(d.why)) + '</p>' +
      '<div class="dec-options">' + d.allowed.map(a => '<div class="dec-choice" role="button" tabindex="0" data-act="pick-decision" data-dec="' + d.id + '" data-choice="' + a + '"><b>' + esc(tidy((d.allowedLabels && d.allowedLabels[a]) || a)) + '</b><span>' + esc(tidy((d.allowedDesc && d.allowedDesc[a]) || '')) + '</span></div>').join('') + '</div>' +
      '<div class="dec-foot"><span>' + (resolved ? '已提交，等系统确认' : '提交后会记到「发生过的」，不能撤回') + '</span><span class="right"><button class="btn ghost sm" data-act="open-decision" data-dec="' + d.id + '">' + (resolved ? '看当时怎么选的' : '处理') + ' →</button></span></div>' +
    '</div></div>' +
  '</article>';
}

function renderInbox(){
  const open = DECISIONS.filter(d => d.status !== 'resolved' && !state.reviewChoices[d.id]);
  const done = DECISIONS.filter(d => d.status === 'resolved' || state.reviewChoices[d.id]);
  const p0 = open.filter(d => d.priority === 'P0').length;
  const selected = Array.from(state.selectedDecisions).filter(id => open.some(d => d.id === id));
  return '<section class="page">' +
    pageHead('等你决定 · ' + open.length + ' 件', '待你决定',
      '只放需要你承担后果的选择；每件都写清发生了什么、能怎么选。',
      '<button class="btn" data-act="refresh-inbox">刷新</button>') +
    '<div class="summary-line">' +
      '<div class="summary-cell hot"><b>' + p0 + '</b><span>必须现在处理</span></div>' +
      '<div class="summary-cell"><b>' + open.length + '</b><span>等你决定</span></div>' +
      '<div class="summary-cell"><b>' + openEffects().length + '</b><span>待核实</span></div>' +
      '<div class="summary-cell"><b>' + done.length + '</b><span>已处理</span></div>' +
    '</div>' +
    '<div class="batchbar"><label class="batch-check"><input type="checkbox" data-act="select-all-dec" ' + (open.length && selected.length === open.length ? 'checked' : '') + ' aria-label="全选待处理"><span>全选</span></label><span>已选 <b>' + selected.length + '</b> 件</span><span class="batch-hint">标为已读不会替你处理任何一件</span><span class="right"><button class="btn ghost sm" data-act="batch-ack" ' + (selected.length ? '' : 'disabled') + '>标为已读</button></span></div>' +
    '<div class="inbox-list">' + (open.length ? open.map(decisionCard).join('') : '<div class="empty">现在没有等你决定的事。</div>') + '</div>' +
    (done.length ? '<details class="inbox-processed"><summary>已处理 ' + done.length + ' 件</summary><div class="inbox-list">' + done.map(decisionCard).join('') + '</div></details>' : '') +
  '</section>';
}

function effectCard(e){
  const lv = e.level === 'irreversible' ? '不可逆' : e.level === 'external' ? '已经发出去' : '还能补救';
  return '<article class="effect-card" data-act="open-effect" data-eff="' + e.id + '">' +
    '<div><div class="eff-top"><span class="eff-level">' + lv + '</span><span class="estate ' + (e.status === 'signed' ? 'ok' : 'wait') + '">' + (e.status === 'signed' ? '已经接手' : '等你接手') + '</span></div>' +
      '<div class="eff-title">' + esc(tidy(e.title)) + '</div><div class="eff-why">' + esc(tidy(e.why)) + '</div></div>' +
    '<div class="eff-evidence"><b>现在的情况</b>' + esc(tidy(e.verified)) + '</div>' +
    '<div class="eff-age">' + esc(e.age) + '<span>' + (e.status === 'signed' ? '已签字' : '签字接手 →') + '</span></div>' +
  '</article>';
}

function renderEffects(){
  const filter = state.effectFilter || 'all';
  const list = EFFECTS.filter(e => filter === 'all' ? true : filter === 'open' ? e.status === 'open' : filter === 'signed' ? e.status === 'signed' : e.level === filter);
  return '<section class="page">' +
    pageHead('待核实 · ' + openEffects().length + ' 笔', '待核实',
      '已经发生但没有系统确认的操作；签字只代表你接手后续核验。',
      '<button class="btn" data-act="export-effects">导出清单</button>') +
    '<div class="callout warn">这里不是待办清单，是风险账。签了字不等于风险消失，只代表你知道它、愿意接手后续核验。</div>' +
    '<div class="chips">' + [['all', '全部'], ['open', '等你接手'], ['signed', '已接手'], ['irreversible', '不可逆'], ['external', '已经发出去']].map(f => '<button class="chip ' + (filter === f[0] ? 'on' : '') + '" data-act="effect-filter" data-filter="' + f[0] + '">' + f[1] + '</button>').join('') + '</div>' +
    '<div class="effect-list">' + (list.length ? list.map(effectCard).join('') : '<div class="empty">这个筛选下没有。</div>') + '</div>' +
  '</section>';
}

function actorName(actor){
  const m = String(actor || '').match(/^agent:(.+)$/);
  if (m) return AGENTS[m[1]] ? AGENTS[m[1]].name : (m[1] === '七七' ? '七七' : m[1]);
  if (actor === 'system:decision_gate' || actor === 'system:evidence_gate') return '规则';
  if (actor === 'scheduler') return '定时器';
  return actor === '啸春' ? '你' : String(actor || '系统');
}

function eventResult(e){
  if (e.type === 'node.failed') return ['没通过', 'bad'];
  if (e.type === 'decision.created') return ['等你决定', 'wait'];
  if (e.type === 'effect.recorded') return ['等你接手', 'wait'];
  if (e.type === 'task.updated') return ['已更新', 'ok'];
  if (e.type.indexOf('paused') >= 0 || e.type.indexOf('blocked') >= 0) return ['停住了', 'wait'];
  if (e.type.indexOf('unverified') >= 0) return ['等系统确认', 'wait'];
  return ['完成', 'ok'];
}

function eventObject(e){
  const p = e.payload || {};
  if(e.taskId){ const t = taskById(e.taskId); if(t) return t.title; }
  if(p.workflow && WORKFLOWS[p.workflow]) return WORKFLOWS[p.workflow].name;
  if(p.decision_id){ const d = DECISIONS.find(x => x.id === p.decision_id); if(d) return d.title; }
  if(p.effect_id){ const ef = EFFECTS.find(x => x.id === p.effect_id); if(ef) return ef.title; }
  return '系统';
}

function renderEvents(){
  const filter = state.eventType || 'all';
  const list = EVENTS.filter(e => filter === 'all' ? true : filter === 'side_effect' ? e.type.indexOf('effect') >= 0 : e.type.indexOf(filter) >= 0);
  return '<section class="page">' +
    pageHead('记录 · ' + EVENTS.length + ' 条', '记录',
      '按时间倒序；点一行看完整载荷、前序指纹与链上位置。',
      '<button class="btn" data-act="verify-chain">核对记录</button><button class="btn" data-act="export-events">导出</button>') +
    '<div class="hash-banner"><div><b>记录是连着的</b> · 最近核对 ' + nowLabel + '，' + EVENTS.length + ' 条没有断点。</div><div class="right">最新指纹 ' + esc(EVENTS[0].hash.slice(0, 10)) + '…</div></div>' +
    '<div class="chips">' + [['all', '全部'], ['task', '任务'], ['run', '运行'], ['decision', '决定'], ['side_effect', '操作'], ['agent', '子代理']].map(f => '<button class="chip ' + (filter === f[0] ? 'on' : '') + '" data-act="event-filter" data-filter="' + f[0] + '">' + f[1] + '</button>').join('') + '</div>' +
    '<div class="table-wrap"><table class="tbl event-table"><thead><tr><th style="width:88px">时间</th><th>发生了什么</th><th style="width:150px">对象</th><th style="width:112px">谁做的</th><th style="width:86px">结果</th></tr></thead><tbody>' +
      list.map(e => { const r = eventResult(e); return '<tr data-act="open-event" data-event="' + e.seq + '"><td class="mono">' + esc(e.time) + '</td><td>' + esc(tidy(e.summary)) + '</td><td>' + esc(tidy(eventObject(e))) + '</td><td>' + esc(actorName(e.actor)) + '</td><td><span class="estate ' + r[1] + '">' + r[0] + '</span></td></tr>'; }).join('') +
    '</tbody></table></div><p class="path-note">点一行看完整记录，包括指纹和当时带的数据。</p>' +
  '</section>';
}

/* ============================================================
   Part D1 · 抽屉
   ============================================================ */
const stepMark = st => st === 'done' ? 'ok' : st === 'run' ? 'run' : st === 'fail' || st === 'blocked' ? 'fail' : st === 'done_unverified' ? 'run' : 'wait';
const stepGlyph = st => st === 'done' ? icon('check') : st === 'run' ? icon('play') : st === 'fail' || st === 'blocked' ? icon('close') : st === 'done_unverified' ? icon('alert') : '·';

function drawerShell(o){
  const tabs = o.tabs && o.tabs.length ? '<div class="drawer-tabs">' + o.tabs.map(t => '<button class="drawer-tab ' + (o.tab === t[0] ? 'on' : '') + '" data-act="drawer-tab" data-tab="' + t[0] + '">' + t[1] + (t[2] != null ? '<span class="n">' + t[2] + '</span>' : '') + '</button>').join('') + '</div>' : '';
  return '<div class="overlay" data-act="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="' + esc(o.title) + '"><div class="drawer-head"><button class="drawer-close" data-act="close-drawer" aria-label="关闭">' + icon('close') + '</button><div class="drawer-kicker">' + o.kicker + '</div><h2 class="drawer-title">' + o.title + '</h2><div class="drawer-sub">' + o.sub + '</div></div>' + tabs + '<div class="drawer-body">' + o.body + '</div>' + (o.foot ? '<div class="modal-foot" style="flex:none;border-top:1px solid var(--line);background:#fff">' + o.foot + '</div>' : '') + '</aside>';
}

function runHistoryRows(runs, current){
  return '<div class="run-history">' + runs.map(r => '<div class="run-history-row ' + (current === r.id ? 'sel' : '') + '" data-act="open-run" data-run="' + r.id + '"><span class="t">' + esc(r.time) + '</span><span class="dot" style="width:4px;height:4px;background:' + (r.status === 'failed' ? '#c0393f' : r.status === 'running' ? '#4b73ef' : r.status === 'blocked' ? '#d29a38' : '#249b72') + '"></span><span class="id">' + esc(r.trigger || '运行') + '</span><span>' + STATUS[r.status].label + '</span><span class="dur">' + esc(r.duration || '—') + '</span>' + icon('chevron-right') + '</div>').join('') + '</div>';
}

function taskOverview(t){
  const runs = taskRuns(t);
  const latest = runs[0] || null;
  const wf = wfOfTask(t);
  let html = '<div class="section"><div class="section-h"><h3>目标与验收</h3></div><div class="card-box"><div style="font-size:10.4px;line-height:1.65;color:var(--ink2)">' + esc(tidy(t.desc)) + '</div><div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><div class="dec-label">验收条件</div><div style="font-size:9.6px;color:var(--ink2);line-height:1.55">' + esc(tidy(t.acceptance)) + '</div></div></div></div>';
  if(t.type === 'scheduled'){
    html += '<div class="section"><div class="section-h"><h3>排期与历史运行</h3><div class="right"><span class="tag gray" style="height:17px;font-size:7.6px">一条任务 · 多次运行</span></div></div>' +
      '<div class="card-box tint" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px"><div><div class="policy-k">排期</div><div class="policy-v">' + esc(t.schedule) + '</div></div><div><div class="policy-k">下一次</div><div class="policy-v">' + esc(t.next) + '</div><div class="policy-k" style="margin-top:3px">' + (t.status === 'paused' ? '已暂停，不产生新的唤醒任务' : '到点唤醒入队，不新增任务卡片') + '</div></div></div>' +
      '<div class="dec-label" style="margin-bottom:5px">最近 ' + runs.length + ' 次运行 <span style="color:var(--ink3)">· 点击进入运行详情</span></div>' + runHistoryRows(runs, '') + '</div>';
  }
  if(latest){
    html += '<div class="section"><div class="section-h"><h3>最近一次运行</h3><div class="right"><button class="btn ghost sm" data-act="open-run" data-run="' + latest.id + '">完整运行' + icon('arrow-right') + '</button></div></div>' +
      '<div class="run-hero"><div><div class="big" style="font-size:17px">' + esc(latest.summary) + '</div><div class="meta">' + esc(latest.time) + ' · ' + esc(latest.trigger) + '</div></div><div class="right">' + statusTag(latest.status) + '<div style="margin-top:4px">' + esc(latest.duration) + '</div></div></div></div>';
  }
  if(t.attention > 0){
    html += '<div class="section"><div class="callout danger">' + icon('alert') + '<div><b>这个任务有 ' + t.attention + ' 项需要人介入。</b>任务不会自动变成「完成」；相关证据和可选项都在「等你决定」里。 <button class="link-btn" data-act="go-inbox">去收件箱</button></div></div></div>';
  }
  html += '<div class="section"><div class="section-h"><h3>编排与资源</h3></div><div class="card-box" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><div><div class="policy-k">工作流</div><div class="policy-v">' + (wf ? esc(tidy(wf.name)) : '人工执行') + '<div class="policy-k" style="margin-top:3px">' + (wf ? esc(wf.version) : '无') + '</div></div></div><div><div class="policy-k">负责人</div><div class="policy-v">' + esc(t.owner) + '</div></div><div><div class="policy-k">优先级</div><div class="policy-v">' + esc(t.priority) + '</div></div></div></div>';
  return html;
}

function taskOrchestration(t){
  const wf = wfOfTask(t);
  const agents = [AGENTS.orchestrator, AGENTS.scout, AGENTS.drafter, AGENTS.auditor, AGENTS.verifier].filter(Boolean);
  return '<div class="section"><div class="section-h"><h3>Superagent 指挥链</h3><div class="right"><span class="tag violet" style="height:17px;font-size:7.6px">总控只收尾，不代做</span></div></div>' +
    '<div class="orchestration-tree"><div class="ot-root"><div class="ot-ico">' + icon('cpu') + '</div><div style="flex:1"><div class="ot-name">七七 · Superagent 总控</div><div class="ot-role">拆解目标 · 派发边界 · 守住最后一道复核</div></div><div class="mono" style="font-size:8px;color:var(--ink3)">' + (wf ? esc(wf.version) : 'manual') + '</div></div>' +
      '<div class="ot-branch">' + agents.filter(a => a.id !== 'orchestrator').map(a => '<div class="ot-child" data-act="open-agent" data-agent="' + a.id + '" style="cursor:pointer"><span class="dot" style="background:' + (a.status === 'running' ? '#4b73ef' : a.status === 'done' ? '#249b72' : a.status === 'waiting' ? '#d29a38' : '#aab2bf') + '"></span><b style="font-weight:600">' + esc(a.name) + '</b><span style="color:var(--ink3)">' + esc(a.task) + '</span><span class="right">' + esc(a.progress) + '%</span></div>').join('') + '</div></div></div>' +
    '<div class="section"><div class="section-h"><h3>共享任务板</h3><div class="right"><span class="muted" style="font-size:8.2px">子代理只领板上的活</span></div></div><div class="card-box" style="padding:4px 12px">' +
      SHARED_BOARD.map(b => '<div style="display:flex;align-items:center;gap:7px;padding:7px 0;border-top:1px solid var(--line);font-size:9.2px"><span style="flex:1">' + esc(b.title) + '</span><span class="muted">' + esc(b.agent) + '</span>' + statusTag(b.status === 'running' ? 'running' : b.status === 'done' ? 'done' : b.status === 'waiting' ? 'blocked' : 'queued') + '</div>').join('') +
    '</div><div class="canvas-hint">' + icon('branch') + '总控可以并行派发，但收尾只能发生一次；子代理之间的结论冲突会回到收件箱，而不是互相覆盖。</div></div>';
}

function taskEvents(t){
  const list = EVENTS.filter(e => e.taskId === t.id);
  return '<div class="section"><div class="section-h"><h3>相关事件</h3><div class="right">' + list.length + ' 条</div></div>' + (list.length ? '<div class="card-box" style="padding:4px 12px">' + list.map(e => '<div data-act="open-event" data-event="' + e.seq + '" style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer"><span style="flex:1"><div style="font-size:9.2px;color:var(--ink2)">' + esc(tidy(e.summary)) + '</div><div style="font-size:7.7px;color:var(--ink3);margin-top:2px">' + eventTypeWord(e.type) + ' · ' + esc(e.time) + '</div></span>' + icon('chevron-right') + '</div>').join('') + '</div>' : '<div class="empty">还没有关联事件。</div>') + '</div>';
}

function drawerTask(){
  const t = taskById(state.drawer.id);
  if(!t) return '';
  const ui = state.drawer.tab || 'overview';
  const runs = taskRuns(t);
  const body = ui === 'runs' ? '<div class="section"><div class="section-h"><h3>全部运行</h3><div class="right">同一任务 · ' + runs.length + ' 次</div></div>' + (runs.length ? runHistoryRows(runs, '') : '<div class="empty">这个任务还没有运行记录。</div>') + '<div class="canvas-hint">' + icon('history') + '定时任务不会因为每次唤醒就多出一张任务卡；历史都收在这一条任务下面。</div></div>'
    : ui === 'orchestration' ? taskOrchestration(t)
    : ui === 'events' ? taskEvents(t)
    : taskOverview(t);
  return drawerShell({
    kicker: '任务', title: esc(tidy(t.title)),
    sub: statusTag(t.status) + typeTag(t.type) + priTag(t.priority) + '<span>· ' + esc(t.owner) + '</span>' + '',
    tabs: [['overview','概览'],['runs','运行','' + runs.length],['orchestration','编排'],['events','事件','' + EVENTS.filter(e => e.taskId === t.id).length]],
    tab: ui, body,
    foot: '<span class="muted" style="font-size:8.4px">任务做到哪一步，由运行和你的决定共同决定</span><span class="right"><button class="btn ghost sm" data-act="close-drawer">关闭</button><button class="btn primary sm" data-act="task-action" data-task="' + t.id + '">' + (t.attention ? '处理待办' : '继续推进') + '</button></span>'
  });
}

function drawerRun(){
  const run = RUNS[state.drawer.id];
  if(!run) return '';
  const task = taskById(run.taskId);
  const wf = task ? wfOfTask(task) : (run.wfId ? WORKFLOWS[run.wfId] : null);
  const testOnly = !!run.test;
  const labels = task && task.chain && task.chain.length ? task.chain.map(c => c.label) : (wf ? wf.nodes.filter(n => n.type !== 'trigger').map(n => n.title) : []);
  const states = run.stepStates || [];
  const steps = labels.map((label, i) => ({ label, state: states[i] || 'wait', dur: i < states.length ? (task && task.chain && task.chain[i] ? task.chain[i].dur : '—') : '—' }));
  const effects = EFFECTS.filter(e => e.runId === run.id);
  const decisions = DECISIONS.filter(d => d.runId === run.id);
  return drawerShell({
    kicker: testOnly ? '这次试运行' : '这次运行', title: esc(tidy(run.summary)),
    sub: statusTag(run.status) + '<span>' + esc(run.time) + '</span><span class="mono">' + esc(run.duration) + '</span><span>· ' + esc(run.trigger) + '</span>',
    tabs: [['steps','节点步骤'],['orchestration','分工'],['evidence','证据与系统确认']], tab: state.drawer.tab || 'steps',
    body: (state.drawer.tab || 'steps') === 'orchestration' ? taskOrchestration(task || {}) :
      (state.drawer.tab === 'evidence' ? '<div class="section"><div class="section-h"><h3>本运行的证据</h3></div><div class="evidence-item">' + icon('shield') + '<div><div class="en">运行摘要与系统确认</div><div class="ed">' + esc(tidy(run.summary)) + '。</div></div></div>' +
        (effects.length ? effects.map(e => '<div class="evidence-item" data-act="open-effect" data-eff="' + e.id + '" style="cursor:pointer">' + icon('effect') + '<div><div class="en">' + esc(tidy(e.title)) + '</div><div class="ed">' + esc(tidy(e.verified)) + ' · ' + (e.status === 'signed' ? '已签字接手' : '等你接手') + '</div></div></div>').join('') : '<div class="callout info" style="margin-top:8px">' + icon('info') + '<div>这次运行没有留下需要接手的操作。</div></div>') +
        '<div class="canvas-hint">证据缺失时，运行只能停在「做完，等系统确认」，不能改成成功。</div></div>'
      : '<div class="section"><div class="run-hero"><div><div class="big">' + esc(run.duration) + '</div><div class="meta">' + esc(run.time) + ' · ' + esc(run.trigger) + '</div></div><div class="right">' + statusTag(run.status) + '<div style="margin-top:4px">' + (wf ? esc(tidy(wf.name)) + ' ' + esc(wf.version) : '人工执行') + (testOnly ? ' · 只读演练' : '') + '</div></div></div></div>' +
        '<div class="section"><div class="section-h"><h3>节点步骤</h3><div class="right">' + steps.length + ' 个</div></div><div class="run-steps">' + steps.map(s => '<div class="run-step"><span class="step-mark ' + stepMark(s.state) + '">' + stepGlyph(s.state) + '</span><div><div class="st">' + esc(s.label) + '</div><div class="sd">' + (s.state === 'done' ? '已完成，产物已落盘' : s.state === 'run' ? '执行中，尚未产出终态' : s.state === 'fail' ? '失败，已回滚或停在安全态' : s.state === 'blocked' ? '停下来，等你决定' : s.state === 'done_unverified' ? '做完了，还有操作没拿到系统确认' : '等待上游') + '</div></div><span class="sdur">' + esc(s.dur) + '</span></div>').join('') + '</div></div>' +
        (decisions.length ? '<div class="section"><div class="callout danger">' + icon('alert') + '<div><b>这次运行留下 ' + decisions.length + ' 件需要你定的事。</b>运行不会自己继续，先处理这些事。 <button class="link-btn" data-act="open-decision" data-dec="' + decisions[0].id + '">去处理</button></div></div></div>' : '') +
        '<div class="section"><div class="section-h"><h3>同任务其它运行</h3></div>' + (task ? runHistoryRows(taskRuns(task), run.id) : '') + '</div>'),
    foot: '<span class="muted" style="font-size:8.4px">运行记录不可改写</span><span class="right"><button class="btn ghost sm" data-act="close-drawer">关闭</button>' + (task ? '<button class="btn sm" data-act="open-task" data-task="' + task.id + '">回到任务</button>' : '') + '</span>'
  });
}

function drawerAgent(){
  const a = AGENTS[state.drawer.id];
  if(!a) return '';
  return drawerShell({
    kicker: '子代理', title: esc(a.name),
    sub: '<span class="tag violet" style="height:18px;font-size:7.8px">' + esc(a.role) + '</span>' + statusTag(a.status === 'running' ? 'running' : a.status === 'done' ? 'done' : a.status === 'waiting' ? 'blocked' : 'queued') + '<span>当前任务：' + esc(a.task) + '</span>',
    tabs: [['mission','使命与边界'],['log','执行日志'],['io','输入输出']], tab: state.drawer.tab || 'mission',
    body: (state.drawer.tab || 'mission') === 'log' ? '<div class="section"><div class="section-h"><h3>执行日志</h3></div><div class="card-box">' + a.log.map(l => '<div style="display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:9.4px"><span class="mono" style="font-size:8px;color:var(--ink3);width:34px;flex:none">' + esc(l[0]) + '</span><span style="color:' + (l[2] ? '#2f62f0' : 'var(--ink2)') + '">' + esc(l[1]) + '</span></div>').join('') + '</div></div>'
      : state.drawer.tab === 'io' ? '<div class="section"><div class="section-h"><h3>工具</h3></div><div class="cards" style="display:flex;gap:5px;flex-wrap:wrap">' + a.tools.map(t => '<span class="tag gray mono" style="height:20px;font-size:8px">' + esc(t) + '</span>').join('') + '</div></div><div class="section"><div class="section-h"><h3>产出</h3></div><div class="card-box">' + a.outputs.map(o => '<div style="display:flex;gap:6px;padding:5px 0;font-size:9.4px">' + icon('check') + '<span>' + esc(o) + '</span></div>').join('') + '</div></div>'
      : '<div class="section"><div class="section-h"><h3>使命</h3></div><div class="card-box"><div style="font-size:10.4px;line-height:1.65;color:var(--ink2)">' + esc(a.mission) + '</div></div></div><div class="section"><div class="section-h"><h3>边界</h3></div><div class="card-box tint" style="display:flex;gap:6px;flex-wrap:wrap">' + a.scope.map(s => '<span class="tag gray" style="height:19px;font-size:8px">' + esc(s) + '</span>').join('') + '</div><div class="callout warn" style="margin-top:8px">' + icon('alert') + '<div>子代理只能在边界内动手；要越界必须先回到总控，交给总控，再由总控放到你面前决定。</div></div></div>',
    foot: '<span class="muted" style="font-size:8.4px">子代理不能修改总控结论</span><span class="right"><button class="btn ghost sm" data-act="close-drawer">关闭</button><button class="btn sm" data-act="agent-ping" data-agent="' + a.id + '">发消息</button></span>'
  });
}

function drawerNode(){
  const wf = wfById(state.drawer.wf) || WORKFLOWS.wf_design;
  const n = wf.nodes.find(x => x.id === state.drawer.id);
  if(!n) return '';
  const ins = wf.edges.filter(e => e[1] === n.id).map(e => wf.nodes.find(x => x.id === e[0])).filter(Boolean);
  const outs = wf.edges.filter(e => e[0] === n.id).map(e => wf.nodes.find(x => x.id === e[1])).filter(Boolean);
  return drawerShell({
    kicker: '流程步骤', title: esc(tidy(n.title)),
    sub: '<span class="tag violet" style="height:18px;font-size:7.8px">' + esc((WF_KIND[wfKind(n)] || {}).label || '步骤') + '</span>' + statusTag(n.status === 'done' ? 'done' : n.status === 'run' ? 'running' : n.status === 'blocked' ? 'blocked' : 'queued'),
    body: '<div class="section"><div class="callout info">' + icon('info') + '<div>' + esc(n.sub) + '。这一步做什么、交什么，跟着流程版本一起固定；要改，得开一个新版本。</div></div></div>' +
      '<div class="section"><div class="section-h"><h3>上一步 → 这一步</h3></div><div class="card-box" style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div><div class="dec-label">从哪来（' + ins.length + '）</div>' + (ins.length ? ins.map(x => '<div style="font-size:9.2px;padding:4px 0">' + icon('arrow-right') + ' ' + esc(x.title) + '<span class="mono" style="font-size:7.8px;color:var(--ink3)"> ' + esc(x.code) + '</span></div>').join('') : '<div class="muted" style="font-size:8.8px">这是第一步</div>') + '</div><div><div class="dec-label">接下来去哪（' + outs.length + '）</div>' + (outs.length ? outs.map(x => '<div style="font-size:9.2px;padding:4px 0">' + icon('arrow-right') + ' ' + esc(x.title) + '<span class="mono" style="font-size:7.8px;color:var(--ink3)"> ' + esc(x.code) + '</span></div>').join('') : '<div class="muted" style="font-size:8.8px">这是最后一步</div>') + '</div></div></div>' +
      '<div class="section"><div class="section-h"><h3>什么时候会停</h3></div><div class="card-box"><div style="font-size:9.6px;color:var(--ink2);line-height:1.6">' + (n.type === 'approval' ? '没有你的决定，不会继续；超时就按记录里的规则处理。' : n.type === 'policy' ? '没有证据不会放行；出现冲突就停下来，交给你决定。' : n.type === 'parallel' ? '把同一批任务分给几条支线，各自交结果；任何一条失败，整批停住等你决定。' : n.type === 'branch' ? '按上一步的结果选一条路走；条件不明确就停住问你。' : n.type === 'subworkflow' ? '子流程按固定版本跑；它的结果只作为这一步的产出。' : n.type === 'wait' ? '等到约定的时间或事件再继续；等不到就停下来。' : n.type === 'trigger' ? '流程从这里开始；同一份输入只进来一次。' : n.type === 'agent' ? '只能在约定范围内动手；失败回到我这里，最多自己重试两次。' : n.type === 'tool' ? '每次调用都带防重复标记；没拿到系统确认就记「做完，等系统确认」，不记成功。' : '按上一步的输入执行；超时或输入缺失就停住等待。') + '</div></div></div>' +
      '<div class="section"><div class="section-h"><h3>最近证据</h3></div><div class="evidence-item">' + icon('shield') + '<div><div class="en">审计台账里的这次判定</div><div class="ed">第三段 v23 通过：没有致命问题、没有重大问题，只剩 3 条措辞。</div></div></div><div class="evidence-item">' + icon('doc') + '<div><div class="en">设计稿 ' + esc(wf.version) + '</div><div class="ed">SHA256 9979F18C… · 1185 行 · 2026-11-11。</div></div></div></div>',
    foot: '<span class="muted" style="font-size:8.4px">这一步只读</span><span class="right"><button class="btn ghost sm" data-act="close-drawer">关闭</button><button class="btn sm" data-act="open-wf" data-wf="' + wf.id + '">回到工作流</button></span>'
  });
}

function decisionKind(kind){
  return kind === 'spec_conflict' ? '规则冲突'
    : kind === 'accept_unverified_effect' ? '没拿到系统确认的操作'
    : kind === 'schedule_failure' ? '定时任务连续失败'
    : '需要你判断';
}

function effectLevel(level){
  return level === 'irreversible' ? ['red','不可逆']
    : level === 'external' ? ['amber','已发出去']
    : ['blue','可以回退'];
}

function eventTypeWord(type){
  return type === 'node.started' ? '开始一步'
    : type === 'node.succeeded' ? '一步完成'
    : type === 'node.failed' ? '一步没通过'
    : type === 'node.blocked' ? '停下来等决定'
    : type === 'node.succeeded_with_unverified' ? '做完，等系统确认'
    : type === 'effect.recorded' ? '记下一笔操作'
    : type === 'decision.created' ? '生成一项决定'
    : type === 'decision.resolved' ? '处理了一项决定'
    : type === 'run.started' ? '开始一次运行'
    : type === 'run.paused_bridge_missing' ? '运行暂停'
    : type === 'task.updated' ? '任务有更新'
    : '记了一笔';
}

function eventExplain(type){
  return type === 'node.started' ? '总控把这一步派给了子代理，子代理开始执行。'
    : type === 'node.succeeded' ? '这一步做完了，产物已经落盘，下一步可以开始。'
    : type === 'node.failed' ? '这一步没有通过，运行停在安全位置，不会带着问题往下走。'
    : type === 'node.blocked' ? '这一步需要一个人来判断，运行会一直停在这里，直到你在「等你决定」里处理。'
    : type === 'node.succeeded_with_unverified' ? '这一步做完了，但有一笔操作没有拿到系统确认，所以只能记「做完，等系统确认」。'
    : type === 'effect.recorded' ? '系统记下了一笔已经发生、但还没有系统确认的操作，之后需要人核对或签字接手。'
    : type === 'decision.created' ? '系统把一件需要人承担后果的事放到了你面前，选项和证据都已经备好。'
    : type === 'decision.resolved' ? '你（或获授权的人）已经做出选择，后续会按这个选择继续。'
    : type === 'run.started' ? '一次新的运行开始了，它会按流程一步一步往下走。'
    : type === 'run.paused_bridge_missing' ? '运行中途发现连接断了，自己停了下来，等恢复后再继续。'
    : '任务的某一部分有了新状态，记录在这里备查。';
}

function drawerDecision(){
  const d = DECISIONS.find(x => x.id === state.drawer.id);
  if(!d) return '';
  const resolved = d.status === 'resolved' || !!state.reviewChoices[d.id];
  const chosen = state.reviewChoices[d.id];
  return drawerShell({
    kicker: '需要你决定', title: esc(tidy(d.title)),
    sub: priTag(d.priority) + '<span class="tag amber" style="height:18px;font-size:7.6px">' + decisionKind(d.kind) + '</span>' + statusTag(resolved ? 'done' : 'blocked'),
    body: '<div class="section"><div class="section-h"><h3>为什么需要你</h3></div><div class="card-box"><div style="font-size:10.2px;line-height:1.65;color:var(--ink2)">' + esc(tidy(d.why)) + '</div></div></div>' +
      '<div class="section"><div class="section-h"><h3>你可以怎么选</h3></div><div class="card-box" style="padding:4px 12px">' + d.allowed.map(a => '<div style="padding:9px 0;border-top:1px solid var(--line)' + (chosen === a ? ';background:#faf6ee' : '') + '"><div style="display:flex;align-items:center;gap:6px"><b style="font-size:9.8px">' + esc(tidy(d.allowedLabels[a] || a)) + '</b>' + (chosen === a ? '<span class="tag green" style="height:16px;font-size:7.4px">你选的</span>' : '') + '</div><div style="font-size:8.8px;color:var(--ink3);margin-top:2px">' + esc(tidy(d.allowedDesc[a] || '')) + '</div></div>').join('') + '</div></div>' +
      '<div class="section"><div class="section-h"><h3>做决定前可以看</h3></div>' + d.evidence.map(e => '<div class="evidence-item">' + icon('link') + '<div><div class="en">' + esc(d.evidenceLabel[e] || e) + '</div><div class="ed">决定做出后，旧证据不改，只追加一条新记录。</div></div></div>').join('') + '</div>' +
      '<div class="section"><div class="callout ' + (d.priority === 'P0' ? 'danger' : 'warn') + '">' + icon('clock') + '<div><b>' + esc(d.expiryLabel) + '。</b>超时前没处理，就按这个规则走；不会悄悄替你点通过。</div></div></div>',
    foot: '<span class="muted" style="font-size:8.4px">' + (resolved ? '已提交决定，等系统确认' : '还没处理') + '</span><span class="right"><button class="btn ghost sm" data-act="close-drawer">关闭</button><button class="btn primary sm" data-act="resolve-decision" data-dec="' + d.id + '">' + (resolved ? '看当时怎么选' : '去选择') + '</button></span>'
  });
}

function drawerEffect(){
  const e = EFFECTS.find(x => x.id === state.drawer.id);
  if(!e) return '';
  const lv = effectLevel(e.level);
  return drawerShell({
    kicker: '没有系统确认的操作', title: esc(tidy(e.title)),
    sub: '<span class="tag ' + lv[0] + '" style="height:18px;font-size:7.8px">' + lv[1] + '</span>' + statusTag(e.status === 'signed' ? 'done' : 'done_unverified') + '<span>发现于 ' + esc(e.age) + '</span>',

  const title0 = node ? node.title : '';

function wfApiDefinition(wf){

    command: 'workflow.update',

    trigger: { kind: wf.trigger, detail: wf.triggerDetail || wf.triggerLabel },

    }),
    edges: wf.edges.map(e => ({ from: e[0], to: e[1] }))
  };
}

function wfTidy(wf){
  if(!wf.nodes.length) return;
  if(!wf.edges.length){
    wf.nodes.forEach((n, i) => { n.x = 24 + (i % 3) * 196; n.y = 40 + Math.floor(i / 3) * 132; });
  } else {
    const level = {}; wf.nodes.forEach(n => { level[n.id] = 0; });
    for(let k = 0; k < wf.nodes.length + 2; k++){
      let changed = false;
      wf.edges.forEach(e => {
        if(level[e[0]] != null && level[e[1]] != null && level[e[1]] < level[e[0]] + 1){ level[e[1]] = level[e[0]] + 1; changed = true; }
      });
      if(!changed) break;
    }
    const groups = {};
    wf.nodes.forEach(n => { const lv = level[n.id] || 0; (groups[lv] = groups[lv] || []).push(n); });
    Object.keys(groups).map(Number).sort((a, b) => a - b).forEach(lv => {
      groups[lv].sort((a, b) => a.y - b.y || a.x - b.x).forEach((n, i) => {
        n.x = 24 + lv * 196; n.y = 40 + i * 132;
      });
    });
  }
  wfTouch(wf, '整理了一下画布布局');
}

function randHex(n){
  let s = '';
  const chars = '0123456789abcdef';
  for(let i = 0; i < n; i++) s += chars[Math.floor(Math.random() * 16)];
  return s;
}

function addEvent(type, actor, summary, payload, taskId){
  const maxSeq = EVENTS.reduce((m, e) => Math.max(m, e.seq), 18422);
  const prev = EVENTS.length ? EVENTS[0].hash : '0'.repeat(64);
  const ev = { seq: maxSeq + 1, time: nowLabel, type: type, taskId: taskId || null, actor: actor, summary: summary, payload: payload || {}, prev: prev, hash: randHex(64) };
  EVENTS.unshift(ev);
  return ev;
}

function toast(msg, warn){
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.innerHTML = icon(warn ? 'alert' : 'check') + '<div>' + msg + '</div>';
  while(root.children.length >= 2) root.firstElementChild.remove();
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(4px)'; el.style.transition = '.18s'; setTimeout(() => el.remove(), 200); }, 2800);
}

function submitTask(){

  const val = id => (($('#' + id) || {}).value || '').trim();
  let schedule = null, next = null, trigger = null, owner = '七七';
  const extra = {};
  if(type === 'scheduled'){
    schedule = val('ntSchedule') || '每天 09:00';
    extra.tz = val('ntTz') || 'Asia/Shanghai';
    extra.missPolicy = val('ntMiss') || '补跑一次';
    next = schedule;
  } else if(type === 'event'){
    trigger = val('ntEvent') || '等待事件';
    extra.eventSource = val('ntSource') || '系统确认';
    extra.eventFilter = val('ntFilter') || '全部';
    extra.idemKey = val('ntIdem') || '按事件编号去重';
    next = '等「' + trigger + '」';
  } else if(type === 'continuous'){
    extra.stopCondition = val('ntStop') || '达到目标后停';
    extra.maxRounds = Number(val('ntRounds') || 8);
    next = '最多再跑 ' + extra.maxRounds + ' 轮';
  } else {
    owner = val('ntOwner') || '啸春';
    extra.how = val('ntHow') || '按任务说明人工处理。';
    next = owner === '啸春' ? '等你来做' : '等' + owner + '来做';
  }
  const id = 'tsk_' + randHex(4);
  TASKS.unshift(Object.assign({ id: id, type: type, title: title.trim(), workflowId: wf, status: type === 'scheduled' ? 'scheduled' : 'queued', column: 'scheduled', priority: pri, owner: owner, schedule: schedule, next: next, latestRun: null, runCount: 0, attention: 0, progress: null, due: null, createdAt: '2026-11-11', desc: type === 'manual' ? extra.how : '新建任务，等待补充验收条件。', acceptance: '待补充。', tags: [TYPE[type].label, '新建'], trigger: trigger, chain: [] }, extra));
  addEvent('task.created', '啸春', '新建任务 ' + id + '：' + title.trim(), { task: id, type: type, workflow: wf }, id);

function submitStep(wfId){
  const wf = WORKFLOWS[wfId]; if(!wf) return;
  const title = ($('#nsTitle') || {}).value || '';
  if(!title.trim()){ toast('先给这一步起个名字。', true); return; }
  const kind = ($('#nsKind') || {}).value || 'agent';
  const actor = ($('#nsActor') || {}).value || '主控';
  const process = ($('#nsProcess') || {}).value || '按流程约定执行这一步。';
  const input = ($('#nsInput') || {}).value || '上一步产出';
  const output = ($('#nsOutput') || {}).value || '下一步输入';
  const done = ($('#nsDone') || {}).value || '留下可核对的结果';
  if(state.wfEditNode){
    const node = wfNodeById(wf, state.wfEditNode);
    if(node){
      node.title = title.trim(); node.type = kind; node.actor = actor;
      node.sub = actor + ' · ' + process;
      node.contract = { process: process, input: input, output: output, done: done };
      wfTouch(wf, '改了这一步：' + node.title);
      addEvent('workflow.step_updated', '啸春', '改了 ' + wf.name + ' 的一步：' + node.title, { workflow: wf.id, node: node.id });
      state.wfNode = node.id; state.wfEdge = null;
    }
    state.wfEditNode = null; state.wfPendingPos = null; state.wfPendingType = null; state.wfPendingLink = null;
    closeModal(); render(); toast('这一步已保存；位置和连线没有动。'); return;
  }
  const pos = state.wfPendingPos || wfAutoPos(wf);
  const codeMap = { trigger: 'START', agent: 'AGENT', tool: 'TOOL', subworkflow: 'SUB', approval: 'APPROVAL', parallel: 'PARALLEL', policy: 'POLICY', branch: 'BRANCH', wait: 'WAIT' };
  const node = { id: 'n_' + randHex(4), title: title.trim(), type: kind, code: (codeMap[kind] || 'STEP') + '_' + String(wf.nodes.length + 1).padStart(2, '0'), x: Math.round(pos.x), y: Math.round(pos.y), sub: actor + ' · ' + process, status: 'wait', actor: actor, contract: { process: process, input: input, output: output, done: done } };
  wf.nodes.push(node);
  if(state.wfPendingLink && wfNodeById(wf, state.wfPendingLink) && !wf.edges.some(e => e[0] === state.wfPendingLink && e[1] === node.id)){
    wf.edges.push([state.wfPendingLink, node.id]);
  }
  wfTouch(wf, '加了一步：' + node.title);
  addEvent('workflow.step_added', '啸春', '给 ' + wf.name + ' 加了一步：' + node.title, { workflow: wf.id, node: node.id });
  state.wfNode = node.id; state.wfEdge = null;
  state.wfEditNode = null; state.wfPendingPos = null; state.wfPendingType = null; state.wfPendingLink = null;
  closeModal(); render(); toast('已加进流程。要调先后顺序，从右侧圆点拖一条线。');
}

document.addEventListener('click', function(ev){
  const back = ev.target.closest('.modal-back');
  if(back && ev.target === back){ closeModal(); return; }
  if(back && ev.target.closest('[data-act]') === back) return;
  if(ev.target.closest('[data-stop]') && !ev.target.closest('[data-act]')) return;
  if(!ev.target.closest('.searchbox')){ const sp = $('#searchPop'); if(sp) sp.hidden = true; }

  const nav = ev.target.closest('[data-screen]');
  if(nav){ state.screen = nav.dataset.screen; closeDrawer(); render(); return; }

  const actEl = ev.target.closest('[data-act]');
  if(actEl){
    const act = actEl.dataset.act;
    const sp = $('#searchPop'); if(sp) sp.hidden = true;
    if(act === 'modal-back' || act === 'close-modal'){ closeModal(); return; }
    if(act === 'close-drawer'){ state.drawer = null; renderDrawer(); return; }
    if(act === 'task-view'){ state.taskView = actEl.dataset.view; render(); return; }
    if(act === 'task-filter'){ state.taskFilter = actEl.dataset.filter; render(); return; }
    if(act === 'toggle-history'){ ev.stopPropagation(); state.historyOpen[actEl.dataset.task] = !state.historyOpen[actEl.dataset.task]; render(); return; }
    if(act === 'toggle-expand'){ ev.stopPropagation(); state.expandedTask = state.expandedTask === actEl.dataset.task ? 'none' : actEl.dataset.task; render(); return; }
    if(act === 'open-task'){ const sp = $('#searchPop'); if(sp) sp.hidden = true; openTask(actEl.dataset.task); return; }
    if(act === 'search-filter-tasks'){
      state.screen = 'tasks'; state.taskQuery = state.search || '';
      const sp = $('#searchPop'); if(sp) sp.hidden = true;
      render(); toast('只看任务里含「' + state.taskQuery + '」的条目。');
      return;
    }
    if(act === 'open-task-runs'){ openTask(actEl.dataset.task, 'runs'); return; }

let wfDrag = null;

document.addEventListener('pointerdown', function(ev){
  const nodeEl = ev.target.closest('#wfCanvas .wf-node');
  if(!nodeEl) return;
  const canvas = nodeEl.closest('.wf-canvas');
  const wf = wfById(canvas.dataset.wf);
  if(!wf || wf.status !== 'draft') return;
  const node = wfNodeById(wf, nodeEl.dataset.node);
  if(!node) return;
  const port = ev.target.closest('.wf-port-out');
  if(port){
    ev.preventDefault();
    wfDrag = { mode: 'link', wf: wf, from: node.id, portEl: port, moved: false };
    port.classList.add('active');
    return;
  }
  ev.preventDefault();
  const r = canvas.getBoundingClientRect();
  wfDrag = { mode: 'move', wf: wf, node: node, nodeEl: nodeEl, canvas: canvas, startX: ev.clientX, startY: ev.clientY, origX: node.x, origY: node.y, moved: false };
  nodeEl.classList.add('dragging');
  try { nodeEl.setPointerCapture(ev.pointerId); } catch(e) {}
});

document.addEventListener('pointermove', function(ev){
  if(!wfDrag) return;
  ev.preventDefault();
  if(wfDrag.mode === 'move'){
    const dx = ev.clientX - wfDrag.startX, dy = ev.clientY - wfDrag.startY;
    if(Math.abs(dx) > 2 || Math.abs(dy) > 2) wfDrag.moved = true;
    const n = wfDrag.node;
    n.x = Math.max(8, Math.round(wfDrag.origX + dx));
    n.y = Math.max(8, Math.round(wfDrag.origY + dy));
    wfDrag.nodeEl.style.left = n.x + 'px';
    wfDrag.nodeEl.style.top = n.y + 'px';
    wfSyncEdgeDom(wfDrag.wf);
    state.wfDirty = true;
  } else if(wfDrag.mode === 'link'){
    wfDrag.moved = true;
    wfTempEdgeTo(wfDrag.wf, wfDrag.from, ev.clientX, ev.clientY);
  }
});

document.addEventListener('pointerup', function(ev){
  if(!wfDrag) return;
  const drag = wfDrag; wfDrag = null;
  const temp = document.querySelector('#wfTempEdge'); if(temp) temp.style.display = 'none';
  const port = document.querySelector('.wf-port-out.active'); if(port) port.classList.remove('active');
  if(drag.mode === 'move'){
    drag.nodeEl.classList.remove('dragging');
    if(drag.moved){
      wfTouch(drag.wf, '挪动了这一步的位置');
      addEvent('workflow.node_moved', '啸春', '在 ' + drag.wf.name + ' 里挪动了一步：' + drag.node.title, { workflow: drag.wf.id, node: drag.node.id });
      render();
      toast('位置已改；点「保存改动」后智能体看到的位置也一起更新。');
    }
    return;
  }
  if(drag.mode === 'link'){
    const hit = document.elementFromPoint(ev.clientX, ev.clientY);
    const targetEl = hit && hit.closest('.wf-node');
    if(!targetEl){ if(drag.moved) toast('松手时没有接到步骤上；从右侧圆点再拉一次就行。', true); return; }
    const wf = drag.wf, from = drag.from, to = targetEl.dataset.node;
    if(to === from){ toast('不能把一步接回自己。', true); return; }
    if(wf.edges.some(e => e[0] === from && e[1] === to)){ toast('这两步已经连着，不用重复接。'); return; }
    wf.edges.push([from, to]);
    wfTouch(wf, '加了一条连线');
    addEvent('workflow.edge_added', '啸春', '在 ' + wf.name + ' 里接了一条线', { workflow: wf.id, edge: from + '|' + to });
    state.wfEdge = from + '|' + to; state.wfNode = null;
    render();
    toast('已接上：前一步交出结果，后一步才开始。');
  }
});

document.addEventListener('pointercancel', function(){
  if(!wfDrag) return;
  const drag = wfDrag; wfDrag = null;
  const temp = document.querySelector('#wfTempEdge'); if(temp) temp.style.display = 'none';
  const port = document.querySelector('.wf-port-out.active'); if(port) port.classList.remove('active');
  if(drag.mode === 'move') drag.nodeEl.classList.remove('dragging');
});

document.addEventListener('dblclick', function(ev){
  const canvas = ev.target.closest('#wfCanvas');
  if(!canvas || ev.target.closest('.wf-node') || ev.target.closest('.wf-edge-hit')) return;
  const wf = wfById(canvas.dataset.wf);
  if(!wf || wf.status !== 'draft') return;
  const r = canvas.getBoundingClientRect();
  state.wfPendingPos = { x: Math.max(8, ev.clientX - r.left - WF_NODE_W / 2), y: Math.max(8, ev.clientY - r.top - WF_NODE_H / 2) };
  state.wfPendingType = 'agent'; state.wfPendingLink = null; state.wfEditNode = null;
  state.modal = { kind: 'new-step', id: wf.id };

});

document.addEventListener('dragstart', function(ev){
  const chip = ev.target.closest('.wf-chip');
  if(!chip || !ev.dataTransfer) return;
  ev.dataTransfer.setData('text/plain', chip.dataset.wfKind || 'agent');
  ev.dataTransfer.effectAllowed = 'copy';
  chip.classList.add('dragging');
});

document.addEventListener('dragend', function(ev){
  const chip = ev.target.closest('.wf-chip'); if(chip) chip.classList.remove('dragging');
  document.querySelectorAll('.wf-canvas.drop-ready').forEach(c => c.classList.remove('drop-ready'));
});

document.addEventListener('dragover', function(ev){
  const canvas = ev.target.closest('#wfCanvas');
  if(!canvas) return;
  const wf = wfById(canvas.dataset.wf);
  if(!wf || wf.status !== 'draft') return;
  ev.preventDefault();
  if(ev.dataTransfer) ev.dataTransfer.dropEffect = 'copy';
  canvas.classList.add('drop-ready');
});

document.addEventListener('dragleave', function(ev){
  const canvas = ev.target.closest('#wfCanvas');
  if(canvas && !canvas.contains(ev.relatedTarget)) canvas.classList.remove('drop-ready');
});

document.addEventListener('drop', function(ev){
  const canvas = ev.target.closest('#wfCanvas');
  if(!canvas) return;
  const wf = wfById(canvas.dataset.wf);
  if(!wf || wf.status !== 'draft') return;
  ev.preventDefault();
  canvas.classList.remove('drop-ready');
  const kind = (ev.dataTransfer && ev.dataTransfer.getData('text/plain')) || 'agent';
  const r = canvas.getBoundingClientRect();
  state.wfPendingPos = { x: Math.max(8, ev.clientX - r.left - WF_NODE_W / 2), y: Math.max(8, ev.clientY - r.top - WF_NODE_H / 2) };
  state.wfPendingType = WF_KIND[kind] ? kind : 'agent';
  state.wfPendingLink = null; state.wfEditNode = null;
  state.modal = { kind: 'new-step', id: wf.id };
  openModal(newStepModal(wf));
});

document.addEventListener('keydown', function(ev){

document.addEventListener('fullscreenchange', function(){
  const btn = $('[data-act="toggle-orch-full"]');
  if(btn){ btn.innerHTML = icon(document.fullscreenElement ? 'close' : 'external') + (document.fullscreenElement ? '退出全屏' : '全屏'); }
});

function searchItems(q){
  const s = String(q || '').trim().toLowerCase();
  if(!s) return [];
  const hit = v => String(v || '').toLowerCase().indexOf(s) >= 0;
  const out = [];
  TASKS.forEach(t => { if(hit(t.title) || hit(t.desc) || hit(t.id)) out.push({ type: '任务', title: tidy(t.title), sub: stageOf(t) + ' · ' + resultOf(t), attrs: 'data-act="open-task" data-task="' + t.id + '"' }); });
  Object.keys(WORKFLOWS).forEach(id => { const w = WORKFLOWS[id]; if(hit(w.name) || hit(w.desc)) out.push({ type: '流程', title: w.name, sub: w.version + ' · ' + (w.status === 'draft' ? '草稿' : '已发布') + ' · ' + w.triggerLabel, attrs: 'data-act="open-wf" data-wf="' + id + '"' }); });
  DECISIONS.forEach(d => { if(hit(d.title) || hit(d.why)) out.push({ type: '决定', title: tidy(d.title), sub: d.status === 'resolved' ? '已处理' : '等你决定 · ' + d.priority, attrs: 'data-act="open-decision" data-dec="' + d.id + '"' }); });
  EFFECTS.forEach(e => { if(hit(e.title) || hit(e.why) || hit(e.verified)) out.push({ type: '待核实', title: tidy(e.title), sub: e.status === 'signed' ? '已经接手' : '等你接手', attrs: 'data-act="open-effect" data-eff="' + e.id + '"' }); });
  EVENTS.forEach(e => { if(hit(e.summary) || hit(e.type)) out.push({ type: '记录', title: tidy(e.summary), sub: e.time + ' · ' + actorName(e.actor), attrs: 'data-act="open-event" data-event="' + e.seq + '"' }); });
  return out.slice(0, 8);
}

function updateSearchPop(){
  const pop = $('#searchPop');
  if(!pop) return;
  const q = (($('#globalSearch') || {}).value || '').trim();
  if(!q){ pop.hidden = true; pop.innerHTML = ''; return; }
  const items = searchItems(q);
  const taskHits = items.filter(x => x.type === '任务').length;
  pop.innerHTML = items.length ?
    '<div class="sp-head">搜索结果 <b>' + items.length + '</b><span style="margin-left:auto;text-transform:none;letter-spacing:0">按回车打开第一条</span></div>' +
    items.map(x => '<button class="sp-item" ' + x.attrs + '><span class="sp-type">' + x.type + '</span><span class="sp-main"><span class="sp-title">' + esc(x.title) + '</span><span class="sp-sub">' + esc(x.sub) + '</span></span><span class="sp-arrow">→</span></button>').join('') +
    '<div class="sp-foot"><span>回车打开选中的那条；点一条也可以。</span>' + (taskHits ? '<button class="link-btn" data-act="search-filter-tasks">只看任务（' + taskHits + '）</button>' : '') + '</div>' :
    '<div class="sp-empty">没有找到匹配的任务、流程、决定或记录。换个词试试，或者直接新建。</div>';
  pop.hidden = false;
}

document.addEventListener('change', function(ev){
  if(ev.target.id === 'ntType'){
    const box = document.getElementById('ntTypeFields');
    if(box) box.innerHTML = taskTypeFields(ev.target.value);
  }
});

document.addEventListener('input', function(ev){
  if(ev.target.id === 'globalSearch'){
    state.search = ev.target.value;
    updateSearchPop();
    return;
  }
  if(ev.target.id === 'taskSearch'){
    state.taskQuery = ev.target.value;
    const pos = ev.target.selectionStart;
    render();
    const el = $('#taskSearch'); if(el){ el.focus(); try{ el.setSelectionRange(pos, pos); }catch(e){} }
  }
});

document.addEventListener('keydown', function(ev){
  if(ev.target.id === 'globalSearch' && ev.key === 'Enter'){
    const q = ev.target.value.trim();
    state.search = q;
    const items = searchItems(q);
    const sp = $('#searchPop'); if(sp) sp.hidden = true;
    if(!items.length){ toast('没有找到「' + q + '」；关键词留着，可以换个词。', true); return; }
    const first = sp ? sp.querySelector('.sp-item') : null;
    if(first){ first.click(); return; }
    toast('这条结果打不开，换个词试试。', true);
  }
  if(ev.key === 'Escape'){ const sp = $('#searchPop'); if(sp) sp.hidden = true; }
});

function closeDrawer(){ state.drawer = null; renderDrawer(); }

/* ============================================================
   boot
   ============================================================ */
state.notes = [];
state.acked = new Set();
render();
setTimeout(function(){ if(!state.anno){ $('#toastRoot').innerHTML = ''; } }, 900);

</script>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-label="任务生命周期与条件分支"><title>任务生命周期与条件分支</title><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#24649A"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#126C64"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#627489"/></marker></defs><rect x="0.6" y="0.6" width="958.8" height="408.8" rx="18" fill="#F5F7FA" stroke="#CBD6E1"/><g font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><text x="30" y="37" fill="#172C3E" font-size="23" font-weight="700" text-anchor="start">从交办到验收：完整任务生命周期</text><text x="930" y="35" fill="#506579" font-size="12" font-weight="600" text-anchor="end">03 / LIFECYCLE</text><rect x="30" y="76" width="164" height="134" rx="10" fill="#FFFFFF" stroke="#CBD6E1" stroke-width="1.2"/><text x="43" y="100" fill="#24649A" font-size="12" font-weight="700" text-anchor="start">01</text><text x="43" y="128" fill="#172C3E" font-size="19" font-weight="650" text-anchor="start">接单</text><text x="43" y="156" fill="#506579" font-size="13" font-weight="400" text-anchor="start">目标与材料</text><text x="43" y="178" fill="#506579" font-size="13" font-weight="400" text-anchor="start">接单回执</text><path d="M194 144 H213" fill="none" stroke="#24649A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="214" y="76" width="164" height="134" rx="10" fill="#FFFFFF" stroke="#CBD6E1" stroke-width="1.2"/><text x="227" y="100" fill="#24649A" font-size="12" font-weight="700" text-anchor="start">02</text><text x="227" y="128" fill="#172C3E" font-size="19" font-weight="650" text-anchor="start">规划</text><text x="227" y="156" fill="#506579" font-size="13" font-weight="400" text-anchor="start">约束与分工</text><text x="227" y="178" fill="#506579" font-size="13" font-weight="400" text-anchor="start">固定流程版本</text><path d="M378 144 H397" fill="none" stroke="#24649A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="398" y="76" width="164" height="134" rx="10" fill="#FFFFFF" stroke="#CBD6E1" stroke-width="1.2"/><text x="411" y="100" fill="#24649A" font-size="12" font-weight="700" text-anchor="start">03</text><text x="411" y="128" fill="#172C3E" font-size="19" font-weight="650" text-anchor="start">执行</text><text x="411" y="156" fill="#506579" font-size="13" font-weight="400" text-anchor="start">按依赖调度</text><text x="411" y="178" fill="#506579" font-size="13" font-weight="400" text-anchor="start">监督与协作</text><path d="M562 144 H581" fill="none" stroke="#24649A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="582" y="76" width="164" height="134" rx="10" fill="#FFFFFF" stroke="#CBD6E1" stroke-width="1.2"/><text x="595" y="100" fill="#24649A" font-size="12" font-weight="700" text-anchor="start">04</text><text x="595" y="128" fill="#172C3E" font-size="19" font-weight="650" text-anchor="start">核验</text><text x="595" y="156" fill="#506579" font-size="13" font-weight="400" text-anchor="start">成果登记</text><text x="595" y="178" fill="#506579" font-size="13" font-weight="400" text-anchor="start">证据与验收</text><path d="M746 144 H765" fill="none" stroke="#24649A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="766" y="76" width="164" height="134" rx="10" fill="#E5F3EF" stroke="#126C64" stroke-width="1.2"/><text x="779" y="100" fill="#126C64" font-size="12" font-weight="700" text-anchor="start">05</text><text x="779" y="128" fill="#172C3E" font-size="19" font-weight="650" text-anchor="start">交付</text><text x="779" y="156" fill="#506579" font-size="13" font-weight="400" text-anchor="start">状态与原件</text><text x="779" y="178" fill="#506579" font-size="13" font-weight="400" text-anchor="start">回报原会话</text><text x="30" y="249" fill="#506579" font-size="15" font-weight="600" text-anchor="start">按需要进入条件分支，不必所有任务都经历人工操作</text><rect x="30" y="264" width="286" height="86" rx="12" fill="#FFF2D9" stroke="#D4B475" stroke-width="1.2"/><text x="45" y="290" fill="#925B18" font-size="17" font-weight="650" text-anchor="start">启动前</text><text x="45" y="313" fill="#506579" font-size="13" font-weight="400" text-anchor="start">暂缓草稿 / 启动确认</text><text x="45" y="333" fill="#506579" font-size="13" font-weight="400" text-anchor="start">按范围授权，再启动</text><rect x="337" y="264" width="286" height="86" rx="12" fill="#FFF2D9" stroke="#D4B475" stroke-width="1.2"/><text x="352" y="290" fill="#925B18" font-size="17" font-weight="650" text-anchor="start">运行中</text><text x="352" y="313" fill="#506579" font-size="13" font-weight="400" text-anchor="start">工作流审批 / 工具授权</text><text x="352" y="333" fill="#506579" font-size="13" font-weight="400" text-anchor="start">阻塞、停止或按记录恢复</text><rect x="644" y="264" width="286" height="86" rx="12" fill="#FFF2D9" stroke="#D4B475" stroke-width="1.2"/><text x="659" y="290" fill="#925B18" font-size="17" font-weight="650" text-anchor="start">成果后</text><text x="659" y="313" fill="#506579" font-size="13" font-weight="400" text-anchor="start">检查具体版本 / 定向返工</text><text x="659" y="333" fill="#506579" font-size="13" font-weight="400" text-anchor="start">按获准策略重新推进</text><text x="480" y="380" fill="#506579" font-size="12" font-weight="400" text-anchor="middle">返工或恢复：受策略、状态与授权限制</text></g></svg>

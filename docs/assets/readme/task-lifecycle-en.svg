t-size="19" font-weight="650" text-anchor="start">Plan</text><text x="227" y="156" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Scope and steps</text><text x="227" y="178" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Pin workflow version</text><path d="M378 144 H397" fill="none" stroke="#24649A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="398" y="76" width="164" height="134" rx="10" fill="#FFFFFF" stroke="#CBD6E1" stroke-width="1.2"/><text x="411" y="100" fill="#24649A" font-size="12" font-weight="700" text-anchor="start">03</text><text x="411" y="128" fill="#172C3E" font-size="19" font-weight="650" text-anchor="start">Execute</text><text x="411" y="156" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Dependency dispatch</text><text x="411" y="178" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Supervise / coordinate</text><path d="M562 144 H581" fill="none" stroke="#24649A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="582" y="76" width="164" height="134" rx="10" fill="#FFFFFF" stroke="#CBD6E1" stroke-width="1.2"/><text x="595" y="100" fill="#24649A" font-size="12" font-weight="700" text-anchor="start">04</text><text x="595" y="128" fill="#172C3E" font-size="19" font-weight="650" text-anchor="start">Review</text><text x="595" y="156" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Register artifacts</text><text x="595" y="178" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Evidence and review</text><path d="M746 144 H765" fill="none" stroke="#24649A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="766" y="76" width="164" height="134" rx="10" fill="#E5F3EF" stroke="#126C64" stroke-width="1.2"/><text x="779" y="100" fill="#126C64" font-size="12" font-weight="700" text-anchor="start">05</text><text x="779" y="128" fill="#172C3E" font-size="19" font-weight="650" text-anchor="start">Deliver</text><text x="779" y="156" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Status and files</text><text x="779" y="178" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Report to source</text><text x="30" y="249" fill="#506579" font-size="15" font-weight="600" text-anchor="start">Conditional paths — human action only when required</text><rect x="30" y="264" width="286" height="86" rx="12" fill="#FFF2D9" stroke="#D4B475" stroke-width="1.2"/><text x="45" y="290" fill="#925B18" font-size="17" font-weight="650" text-anchor="start">Before launch</text><text x="45" y="313" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Defer draft / confirm launch</text><text x="45" y="333" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Authorize scope, then start</text><rect x="337" y="264" width="286" height="86" rx="12" fill="#FFF2D9" stroke="#D4B475" stroke-width="1.2"/><text x="352" y="290" fill="#925B18" font-size="17" font-weight="650" text-anchor="start">During execution</text><text x="352" y="313" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Workflow approval / tool approval</text><text x="352" y="333" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Block, stop, or recover from records</text><rect x="644" y="264" width="286" height="86" rx="12" fill="#FFF2D9" stroke="#D4B475" stroke-width="1.2"/><text x="659" y="290" fill="#925B18" font-size="17" font-weight="650" text-anchor="start">After results</text><text x="659" y="313" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Review exact version / scoped rework</text><text x="659" y="333" fill="#506579" font-size="13" font-weight="400" text-anchor="start">Resume only under permitted policy</text><text x="480" y="380" fill="#506579" font-size="12" font-weight="400" text-anchor="middle"